/* ---------- flujo ---------- */
function ir(p){
  S.pant = p; S._arriba = true; render(); ajustarWake();
  if(NATIVA) return;
  if(p === 'inicio'){ if(history.state && history.state.dl === 'guardia'){ consumiendo = true; history.back(); } }
  else armarAtras();
}
function empezar(){
  S.esc = 0; S.fase = 'carta'; S.abierto = false; S.t0 = null; S.usadas = {};
  S.inicio = Math.random() < .5 ? 0 : 1; S.turno = S.inicio; S.ciclo = 0;
  S.p.forEach(P => { P.fichas = X().fichas.inicial; P.secreto = null; P.cumplido = false; P.personaje = ''; P.mascara = null; });
  S.or = {paso:'intro', propios:['',''], lista:[], marcas:[{},{}], i:0, coinc:[], hecho:false};
  S.finRevelado = false; S.alcobaMazo = false; S.finalSuave = false; S.papel = null; S.pp = {who:0, ver:false};
  pedirWake(); ir('escena');
}
function romper(el){
  if(S._rompiendo) return;
  S._rompiendo = true;
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.classList.add('roto');
  setTimeout(() => { S._rompiendo = false; S.abierto = true; S._arriba = true; render(); }, quieto ? 0 : 430);
}
function aPapeles(e){
  if(!(e.papeles && e.papeles.length === 2)) return false;
  if(!S.papel) S.papel = Math.random() < .5 ? [0, 1] : [1, 0];
  S.fase = 'papeles'; S.pp = {who:0, ver:false}; return true;
}
function trasPapeles(){
  const e = esc();
  if(e.tipo === 'guiada'){ S.fase = 'pasos'; S.t0 = Date.now(); }
  else { S.fase = 'juego'; S.t0 = Date.now(); S.carta = null; S.agotado = false; }
}
function trasCarta(){
  const e = esc(); S.abierto = false;
  if(e.personajes){ S.fase = 'personajes'; S.pj = {who:0, ver:false}; }
  else if(e.tipo !== 'final' && aPapeles(e)){}
  else if(e.tipo === 'guiada'){ S.fase = 'pasos'; S.t0 = Date.now(); }
  else if(e.tipo === 'mazo'){ S.fase = 'juego'; S.t0 = Date.now(); S.carta = null; S.agotado = false; }
  else { S.fase = 'final'; S.t0 = null; }
  ir('escena');
}
function siguiente(){
  S.esc++; S.fase = 'carta'; S.abierto = false; S.carta = null; S.revelada = false;
  S.agotado = false; S.sinCartas = null; S.t0 = null; S.alcobaMazo = false;
  ir('escena');
}

/* ---------- acciones ---------- */
function accion(a, d, el){
  switch(a){
    case 'nueva': S.confOlvidar = false; ir('elegir-modo'); break;
    case 'seguir-partida': {
      const pa = cargarPartida(), g = cargar();
      if(!pa){ S.guardada = g; render(); return; }
      S = Object.assign(nuevo(), pa.s); S.guardada = g;
      ir(S.pant);
      if(S.modo === 'escapada' && S.eg && S.pant === 'escena'){ prepararCanal(); sincronizarAvisos(); tickEsc(true); limpiarBandeja(); }
      break;
    }
    case 'borrar-partida':
      if(!S.confBorrar){ S.confBorrar = true; render(); }
      else { borrarPartida(); S.confBorrar = false; render(); }
      break;
    case 'elegir-modo': S.modo = d.m; if(d.m === 'escapada'){ S.amb = 'escapada'; ir('elegir-est'); } else { S.amb = null; ir('elegir-amb'); } break;
    case 'elegir-amb':
      S.amb = d.amb; S.checks = {}; S.creada = Date.now(); prepararPropias(); guardar();
      ir('preparacion'); break;
    case 'reanudar': {
      const g = S.guardada; if(!g) return;
      S.modo = g.modo; S.amb = g.amb; S.est = g.est || null; S.alo = g.alo || null; S.checks = g.checks || {}; S.inv = Object.assign({de:'', para:'', cuando:'', nota:''}, g.inv || {}); S.creada = g.creada;
      prepararPropias(); ir('preparacion'); break;
    }
    case 'olvidar':
      if(!S.confOlvidar){ S.confOlvidar = true; render(); }
      else { olvidar(); S.confOlvidar = false; render(); }
      break;
    case 'volver-inicio': { const g = cargar(); S = nuevo(); S.guardada = g; cerrarVelo(); ir('inicio'); break; }
    case 'volver-modo': ir('elegir-modo'); break;
    case 'imprimir-lista': imprimir(htmlLista()); break;
    case 'imprimir-inv': imprimir('<div class="tarjeta">' + htmlInvitacion() + '</div>'); break;
    case 'compartir-inv': compartirInvitacion(); break;
    case 'preparar':
      if(!S.p[0].nombre.trim() && S.inv.de.trim()) S.p[0].nombre = S.inv.de.trim();
      if(!S.p[1].nombre.trim() && S.inv.para.trim()) S.p[1].nombre = S.inv.para.trim();
      ir('nombres'); break;
    case 'nombres-ok':
      if(!S.p[0].nombre.trim() || !S.p[1].nombre.trim()){ S.err = 'Escribid los dos nombres; pueden ser apodos.'; render(); return; }
      S.err = ''; ir('noes'); break;
    case 'veto': alternar(S.vetos, d.t, !S.vetos.includes(d.t)); render(); break;
    case 'noes-ok': S.priv = {who:0, ver:false}; ir('privado'); break;
    case 'priv-mostrar': S.priv.ver = true; ir('privado'); break;
    case 'priv-ok':
      if(S.priv.who === 0){ S.priv = {who:1, ver:false}; ir('privado'); }
      else ir(M().pideFrenos ? 'frenos' : 'llegada');
      break;
    case 'frenos-ok': ir('llegada'); break;
    case 'empezar': if(S.modo === 'escapada') empezarEscapada(); else empezar(); break;
    case 'romper': romper(el); break;
    case 'carta-ok': trasCarta(); break;
    case 'pj-mostrar': S.pj.ver = true; ir('escena'); break;
    case 'azar-nombre': S.p[+d.i].personaje = azar(A().nombres) + ' ' + azar(A().apellidos); render(); break;
    case 'robar-secreto': repartirSecreto(+d.i); render(); break;
    case 'pj-ok':
      if(S.pj.who === 0){ S.pj = {who:1, ver:false}; }
      else if(!aPapeles(esc())){ S.fase = 'pasos'; S.t0 = Date.now(); }
      ir('escena'); break;
    case 'pp-mostrar': S.pp.ver = true; ir('escena'); break;
    case 'pp-ok':
      if(S.pp.who === 0) S.pp = {who:1, ver:false};
      else trasPapeles();
      ir('escena'); break;
    case 'pp-releer': abrirVelo('<h2>¿Quién lo lee?</h2><p class="sub">Que la otra persona aparte la vista.</p>' + [0, 1].map(i => '<button class="btn" data-a="pp-ver" data-i="' + i + '">' + h(nom(i)) + '</button>').join('') + '<button class="btn fant" data-a="cerrar">Volver</button>'); break;
    case 'pp-ver': abrirVelo(vPapelPrivado(+d.i)); break;
    case 'giro': {
      const l = girosLibres(esc());
      if(l.length){ const g = azar(l); S.usadas['g:' + g.id] = true; abrirVelo(vGiro(g)); guardarPartida(); render(); }
      break;
    }
    case 'robar': robarA(); ir('escena'); break;
    case 'girar': S.revelada = true; render(); break;
    case 'hecho':
      if(turnos()) S.turno = 1 - S.turno; else S.ciclo++;
      S.carta = null; S.revelada = false; ir('escena'); break;
    case 'cambiar':
      if(turnos()) robarA(); else elegirTemp(S.carta ? (S.carta.pedida || S.carta.temp) : 'seda');
      render(); break;
    case 'temp': elegirTemp(d.t); ir('escena'); break;
    case 'encontrado': abrirVelo(vEncontrado()); break;
    case 'a-puerta': S.fase = 'puerta'; ir('escena'); break;
    case 'abrir': siguiente(); break;
    case 'cerrada': S.fase = 'cerrada'; ir('escena'); break;
    case 'seguir-sala': S.fase = esc().tipo === 'guiada' ? 'pasos' : 'juego'; ir('escena'); break;
    case 'terminar': S.finalSuave = true; borrarPartida(); cerrarVelo(); ir('fin'); break;
    case 'oraculo': if(S.modo === 'escapada') S.eg.sub = 'oraculo'; else S.fase = 'oraculo'; S.or.paso = 'intro'; ir('escena'); break;
    case 'or-movil': S.or.lista = listaOraculo(); S.or.marcas = [{}, {}]; S.or.coinc = []; S.or.paso = S.or.lista.length ? 'c0' : 'res'; ir('escena'); break;
    case 'or-cartas': S.or.lista = listaOraculo(6); S.or.i = 0; S.or.coinc = []; S.or.paso = S.or.lista.length ? 'cartas' : 'res'; ir('escena'); break;
    case 'or-mostrar': S.or.paso = S.or.paso === 'c0' ? 'm0' : 'm1'; ir('escena'); break;
    case 'or-listo':
      if(S.or.paso === 'm0') S.or.paso = 'c1';
      else { S.or.coinc = S.or.lista.filter((x, k) => S.or.marcas[0][k] && S.or.marcas[1][k]); S.or.paso = 'res'; }
      ir('escena'); break;
    case 'or-si': S.or.coinc.push(S.or.lista[S.or.i]); S.or.i++; if(S.or.i >= S.or.lista.length) S.or.paso = 'res'; ir('escena'); break;
    case 'or-calla': S.or.i++; if(S.or.i >= S.or.lista.length) S.or.paso = 'res'; ir('escena'); break;
    case 'or-fin': S.or.hecho = true; if(S.modo === 'escapada') S.eg.sub = 'hub'; else S.fase = 'juego'; ir('escena'); break;
    case 'or-salir': if(S.modo === 'escapada') S.eg.sub = 'hub'; else S.fase = 'juego'; ir('escena'); break;
    case 'final-revelar': S.finRevelado = true; render(); break;
    case 'final-cumplido': S.p[+d.i].cumplido = !S.p[+d.i].cumplido; render(); break;
    case 'alcoba-mazo': S.alcobaMazo = true; S.carta = null; S.revelada = false; S.agotado = false; ir('escena'); break;
    case 'alcoba-dejar': S.alcobaMazo = false; S.carta = null; ir('escena'); break;
    case 'fin': borrarPartida(); ir('fin'); break;
    case 'olvidar-fin': olvidar(); render(); break;
    case 'pausa': abrirVelo(vPausa()); break;
    case 'rojo':
      if(MU.on){ MU.on = false; pararMusica(); }
      if(S.modo === 'escapada' && S.eg && ESCAPADA.fases[S.eg.fase].horizonte && !(S.eg.pausa && S.eg.pausa.hasta == null)){ pausar(0); render(); }
      abrirVelo(vRojo()); break;
    case 'fichas': abrirVelo(vFichas()); break;
    case 'ficha': { const P = S.p[+d.i]; P.fichas = Math.max(0, P.fichas + (+d.d)); abrirVelo(vFichas()); break; }
    case 'secreto': abrirVelo(vQuienSecreto()); break;
    case 'secreto-de': abrirVelo(vCortinaModal(+d.i)); break;
    case 'secreto-ver': abrirVelo(vSecretoModal(+d.i)); break;
    case 'cumplido': S.p[+d.i].cumplido = !S.p[+d.i].cumplido; abrirVelo(vSecretoModal(+d.i)); break;
    case 'ayuda': S.confSalir = false; abrirVelo(vAyuda()); break;
    case 'ver-lista': abrirVelo(vListaModal()); break;
    case 'salir':
      if(!S.confSalir){ S.confSalir = true; abrirVelo(vAyuda()); }
      else { borrarPartida(); cerrarVelo(); const g = cargar(); S = nuevo(); S.guardada = g; ir('inicio'); }
      break;
    /* escapada */
    case 'elegir-est': S.est = d.est; ir('elegir-alo'); break;
    case 'elegir-alo':
      S.alo = d.alo; S.checks = {}; S.creada = Date.now(); prepararPropias(); guardar();
      ir('preparacion'); break;
    case 'volver-est': ir('elegir-est'); break;
    case 'pedir-avisos': prepararCanal(); comprobarAvisos(true); break;
    case 'conduce': {
      S.conduce = +d.i;
      const g = S.eg;
      if(g){ g.conduce = S.conduce; if(g.fase === 'viaje'){ quitarAgenda(() => true); g.ranuras = {}; planificar(); } }
      render(); break;
    }
    case 'e-fase':
      if(d.f === 'perdidos' && !perdidosOk()) return;
      cambiarFase(d.f); break;
    case 'e-fases': abrirVelo(vFasesModal()); break;
    case 'e-girar': { const it = S.eg.ranuras[d.s]; if(it) it.leida = true; render(); break; }
    case 'e-ver': abrirVelo(vCortinaProp(d.s)); break;
    case 'e-mostrar': { const it = S.eg.ranuras[d.s]; if(it) it.leida = true; abrirVelo(vPropModal(d.s)); render(); break; }
    case 'e-hecho': delete S.eg.ranuras[d.s]; cerrarVelo(); render(); break;
    case 'e-otra': {
      const g = S.eg, k = d.s, para = (k === 'copi' || k === 'ambos') ? k : +k;
      const p = elegirProp(g.fase, para, reservadas(), Date.now());
      if(p){ g.ranuras[k] = {id:p.id, t:Date.now(), leida:true}; S.usadas[p.id] = true; }
      if(!$velo.hidden) abrirVelo(vPropModal(k));
      render(); break;
    }
    case 'e-ya':
      if(S.eg.fase === 'explora') replanRetos(+d.i, Date.now(), true);
      else { quitarAgenda(() => true); planificar(Date.now(), true); }
      tickEsc(true); render(); break;
    case 'e-reto-ver': abrirVelo(vCortinaReto(+d.i)); break;
    case 'e-reto-mostrar': { const r = S.eg.retos[+d.i]; if(r) r.visto = true; abrirVelo(vRetoModal(+d.i)); render(); break; }
    case 'e-reto-suave': { const r = S.eg.retos[+d.i]; if(r && r.estado === 'activo') r.estado = 'suave'; abrirVelo(vRetoModal(+d.i)); render(); break; }
    case 'e-reto-cumplido': case 'e-reto-no': {
      const i = +d.i, g = S.eg, r = g.retos[i];
      if(r && (r.estado === 'activo' || r.estado === 'suave')){
        if(a === 'e-reto-cumplido'){ r.estado = 'cumplido'; g.escalon[i] = Math.min(4, g.escalon[i] + 1); }
        else { r.estado = 'rechazado'; g.escalon[i] = Math.max(1, g.escalon[i] - 1); g.rechazos[i]++; (g.vetadas = g.vetadas || {})[r.id] = true; }
        replanRetos(i, Date.now() + minAzar(ESCAPADA.fases.explora.pausa));
      }
      cerrarVelo(); render(); break;
    }
    case 'e-reto-cambiar': {
      const i = +d.i, r = S.eg.retos[i];
      if(r) r.estado = 'cambiado';
      replanRetos(i, Date.now(), true); tickEsc(true);
      const n = S.eg.retos[i]; if(n && n.estado === 'activo') n.visto = true;
      abrirVelo(vRetoModal(i)); render(); break;
    }
    case 'e-pausa': pausar(+d.m); cerrarVelo(); render(); break;
    case 'e-quitar-pausa': quitarPausa(); cerrarVelo(); tickEsc(true); render(); break;
    case 'e-viene': abrirVelo(vVieneAlguien()); break;
    case 'e-carta-ok': {
      const g = S.eg; S.abierto = false;
      if(g.fase === 'perdidos'){ g.sub = 'mazo'; S.t0 = Date.now(); S.carta = null; S.revelada = false; }
      else g.sub = 'hub';
      ir('escena'); break;
    }
    case 'e-mazo': S.eg.sub = 'mazo'; S.carta = null; S.revelada = false; S.sinCartas = null; if(!S.t0) S.t0 = Date.now(); ir('escena'); break;
    case 'e-fin-perdidos': cambiarFase('cena'); break;
    case 'e-dejar': S.eg.sub = 'hub'; S.carta = null; S.revelada = false; ir('escena'); break;
    /* música */
    case 'mu-on': if(MU.fin){ MU.on = true; guardarPrefMusica(); siguientePista(true); relojMu(); } else alternarMusica(); return;
    case 'mu-sig': siguientePista(true); return;
    case 'mu-cancion': empezarCancion(); return;
    case 'mu-pref': MU.on = d.on === '1'; guardarPrefMusica(); render(); return;
    case 'mu-creditos': abrirVelo(vCreditosMusica()); return;
    case 'cerrar': cerrarVelo(); break;
  }
  guardarPartida();
}

function setCampo(c, v){
  let m = c.match(/^p([01])\.(.+)$/);
  if(m){
    const P = S.p[+m[1]], k = m[2];
    let mm;
    if(k === 'nombre' || k === 'personaje' || k === 'pref' || k === 'frenosTxt'){ P[k] = v; return; }
    if(k === 'mascara'){ P.mascara = +v; return; }
    if((mm = k.match(/^ace:(.+)$/))){ alternar(P.ace, mm[1], v); return; }
    if((mm = k.match(/^frenos:(.+)$/))){ alternar(P.frenos, mm[1], v); return; }
    if((mm = k.match(/^aceTxt\.(\d)$/))){ P.aceTxt[+mm[1]] = v; return; }
    if((mm = k.match(/^prop\.(\d)\.(txt|sala|temp|tipo)$/))){ P.propias[+mm[1]][mm[2]] = v; return; }
    return;
  }
  if((m = c.match(/^check\.(\d+)$/))){ S.checks[m[1]] = v; guardar(); return; }
  if((m = c.match(/^inv\.(de|para|cuando|nota)$/))){ S.inv[m[1]] = v; guardar(); refrescarInvitacion(); return; }
  if((m = c.match(/^or\.p([01])$/))){ S.or.propios[+m[1]] = v; return; }
  if((m = c.match(/^or\.m([01])\.(\d+)$/))){ S.or.marcas[+m[1]][+m[2]] = v; return; }
}

/* ---------- vistas ---------- */
function render(){
  document.body.classList.toggle('encender', S.modo === 'encender');
  ['explicito', 'rol'].forEach(m => document.body.classList.toggle('m-' + m, S.modo === m));
  Object.keys(AMBIENTES).forEach(k => document.body.classList.toggle('amb-' + k, S.amb === k));
  let v = '';
  switch(S.pant){
    case 'inicio': v = vInicio(); break;
    case 'elegir-modo': v = vElegirModo(); break;
    case 'elegir-amb': v = vElegirAmb(); break;
    case 'elegir-est': v = vElegirEst(); break;
    case 'elegir-alo': v = vElegirAlo(); break;
    case 'preparacion': v = vPreparacion(); break;
    case 'nombres': v = vNombres(); break;
    case 'noes': v = vNoes(); break;
    case 'privado': v = vPrivado(); break;
    case 'frenos': v = vFrenos(); break;
    case 'llegada': v = vLlegada(); break;
    case 'escena': v = vEscena() + vBarra(); break;
    case 'fin': v = vFin(); break;
  }
  $app.innerHTML = aTarde(v);
  sincronizarMusica();
  if(S._arriba){
    S._arriba = false; window.scrollTo(0, 0);
    const f = $app.querySelector('[data-foco]'); if(f) f.focus({preventScroll:true});
  }
}

    '<p class="nota privacidad">Funciona sin conexión y todo se queda en este dispositivo: la noche que preparéis y, mientras dura, la partida, para poder seguir si se cierra. Lo que el Oráculo pregunta en secreto no se guarda nunca, y al terminar la partida se borra lo que escribisteis en ella.</p></main>';

function vPreparacion(){
  if(S.modo === 'escapada') return vPrepEsc();
  const x = X(), m = M();
  return '<main class="page"><h2 data-foco tabindex="-1">' + h(x.titulo) + '</h2><p class="gancho">' + h(x.gancho) + '</p>' +

function lineaFase(){
  const g = S.eg, f = g.fase;
  if(f === 'viaje') return g.conduce >= 0 ? 'Conduce ' + nom(g.conduce) + ' y lee ' + nom(1 - g.conduce) + '.' : 'Nadie conduce: leéis por turnos.';
  if(f === 'llegada' || f === 'cena') return 'Lo personal, solo lo mira la persona a la que va.';
  if(f === 'explora') return 'Cada persona mira solo su reto.';

}

function lectorDe(k){ return k === 'copi' ? copiloto() : (k === 'ambos' ? null : +k); }

function vRanuras(){
  const g = S.eg, f = g.fase, claves = ['copi', 'ambos', '0', '1'].filter(k => g.ranuras[k]);
  if(!claves.length){
    return '<div class="vacio"><p>Nada por ahora.</p><p class="sub">' + (f === 'viaje' ? 'Lo siguiente llegará solo. Disfrutad del camino.' : 'Lo siguiente llegará solo, con calma.') + '</p></div>' +
      (g.pausa ? '' : '<button class="btn fant" data-a="e-ya">Que llegue algo ahora</button>');
  }
  return claves.map(k => {
    const it = g.ranuras[k];
    if(f !== 'viaje' && (k === '0' || k === '1')){
      const i = +k;
      return '<button class="invit" data-a="e-ver" data-s="' + k + '"><span class="mini-lacre e" aria-hidden="true">' + h(nom(i).charAt(0).toUpperCase()) + '</span><b>Para ' + h(nom(i)) + '</b><span class="txt">' +
        (it.leida ? 'Ya está leída. Cuando esté hecha, marcadla.' : 'Ha llegado algo solo para ' + h(nom(i)) + '. Que nadie más mire.') + '</span></button>';
    }
    if(!it.leida) return vDorsoEsc(k);
    return vPropCara(k, it) + '<div class="fila"><button class="btn" data-a="e-otra" data-s="' + k + '">Otra</button><button class="btn prim" data-a="e-hecho" data-s="' + k + '">Hecho</button></div>' +
      '<button class="btn fant" data-a="e-hecho" data-s="' + k + '">Ahora no</button>';
  }).join('');
}
function vEscRetos(){
  const g = S.eg;
  const panel = i => {
    const r = g.retos[i], prox = g.agenda.some(a => a.k === 'reto' && a.para === i), vivo = !!(r && (r.estado === 'activo' || r.estado === 'suave'));
    let estado, btn;
    if(vivo){
      estado = (r.estado === 'suave' ? 'Reto suavizado. ' : 'Reto en marcha. ') + '<span data-hasta="' + r.t1 + '">' + h(textoHasta(r.t1)) + '</span>';
      btn = '<button class="btn prim" data-a="e-reto-ver" data-i="' + i + '">' + (r.visto ? 'Volver a mirar mi reto' : 'Ver mi reto') + '</button>';
    } else {
      const antes = r ? ({cumplido:'Cumplido. ', rechazado:'Rechazado, y no se insiste. ', caducado:'Caducado. '}[r.estado] || '') : '';
      estado = antes + (prox ? (r ? 'El siguiente' : 'El primero') + ' llegará solo, en unos minutos.' : 'Por ahora no llega ninguno más.');
      btn = g.pausa ? '' : '<button class="btn fant" data-a="e-ya" data-i="' + i + '">Que llegue ya</button>';
    }
    return '<section class="reto' + (vivo ? ' activo' : '') + '" aria-label="Reto de ' + h(nom(i)) + '"><p class="r-quien">' + h(nom(i)) + '</p><p class="r-estado">' + estado + '</p>' + btn + '</section>';
  };
  return '<div class="retos">' + panel(0) + panel(1) + '</div>' +
    '<p class="regla"><b>A solas de verdad:</b> lo que pase de un beso, solo donde nadie pueda veros ni llegar sin que lo oigáis.</p>';
}
function vEscSalidas(){
  const f = S.eg.fase;
  const b = (fz, txt, prim) => '<button class="btn' + (prim ? ' prim' : '') + '" data-a="e-fase" data-f="' + fz + '">' + h(txt) + '</button>';
  let s = '';
  if(f === 'viaje') s = b('llegada', 'Hemos llegado', true);
  else if(f === 'llegada') s = b('explora', 'Salir a explorar', true) + b('cena', 'Ir a cenar') + b('alcoba', 'Ir directamente a la alcoba');
  else if(f === 'explora') s = (perdidosOk() ? b('perdidos', 'Nos hemos perdido', true) + '<p class="nota centro">Perdidos abre las cartas al aire libre, con el tono al máximo. Solo si estáis a solas de verdad.</p>' : '') +
    b('cena', 'Volver y cenar', !perdidosOk()) + b('alcoba', 'Ir directamente a la alcoba');
  else if(f === 'cena') s = b('alcoba', 'A la alcoba', true);
  return '<div class="salida">' + s + '</div>';
}

    (S.or.hecho ? vDeseosHechos() : '<p class="sub">Si queréis, antes de las cartas: el oráculo descubre lo que deseáis a la vez sin delatar lo que solo desea una persona.</p><button class="btn" data-a="oraculo">' + h(A().oraculo.boton) + '</button>') +

}
function vRetoModal(i){
  const r = S.eg.retos[i];
  if(!r || !(r.estado === 'activo' || r.estado === 'suave')) return '<h2>Este reto ya no está</h2><p class="sub">Ha caducado o se ha cerrado. El siguiente llegará solo.</p><button class="btn prim" data-a="cerrar">Cerrar</button>';

/* ventanas */
function abrirVelo(html){
  $velo.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + aTarde(html) + '</div>';
  $velo.hidden = false;
  const f = $velo.querySelector('button, input, textarea'); if(f) f.focus();
}
function cerrarVelo(){ $velo.hidden = true; $velo.innerHTML = ''; }
function vPausa(){ if(S.modo === 'escapada' && S.eg && ESCAPADA.fases[S.eg.fase].horizonte) return vPausaEsc(); return '<h2>Pausa</h2><p>Agua, un abrazo, respirad. La partida espera y nadie pierde nada.</p>' + (MU.on ? '<button class="btn" data-a="mu-on">Pausar la música</button>' : '') + '<button class="btn prim" data-a="cerrar">Volver</button>'; }
function vRojo(){
  const viaje = S.modo === 'escapada';
  return '<h2>Rojo</h2><p>' + (viaje ? 'Paramos, sin preguntas incómodas.' + (S.eg && S.eg.pausa ? ' Las propuestas quedan en pausa hasta que la quitéis.' : '') : 'Paramos. Fuera de personaje y sin preguntas incómodas.') + '</p><p class="sub">¿Qué hace falta ahora: hablar, un abrazo o dejarlo aquí? Las tres respuestas están bien.</p>' +
    '<button class="btn" data-a="cerrar">Retomar cuando queráis</button><button class="btn prim" data-a="terminar">' + (viaje ? 'Terminar la escapada' : 'Terminar la noche') + '</button>';
}

  return '<h2>' + h(F.nombre) + '</h2><p class="sub">' + h(F.explica) + '</p>' +
    [0,1].map(i => '<div class="ficha-fila"><span>' + h(nom(i)) + '</span><button class="mini" data-a="ficha" data-i="' + i + '" data-d="-1" aria-label="Quitar ' + h(F.una) + ' a ' + h(nom(i)) + '">−</button><b>' + S.p[i].fichas + '</b><button class="mini" data-a="ficha" data-i="' + i + '" data-d="1" aria-label="Añadir ' + h(F.una) + ' a ' + h(nom(i)) + '">+</button></div>').join('') +

  if(S.p[0].secreto == null && S.p[1].secreto == null) return '<h2>Secretos</h2><p class="sub">Todavía no hay Secretos: se reparten al elegir ' + masc().las + '.</p><button class="btn" data-a="cerrar">Cerrar</button>';
  return '<h2>¿De quién es el Secreto?</h2><p class="sub">Solo puede mirarlo quien lo tiene.</p>' +

  return '<h2>Ayuda</h2><h3>Las señales</h3><dl class="senales">' + senales().map(s => '<dt>' + h(s[0]) + '</dt><dd>' + h(s[1]) + '</dd>').join('') + '</dl>' +
    '<h3>Cómo se juega</h3><ul class="reglas">' + m.reglas.map(r => '<li>' + h(r) + '</li>').join('') + '</ul>' +
    (S.modo === 'escapada' ? '<h3>Seguridad</h3><dl class="senales">' + ESCAPADA.seguridad.map(s => '<dt>' + h(s[0]) + '</dt><dd>' + h(s[1]) + '</dd>').join('') + '</dl>' : '') +

    '<button class="btn" data-a="cerrar">Volver al juego</button>' +

    (S.confSalir ? '<p class="nota">La partida se borra; la noche preparada sigue guardada.</p>' : '');
}
function vListaModal(){

}
function vEncontrado(){
  return '<div class="pergamino">' + A().encontrado.parrafos.map(p => '<p>' + h(p) + '</p>').join('') + '</div><button class="btn prim" data-a="cerrar">Cerrar</button>';
}

/* eventos */
$app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b || b.disabled) return; accion(b.dataset.a, b.dataset, b); });
$velo.addEventListener('click', e => { if(e.target === $velo){ cerrarVelo(); return; } const b = e.target.closest('[data-a]'); if(!b) return; accion(b.dataset.a, b.dataset, b); });
function campo(e){
  const t = e.target;
  if(!t.dataset || !t.dataset.campo) return;
  if(t.type === 'radio' && !t.checked) return;
  setCampo(t.dataset.campo, t.type === 'checkbox' ? t.checked : t.value);
  guardarPartida();
}
document.addEventListener('input', campo);
document.addEventListener('change', campo);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$velo.hidden) cerrarVelo(); });

/* Atrás: durante la partida abre la Pausa; antes, vuelve a la pantalla anterior; en el inicio, sale. */
const PREVIA = {'elegir-modo':'inicio', 'elegir-amb':'elegir-modo', 'elegir-est':'elegir-modo', 'elegir-alo':'elegir-est', 'preparacion':'inicio', 'nombres':'preparacion', 'noes':'nombres', 'privado':'noes', 'frenos':'noes', 'llegada':'noes', 'fin':'inicio'};
let consumiendo = false;
function atras(){
  if(!$velo.hidden){ cerrarVelo(); return true; }
  if(S.pant === 'escena'){ abrirVelo(vPausa()); return true; }
  const prev = PREVIA[S.pant];
  if(!prev) return false;
  if(prev === 'inicio') accion('volver-inicio'); else ir(prev);
  return true;
}
function armarAtras(){ try{ if(!(history.state && history.state.dl === 'guardia')) history.pushState({dl:'guardia'}, ''); }catch(e){} }
if(NATIVA){
  const app = plugin('App');
  if(app && app.addListener) app.addListener('backButton', () => { if(!atras() && app.exitApp) app.exitApp(); });
  // tocar un aviso abre la app: si la escapada estaba cerrada, se retoma en su fase
  const ln = LN();
  if(ln && ln.addListener) ln.addListener('localNotificationActionPerformed', () => {
    if(S.pant === 'escena'){ tickEsc(true); limpiarBandeja(); return; }
    const pa = cargarPartida();
    if(pa && pa.s.modo === 'escapada' && pa.s.pant === 'escena') accion('seguir-partida');
  });
} else {
  window.addEventListener('popstate', () => {
    if(consumiendo){ consumiendo = false; return; }
    if(atras() && S.pant !== 'inicio') armarAtras();
  });
}

iniciarMusica();
/* Con una escapada en marcha, la app abre directamente en su fase (es lo que se espera al tocar un aviso). */
(function(){
  const pa = cargarPartida();
  if(pa && pa.s.modo === 'escapada' && pa.s.pant === 'escena') accion('seguir-partida');
  else render();
})();
</script>
