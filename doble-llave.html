  "carnaval/rol/galeria": [
    {"id":"rg1","t":"El Guante Devuelto","n":2,"tags":["prenda"],"x":"En personaje, devuélvele a tu pareja lo que se le cayó hace un año: una prenda tuya, un pañuelo, lo que tengas. Pónselo tú, despacio, y quítale a cambio una prenda suya."},
    {"id":"rg2","t":"El Espejo que Recuerda","n":2,"tags":["espejo","voz","prenda"],"x":"Ponte a la espalda de tu pareja, frente al espejo. En personaje, cuéntale qué hiciste con su ropa aquella noche, prenda a prenda, y hazlo otra vez mientras lo cuentas."},
    {"id":"rg3","t":"La Carta Interceptada","n":2,"tags":["voz"],"x":"Encuentras una carta en un bolsillo de tu pareja (inventa qué dice: es una carta de amor sin destinatario). Léesela en voz alta, en personaje, y exige saber para quién era. Tu pareja responde con besos, menos en la boca, hasta convencerte."},
    {"id":"rg4","t":"El Retrato sin Terminar","n":2,"tags":["prenda","voz"],"x":"Hace un año alguien empezó un retrato de tu pareja y no lo terminó. Termínalo tú: tu pareja posa con la ropa que quiera quitarse, y tú le describes en voz alta lo que le falta al cuadro."},
    {"id":"rg5","t":"Las Manos se Acuerdan","n":3,"tags":["intimo"],"x":"En personaje, demuestra que te acuerdas: recorre el cuerpo de tu pareja con las manos, por debajo de la ropa, por el mismo camino que hace un año, sin dudar ni una vez. Si dudas, paga un zecchino."},
    {"id":"rg6","t":"El Espejo Roto","n":2,"tags":["espejo"],"x":"Se ha roto un espejo de la Galería: siete años de mala suerte, salvo que alguien bese frente a él cada trozo de piel que se refleje. Rompe la maldición durante una canción: todo menos la boca."},
    {"id":"rg7","t":"La Mentira","n":2,"tags":["voz","prenda"],"x":"Cuéntale a tu pareja una mentira sobre aquella noche, en personaje y con todo detalle. Tu pareja tiene que descubrirla: si la descubre, te quita una prenda; si no, le quitas tú una."},
    {"id":"rg8","t":"Lo que Vio el Espejo","n":3,"tags":["espejo"],"x":"Frente al espejo, piel con piel. En personaje, cuenta lo que vio el espejo hace un año mientras tus manos lo repiten sobre tu pareja. Las bocas, a un dedo de distancia: todavía no."},
    {"id":"rg9","t":"¿Sigo?","n":2,"tags":[],"x":"Para todo. En personaje, pregúntale a tu pareja, mirándole a los ojos en el espejo: «¿Sigo?». Si dice que sí, sigue donde lo dejaste, el doble de despacio."}
  ],
  "carnaval/rol/biblioteca": [
    {"id":"rb1","t":"La Razón","n":3,"tags":["venda","voz"],"x":"Tu pareja lleva la venda. En personaje, cuéntale al oído por qué la historia de hace un año terminó como terminó, y no te pares aunque te tiemble la voz. Mientras hablas, tus labios recorren su cuello."},
    {"id":"rb2","t":"El Beso Pendiente","n":3,"tags":["venda"],"x":"Tú llevas la venda. Tu pareja te da el beso que quedó pendiente hace un año: tan largo como le haga falta. Tú no puedes moverte hasta que termine."},
    {"id":"rb3","t":"La Carta que no se Envió","n":3,"tags":["venda","voz"],"extra":true,"x":"Tu pareja lleva la venda. Abre la Carta encontrada y léela en voz alta, despacio, con los labios rozando su oído: en personaje, es la carta que escribiste hace un año y nunca enviaste. Mientras lees, tu mano libre puede ir a donde quiera."},
    {"id":"rb4","t":"Lo que Faltó","n":3,"tags":["venda","intimo"],"x":"Tu pareja lleva la venda. En personaje, dile qué faltó aquella noche y dáselo ahora, despacio, con la boca, donde te parezca que lo dejasteis."},
    {"id":"rb5","t":"Así me Dejaste","n":3,"tags":["venda","intimo"],"x":"Tú llevas la venda. Tu pareja recorre tu cuerpo entero con la boca, despacio, y se detiene cada vez que estás a punto de pedirle más. En personaje, al oído: «así me dejaste»."},
    {"id":"rb6","t":"El Nombre","n":3,"tags":["venda","confesion"],"x":"Tu pareja lleva la venda. Dile al oído tu nombre real, el de verdad. Después, decide si se lo vuelves a decir más tarde, en otro sitio y en otro tono."},
    {"id":"rb7","t":"La Campana Adelantada","n":3,"tags":["venda","silencio"],"x":"Tú llevas la venda. Tu pareja imita una campana a lo lejos y, en personaje, temes que sea la de San Marcos. Tu pareja tiene una canción para convencerte de que no lo es, sin decir una sola palabra."},
    {"id":"rb8","t":"Esta Vez No te Vas","n":3,"tags":["venda","atar"],"x":"Tu pareja lleva la venda. Si quiere, átale las muñecas por delante con un pañuelo, flojo y fácil de soltar, y dile en personaje: «esta vez no te vas». Durante una canción, tus manos y tu boca deciden el camino. «Rojo» lo deshace al instante."},
    {"id":"rb9","t":"El Perdón","n":4,"tags":["venda","intimo"],"x":"Tú llevas la venda. En personaje, tu pareja te pide perdón, o te lo concede, sin una sola palabra: con la boca, por todo el cuerpo, hasta que digas «te perdono»."}
  ],
  "carnaval/rol/alcoba": [
    {"id":"ra1","t":"Esta Vez Nadie se Va","n":4,"tags":["intimo"],"x":"En personaje o sin él, haced lo que hace un año se quedó a medias, sin prisa y sin campana. Que dure lo que tenga que durar."},
    {"id":"ra2","t":"Las Deudas","n":4,"tags":[],"x":"Cobrad ahora los zecchini, por turnos: quien cobra pide algo, en personaje si quiere; quien debe lo concede o lo perdona. Empieza quien tenga más."},
    {"id":"ra3","t":"El Guion Roto","n":4,"tags":[],"x":"Romped el papel: durante una canción, cada persona hace lo que su personaje nunca se habría atrevido a hacer, y pide permiso solo con la mirada. Si la mirada dice que sí, adelante."},
    {"id":"ra4","t":"Por qué te Quedas","n":4,"tags":["desnudez"],"x":"Sin ropa y en un abrazo, dile a tu pareja al oído por qué esta vez te quedas. Después, demuéstraselo durante una canción, sin decir nada más."},
    {"id":"ra5","t":"Lo que Quedó Escrito","n":4,"tags":["voz"],"x":"Por turnos, leed en voz alta la carta del sobre pequeño, despacio y al oído. Después haced lo que diga, o algo mejor."},
    {"id":"ra6","t":"La Última Máscara","n":4,"tags":["intimo"],"x":"Ponle a tu pareja tu máscara y quédate sin nada. En personaje por última vez: haz con su cuerpo lo que habrías hecho hace un año si te hubieras atrevido."},
    {"id":"ra7","t":"Sin Campana","n":4,"tags":["intimo","desnudez"],"x":"Sin ropa, sin papeles y sin prisa: cada cual da placer a su pareja, a la vez, hasta que alguien pida tregua. La tregua dura una respiración; después empieza otra noche."}
  ],
  "cotidiana/encender/cocina": [
    {"id":"ec1","temp":"seda","t":"El primer sorbo","tags":["comida"],"x":"Prepara algo caliente para {R} (café, té o chocolate) y dale el primer sorbo tú, soplando antes, con la taza entre tus manos y las suyas. Después, un beso que sepa a lo mismo."},
    {"id":"ec2","temp":"seda","t":"La mermelada","tags":["comida"],"x":"Pon un poco de mermelada, miel o chocolate en tu labio de abajo y acércate a {R} sin decir nada. Que lo pruebe como quiera; tú no te muevas hasta que haya terminado."},
    {"id":"ec3","temp":"seda","t":"Las manos frías","tags":[],"x":"Coge las manos de {R} como si llegaran heladas de la calle. Sopla dentro, frótalas entre las tuyas y bésale despacio cada nudillo hasta que entren en calor. Después, el interior de las muñecas."},
    {"id":"ec4","temp":"seda","t":"A ciegas en la nevera","tags":["venda","comida"],"x":"Tápale los ojos a {R} con un trapo de cocina limpio y dale a probar tres cosas de la nevera: la primera con una cuchara, la segunda de tus dedos y la tercera de tus labios. Que adivine cada una."},
    {"id":"ec5","temp":"seda","t":"Mientras remueve","tags":[],"x":"Mientras {R} remueve el café o corta algo en la encimera, abrázale por la espalda, con tu cuerpo contra el suyo, y apoya la barbilla en su hombro. Respira despacio junto a su cuello hasta que termine, y ojalá tarde."},
    {"id":"ec6","temp":"brasa","t":"Sobre la encimera","tags":["comida"],"x":"{R} se sienta en la encimera, si aguanta, o en una silla. Ponte entre sus rodillas y dale de comer de tu boca: una fresa, un trozo de chocolate, lo que haya. Por cada bocado que coja, un beso más largo que el anterior."},
    {"id":"ec7","temp":"brasa","t":"La gota de miel","tags":["comida","prenda"],"x":"Quítale a {R} lo que lleve de cintura para arriba. Deja caer una gota de miel o de chocolate en su cuello y síguela con la boca por donde baje, sin prisa, aunque baje mucho."},
    {"id":"ec8","temp":"brasa","t":"Bajo el grifo","tags":[],"x":"Lavaos las manos a la vez bajo el mismo chorro de agua caliente: tus manos enjabonan las de {R}, despacio, entre los dedos. Después sécaselas y mete tus manos, todavía calientes, bajo su ropa: la espalda, el vientre, donde las quiera."},
    {"id":"ec9","temp":"brasa","t":"La receta","tags":["voz"],"x":"Dile al oído a {R} la receta de lo que vas a hacerle más tarde, como si leyeras un libro de cocina: los ingredientes, los pasos, el tiempo de cada cosa y a qué temperatura. Después no vuelvas a mencionarlo."}
  ],
  "cotidiana/encender/bano": [
    {"id":"eb1","temp":"seda","t":"El pelo mojado","tags":[],"x":"Sécale el pelo a {R} con una toalla, sin prisa, con las yemas de los dedos a través de la tela, de la frente a la nuca. Cuando esté seco, sigue un rato: nadie te ha dicho que pares."},
    {"id":"eb2","temp":"seda","t":"La toalla del radiador","tags":["desnudez"],"x":"Calienta una toalla en el radiador o con el secador y envuelve en ella a {R}, sin nada debajo si quiere. Masajea su cuerpo a través de la tela hasta que la toalla se enfríe."},
    {"id":"eb3","temp":"seda","t":"Los pies","tags":[],"x":"Llena un barreño o la bañera de agua caliente hasta los tobillos y mete en ella los pies de {R}. Lávaselos despacio, con las manos llenas de jabón, entre los dedos y hasta las rodillas. Después sécalos con la toalla más suave de la casa."},
    {"id":"eb4","temp":"seda","t":"El espejo empañado","tags":[],"x":"Cuando el espejo se empañe, escribe en él con el dedo algo que te guste de {R}. Después ponte a su espalda y bésale la nuca mientras lo lee, hasta que el vapor lo borre."},
    {"id":"eb5","temp":"seda","t":"El peine","tags":[],"x":"Péinale el pelo a {R} delante del espejo, despacio, con los dedos o con un peine, como si tuvierais toda la tarde. Cada vez que se le cierren los ojos, un beso en el cuello."},
    {"id":"eb6","temp":"brasa","t":"La ducha","tags":["agua","desnudez"],"x":"Ducha caliente, sin ropa y a la vez. Tú enjabonas cada centímetro de {R}, despacio, como si le quitaras de encima la lluvia de toda la tarde; {R} solo se deja."},
    {"id":"eb7","temp":"brasa","t":"La ropa empapada","tags":["prenda","desnudez"],"x":"Quítale a {R} la ropa prenda a prenda, como quien quita ropa empapada de lluvia: despacio, y secando con la toalla cada trozo de piel que aparece antes de descubrir el siguiente."},
    {"id":"eb8","temp":"brasa","t":"La crema de después","tags":["aceite","desnudez","intimo"],"x":"Después del agua, la crema. Extiéndela por todo el cuerpo de {R} con las manos calientes, de la nuca a los pies, por delante y por detrás. Sin prisa: ningún rincón tiene por qué quedarse sin crema."},
    {"id":"eb9","temp":"brasa","t":"El vaho","tags":["intimo"],"x":"Con el grifo abierto y el espejo empañado, besa a {R} desde los tobillos hacia arriba, por el interior de las piernas, tan despacio que el vapor llegue antes que tú."}
  ],
  "cotidiana/encender/apagon": [
    {"id":"ea1","temp":"seda","t":"Antes de esta tarde","tags":["voz"],"x":"A oscuras, cuéntale al oído a {R} cómo te imaginabas su casa, su risa o su cama antes de esta tarde, cuando solo os cruzabais en el ascensor. Despacio, con los labios rozando su oreja."},
    {"id":"ea2","temp":"seda","t":"Aprenderse una cara","tags":[],"x":"Recorre la cara de {R} con las yemas de los dedos, como quien se aprende un rostro a oscuras: las cejas, los párpados, la boca, el cuello. Después, lo mismo con los labios."},
    {"id":"ea3","temp":"seda","t":"Respirar a la vez","tags":[],"x":"Ponte a la espalda de {R}, con tu cuerpo contra el suyo y sin usar las manos. Respirad despacio hasta que no se sepa de quién es cada respiración, durante una canción."},
    {"id":"ea4","temp":"seda","t":"El plano de la casa","tags":[],"x":"Con un dedo y por debajo de la ropa, dibuja en la espalda de {R} el plano de tu casa: el pasillo, la cocina, el baño, esta habitación. Cuando llegues a la cama, deja ahí la mano entera."},
    {"id":"ea5","temp":"brasa","t":"Lo que no se ve","tags":["voz"],"x":"A oscuras, dile a {R} con todo detalle lo que estarías viendo ahora si hubiera luz, y lo que harías con eso. Mientras hablas, tus manos lo van comprobando bajo su ropa."},
    {"id":"ea6","temp":"brasa","t":"A tientas","tags":["prenda"],"x":"Quítale a {R} la ropa a tientas, sin luz y sin prisa, adivinando cada botón y cada costura. Por cada prenda que caiga, un beso en la piel que acaba de aparecer, justo donde estaba la tela."},
    {"id":"ea7","temp":"brasa","t":"Sin trampas","tags":["venda","intimo"],"x":"Tápale los ojos a {R} con un pañuelo, aunque esté oscuro: así no hay trampa. Recorre su cuerpo alternando las yemas de los dedos y los labios, cada vez más cerca de donde más lo note, y espera a que te diga «ahí»."},
    {"id":"ea8","temp":"brasa","t":"El pincel","tags":["pluma","intimo"],"x":"Con un pincel limpio, una brocha de maquillaje o la punta de un pañuelo, recorre a oscuras el cuerpo de {R}, despacio, por donde ya no haya ropa. Termina siempre con la boca, en el mismo sitio."},
    {"id":"ea9","temp":"brasa","t":"Preguntar a oscuras","tags":["guia","intimo"],"x":"A oscuras no se ve, así que hay que preguntar. Durante una canción, acaricia a {R} donde te diga y como te diga: «más abajo», «más despacio», «ahí, no pares». Su voz guía; tus manos escuchan."}
  ],
  "cotidiana/encender/dormitorio": [
    {"id":"ed1","temp":"seda","t":"La lámpara de la mesilla","tags":["prenda","desnudez","voz"],"x":"Enciende solo la lámpara de la mesilla y desnuda a {R} despacio, prenda a prenda, mirando cada trozo de piel como si fuera la primera vez. Di en voz baja lo que ves y lo que te provoca."},
    {"id":"ed2","temp":"seda","t":"El edredón","tags":[],"x":"Meteos bajo el edredón con tan poca ropa como queráis: cuanto menos, mejor se oye la piel. Durante una canción solo se mueven las manos, y muy despacio, como un domingo por la mañana."},
    {"id":"ed3","temp":"seda","t":"Sin saltarse nada","tags":["intimo"],"x":"Recorre el cuerpo de {R} con las yemas de los dedos, de los tobillos a la nuca, sin saltarte nada de lo que te deje recorrer. Si encuentras algo que le guste, vuelve a pasar por ahí."},
    {"id":"ed4","temp":"brasa","t":"Sin ascensor","tags":["intimo"],"x":"Durante una canción solo puedes usar la boca. Empieza por los tobillos y sube por el interior de las piernas, piso a piso, como quien sube la escalera sin ascensor. {R} decide en qué piso te quedas."},
    {"id":"ed5","temp":"brasa","t":"La lista","tags":["voz"],"x":"Dile al oído a {R}, como quien dicta una lista, las tres cosas que vas a hacerle ahora, en orden y con palabras exactas. Tacha cada una en cuanto la cumplas, y pregunta «¿te gusta?» antes de pasar a la siguiente."},
    {"id":"ed6","temp":"brasa","t":"La bufanda","tags":["atar"],"x":"Si {R} quiere, átale las muñecas por delante con una bufanda suave, floja y con un nudo que se suelte de un tirón. Así no tiene que hacer nada ni devolver nada: solo recibir. Durante una canción, tus manos y tu boca van despacio por donde {R} se deje. «Rojo» lo deshace al instante."},
    {"id":"ed7","temp":"brasa","t":"La siesta","tags":["desnudez","guia","intimo"],"x":"Tumbaos de lado y sin ropa, tu cuerpo contra la espalda de {R}, como para una siesta que no va a llegar. Tus manos van por delante, sin prisa, por donde {R} las lleve con las suyas."},
    {"id":"ed8","temp":"brasa","t":"El Temporizador","tags":["borde","intimo"],"x":"Pon un temporizador de cinco minutos. Acaricia a {R} donde más lo note y, cada vez que esté a punto, para y mira cuánto queda. Cuando suene, no pares."},
    {"id":"ed9","temp":"seda","t":"La Lluvia en la Ventana","tags":["intimo"],"x":"Con la persiana a medias y la lluvia en el cristal, recorre a {R} con las yemas de los dedos al ritmo de las gotas: despacio, sin saltarte nada de lo que te deje, hasta que deje de llover o hasta que te pida otra cosa."}
  ],
  "cotidiana/explicito/entrada": [
    {"id":"ce1","t":"Contra la Puerta","n":2,"tags":["intimo"],"x":"Tu pareja se apoya en la puerta de entrada, de espaldas a ti. Acaricia su sexo por encima de la ropa interior mientras le besas la nuca. Si se oye el ascensor, no se para nadie."},
    {"id":"ce2","t":"El Perchero","n":2,"tags":["prenda"],"x":"Quítale a tu pareja la prenda que elijas, sin prisa, y cuélgala en el perchero como si fuera un abrigo. Después dile al oído qué vas a colgar a continuación, y no te lo saltes."},
    {"id":"ce3","t":"La Mirilla","n":2,"tags":["intimo","voz"],"x":"Asómate a la mirilla como si alguien del edificio esperara en el rellano. Mientras miras, tu pareja te acaricia por detrás, por dentro de la ropa, y te cuenta al oído lo que esa persona no se imagina."},
    {"id":"ce4","t":"El Espejo del Recibidor","n":3,"tags":["espejo","intimo"],"x":"Frente al espejo de la entrada, ponte a la espalda de tu pareja y recorre su cuerpo entero con las manos, sin saltarte su sexo, mientras os miráis solo en el reflejo. Nadie cierra los ojos hasta que acabe la canción."},
    {"id":"ce5","t":"Lo que Pensé en el Ascensor","n":2,"tags":["voz"],"x":"Dile a tu pareja, sin eufemismos, lo que pensabas hacerle cada vez que coincidíais en el ascensor. Con detalles y mirándole a los ojos. Tu pareja no puede contestar hasta que termines."},
    {"id":"ce6","t":"Las Llaves","n":3,"tags":["intimo"],"x":"Esconde tus llaves dentro de tu ropa interior y deja que tu pareja las busque con la mano, despacio y sin mirar. Cuando las encuentre, que no las saque todavía."},
    {"id":"ce7","t":"El Felpudo","n":3,"tags":["intimo"],"x":"De rodillas sobre el felpudo, delante de tu pareja: bésale el vientre, despacio, y baja hasta su sexo por encima de la ropa interior, sin quitársela, hasta que te pida que lo hagas."},
    {"id":"ce8","t":"A Toda Prisa","n":3,"tags":["prenda","desnudez"],"x":"Desnudaos a la vez, prenda a prenda y a toda prisa, como si alguien fuera a llegar en un minuto. Cuando no quede nada, parad en seco y miraos despacio, de arriba abajo, durante media canción."},
    {"id":"ce9","t":"La Espalda en la Puerta","n":3,"tags":["solo"],"x":"Apoya la espalda en la puerta y tócate delante de tu pareja, que te mira sin poder tocarte. Si llaman al timbre, nadie abre."}
  ],
  "cotidiana/explicito/sofa": [
    {"id":"cs1","t":"La Manta","n":3,"tags":["intimo"],"x":"Bajo la manta del sofá, dale placer a tu pareja con la mano mientras fingís mirar la tele. Tu pareja no puede apartar los ojos de la pantalla; si lo hace, paras y vuelves a empezar."},
    {"id":"cs2","t":"Boca Abajo","n":3,"tags":["aceite","desnudez"],"x":"Tu pareja se tumba boca abajo en el sofá, sin ropa. Dale un masaje con aceite de la nuca a los pies y, por el camino, detente con la boca donde quieras: las nalgas, los muslos, todo lo que se deje."},
    {"id":"cs3","t":"Sin Sonido","n":3,"tags":["voz","intimo"],"x":"Quitadle el sonido a la película. Mientras le das placer con la boca, tu pareja pone la voz: tiene que contar en voz alta, sin eufemismos, lo que siente, como si fuera el diálogo de la película."},
    {"id":"cs4","t":"Cada Cual en su Esquina","n":3,"tags":["solo","desnudez"],"x":"Cada cual en un extremo del sofá, sin ropa y sin tocaros: masturbaos a la vez, mirándoos, durante una canción. Quien cruce el sofá antes de tiempo, le da un vale a su pareja."},
    {"id":"cs5","t":"El Brazo del Sofá","n":3,"tags":["desnudez"],"x":"Probad en el sofá una postura que nunca hayáis probado en la cama, con o sin penetración: el brazo, el respaldo, la alfombra de al lado. Si no funciona, os reís y probáis otra."},
    {"id":"cs6","t":"La Mano en la Mía","n":3,"tags":["guia","intimo"],"x":"Pon tu mano sobre la de tu pareja y úsala para tocarte: enséñale el ritmo, la presión y el sitio exactos, sin soltarla, hasta que acabe la canción. Después, al revés."},
    {"id":"cs7","t":"A la Vez","n":3,"tags":["intimo"],"x":"Tumbaos en el sofá en sentidos opuestos y daos placer con la boca a la vez, durante una canción. Si se cae un cojín, da igual."},
    {"id":"cs8","t":"El Cojín","n":3,"tags":["intimo"],"x":"Pon un cojín bajo las caderas de tu pareja y dale placer con la boca, despacio, hasta que acabe la canción. Tu pareja solo puede decir «más» o «ahí»."},
    {"id":"cs9","t":"La Lluvia","n":3,"tags":["intimo"],"x":"Con la persiana a medias y la lluvia en el cristal, ponte a la espalda de tu pareja y acaricia su sexo mientras mira llover. Desde el edificio de enfrente no se ve nada; tu pareja, en cambio, lo nota todo."}
  ],
  "cotidiana/explicito/ducha": [
    {"id":"cd1","t":"A Oscuras bajo el Agua","n":3,"tags":["agua","desnudez","intimo"],"x":"Se ha ido la luz con el agua caliente todavía corriendo. A oscuras, enjabona a tu pareja de arriba abajo, sin saltarte nada, y quédate más tiempo donde más lo note."},
    {"id":"cd2","t":"Contra los Azulejos","n":4,"tags":["agua","intimo"],"x":"Tu pareja apoya la espalda en los azulejos. Ponte de rodillas sobre una toalla doblada y dale placer con la boca, bajo el agua, hasta que te pida que pares."},
    {"id":"cd3","t":"Tres Veces","n":4,"tags":["borde","intimo"],"x":"Dale placer a tu pareja con la mano, bajo el agua o fuera de ella, hasta que esté cerca del orgasmo, y para. Tres respiraciones. Tres veces. A la cuarta, si te lo pide, no pares."},
    {"id":"cd4","t":"El Juguete","n":3,"tags":["juguete","intimo"],"x":"Si el juguete que tenéis guardado aguanta el agua, este es su momento; si no, os espera en la toalla. Úsalo sobre tu pareja despacio, empezando lejos de donde más lo quiere."},
    {"id":"cd5","t":"El Espejo Empañado","n":3,"tags":["voz","intimo"],"x":"Con el dedo, escribe en el espejo empañado, sin eufemismos, lo que vas a hacerle a tu pareja. Cuando lo haya leído, hazlo."},
    {"id":"cd6","t":"El Cinturón del Albornoz","n":3,"tags":["atar","intimo"],"x":"Si tu pareja quiere, átale las muñecas por delante con el cinturón del albornoz, flojo y fácil de soltar. Sécale a besos, de arriba abajo, y quédate donde más lo note el tiempo que quieras. «Rojo» lo suelta al instante."},
    {"id":"cd7","t":"Todo Resuena","n":3,"tags":["voz","guia"],"x":"Pídele a tu pareja que te toque donde quieras y, mientras lo hace, no te calles: en el baño todo resuena, y cada sonido tiene que rebotar en los azulejos y llegarle."},
    {"id":"cd8","t":"Las Manos en los Azulejos","n":3,"tags":["intimo"],"x":"Tu pareja apoya las manos en los azulejos y no las despega: es su condición, no la tuya. Recorre su cuerpo con la boca y las manos, sin saltarte su sexo. Si las despega, te da un vale."},
    {"id":"cd9","t":"Tú Empiezas","n":4,"tags":["solo","borde","intimo"],"x":"Tócate delante de tu pareja, bajo el agua, hasta que te falte poco. Entonces para y deja que tu pareja termine lo que empezaste, como quiera, si quiere."},
    {"id":"cd10","t":"Tres Notas","n":3,"tags":["voz"],"x":"Pide tres cosas con palabras exactas, de las que nunca hayas pedido, como quien deja notas en la nevera. Tu pareja concede una ahora, otra en el dormitorio y la tercera, otra tarde."}
  ],

    {"id":"cl2","t":"Lo Mejor de la Tarde","n":4,"tags":["intimo"],"x":"Volved a lo que más os encendió de la tarde, en la entrada, en el sofá o en la ducha, y repetidlo aquí, sin prisa y sin condiciones, hasta el final."},
    {"id":"cl3","t":"Los Vales","n":4,"tags":[],"x":"Cobrad ahora los vales que queden, por turnos: quien cobra pide algo con palabras exactas y su pareja lo concede o lo cambia por otra cosa. Empieza quien tenga más."},
    {"id":"cl4","t":"Solo Tu Placer","n":4,"tags":["intimo"],"x":"Durante una canción, tu pareja no hace nada más que recibir: le das placer con la boca y con las manos hasta que llegue o hasta que te pida que pares."},
    {"id":"cl5","t":"A la Vez, Hasta el Final","n":4,"tags":["intimo"],"x":"Buscad una postura en la que podáis daros placer a la vez y no la dejéis hasta que lleguen las dos personas, o hasta que alguien pida tregua."},
    {"id":"cl6","t":"El Edredón","n":4,"tags":["desnudez"],"x":"Bajo el edredón y a oscuras, haced el amor despacio, con o sin penetración, como si nadie en todo el edificio pudiera oíros. Aunque puedan."},
    {"id":"cl7","t":"Las Paredes Finas","n":4,"tags":["voz","intimo"],"x":"Mientras os tocáis, decid en voz alta todo lo que sentís, sin eufemismos y sin bajar la voz. Las paredes son finas: que el edificio se entere de una vez."},
    {"id":"cl8","t":"El Último Nudo","n":4,"tags":["atar","intimo"],"x":"Si tu pareja quiere, átale las muñecas por delante, flojo y fácil de soltar, y dedícate a su placer hasta que llegue. Después desátale y deja que te devuelva el favor como quiera."},
    {"id":"cl9","t":"A su Ritmo","n":4,"tags":["intimo"],"x":"Si queréis penetración, que sea tu pareja quien decida cuándo, cuánto y a qué ritmo. Tú no te mueves más de lo que te deje, durante una canción entera; después, si quiere, cambiáis."}

  "cotidiana/prohibicion/cocina": [
    {"id":"co1","t":"La mano que enseña","n":1,"tags":[],"x":"Enséñale a tu pareja a hacer algo con las manos: pelar fruta, batir un huevo, amasar. Ponte a su espalda y guía sus manos con las tuyas, piel con piel, mientras el resto de tu cuerpo se apoya en el suyo sobre la ropa. Que aprenda muy despacio."},
    {"id":"co2","t":"Con permiso","n":1,"tags":[],"x":"Durante esta carta, cada vez que tengas que pasar por detrás de tu pareja, hazlo sin prisa y sin dejar hueco: tus manos en su cintura, sobre la ropa, como quien pide paso en una cocina estrecha. Pasa por lo menos tres veces, aunque no te haga falta nada del otro lado."},
    {"id":"co3","t":"Probar el punto","n":1,"tags":["comida"],"x":"Moja la yema de un dedo en lo que estéis preparando y dáselo a probar a tu pareja, sin cuchara. Pregúntale si le falta algo. Le falta: vuelve a mojar el dedo y repite, más despacio, sin apartarlo si sus labios se entretienen."},
    {"id":"co4","t":"El delantal","n":1,"tags":[],"x":"Ponle un delantal a tu pareja, o un trapo de cocina en la cintura si no hay delantal. Átaselo desde atrás, despacio: tus manos tardan en encontrar las cintas y tardan más en hacer el nudo. Al terminar, deshazlo y vuelve a empezar: no ha quedado bien."},
    {"id":"co5","t":"Si no hubiera normas","n":2,"tags":["voz"],"x":"Acércate por la espalda y dile al oído, con todo detalle, qué harías ahora mismo sobre esta encimera si en la cocina no hubiera prohibiciones. Tu pareja decide: aguantarse las ganas, o romper la prohibición y pagar un favor."},
    {"id":"co6","t":"En la palma","n":1,"tags":[],"x":"Con la yema de un dedo, escribe en la palma de la mano de tu pareja, letra a letra, algo que te gustaría que pasara esta tarde. Tiene que adivinarlo mirándote a los ojos, no a la mano. Si falla, vuelve a empezar, más despacio."},
    {"id":"co7","t":"Entre la nevera y el fregadero","n":2,"tags":[],"x":"Sube la radio y saca a bailar a tu pareja una canción entera entre la nevera y el fregadero, sin espacio entre los cuerpos. Tus manos pueden ir a donde quieran mientras sea sobre la ropa, y la cocina es tan pequeña que no hay forma de separarse."},
    {"id":"co8","t":"Lo mojado","n":2,"tags":["prenda"],"x":"Quítale a tu pareja una prenda de abrigo: el jersey, la chaqueta, los calcetines. Hazlo despacio y sin rozar la piel que aparezca, que aquí todavía no se puede. Después ponle algo tuyo, una sudadera o una camiseta: lo suyo se queda en el radiador hasta el dormitorio."},
    {"id":"co9","t":"Tres minutos de horno","n":1,"tags":[],"x":"Pon un temporizador de tres minutos, como si algo se hiciera en el horno. Mientras tu pareja se apoya en la encimera, bésale las manos; la carta te concede también las muñecas y los antebrazos, hasta donde empiece la manga, ni un centímetro más. Si al sonar queréis más, volved a ponerlo."}
  ],
  "cotidiana/prohibicion/salon": [
    {"id":"sa1","t":"La manta","n":2,"tags":[],"x":"Tapaos con la manta en el sofá. Bajo la manta, tu mano busca piel: el tobillo, la rodilla, la cintura por debajo de la camiseta. Mirad la tele como si no pasara nada. Cada vez que tu pareja aparte la vista de la pantalla, tu mano puede subir un poco más."},
    {"id":"sa2","t":"Sin sonido","n":2,"tags":["voz"],"x":"Quitadle el sonido a la película que nadie está viendo y ponedle voz por turnos, pero lo que dicen los personajes tiene que ser lo que pensáis de verdad de quien está en el sofá. Mientras tu pareja pone voz, tus labios recorren su cuello, nunca su boca."},
    {"id":"sa3","t":"El tabique","n":2,"tags":["voz"],"x":"Las paredes del edificio son finas, así que esta carta se juega en susurros. Dile al oído a tu pareja qué crees que estarían pensando en el piso de al lado si os oyeran ahora. Mientras hablas, tus manos se cuelan bajo su ropa por la espalda."},
    {"id":"sa4","t":"Cara o cruz","n":2,"tags":["prenda","desnudez"],"x":"Lanzad una moneda de la hucha cinco veces. Cara: le quitas tú una prenda a tu pareja; cruz: te la quita a ti. Lo que cae se queda en el suelo del salón hasta el final. Si alguien se queda sin ropa, la partida termina, y elige dónde quiere un beso, menos en la boca."},
    {"id":"sa5","t":"El espejo de la entrada","n":2,"tags":["espejo","prenda"],"x":"Id al espejo de la entrada o al del armario. Ponte a la espalda de tu pareja y quítale lo que lleve de cintura para arriba sin que os miréis directamente: solo en el reflejo. Después tus manos recorren lo que ha aparecido, despacio, hasta que termine la canción."},
    {"id":"sa6","t":"Crema en la espalda","n":3,"tags":["aceite","prenda"],"x":"Tu pareja se tumba boca abajo en el sofá, con la espalda al aire. Calienta en tus manos un poco de crema o de aceite y dale un masaje lento de la nuca a la cintura, y un poco más abajo cada vez que la espalda se arquee. Nada de prisas: la cerrajería no llega hasta las siete."},
    {"id":"sa7","t":"Lo primero que vi","n":2,"tags":["confesion","prenda"],"x":"Sal del personaje un momento y confiesa, como tú, qué fue lo primero que te atrajo de tu pareja el día que os conocisteis de verdad. Mientras lo cuentas, besa despacio el trozo de piel que más miraste aquel día, quitando la ropa que lo tape. Si fue la boca, tendrá que esperar."},
    {"id":"sa8","t":"La lluvia en el cristal","n":3,"tags":[],"x":"Bajad la persiana hasta la mitad. Tu pareja apoya la frente en el cristal frío y mira llover; tú, a su espalda, sin espacio entre los cuerpos. Tus manos se cuelan por delante bajo su ropa, y suben y bajan al ritmo de las gotas. Nada de besos en la boca, aunque se gire a buscarlos."},
    {"id":"sa9","t":"El hielo de la bebida","n":2,"tags":["hielo"],"x":"Saca un cubito del vaso y pásalo despacio por la nuca de tu pareja. Sigue con los labios cada gota que baje por su espalda, por debajo de la ropa si hace falta, hasta que se derrita. La boca no: esa todavía no."}
  ],
  "cotidiana/prohibicion/apagon": [
    {"id":"ap1","t":"Adivina qué es","n":3,"tags":["venda","intimo"],"x":"Tu pareja cierra los ojos. Toca su cuerpo, en tres sitios distintos, con tres cosas que encuentres a oscuras: algo frío de la nevera, el borde de un jersey, tu aliento, tu pelo. Tiene que adivinar qué es cada una; por cada acierto, eliges el siguiente sitio un poco más escondido."},
    {"id":"ap2","t":"A la luz de la vela","n":3,"tags":["venda","voz"],"x":"Tú cierras los ojos. Tu pareja enciende la vela y te mira a su luz todo lo que quiera, en silencio, durante media canción. Después te cuenta al oído lo que ha visto y lo que piensa hacer con ello. No abras los ojos: todavía no te toca."},
    {"id":"ap3","t":"La Nota del cajón","n":3,"tags":["venda","voz"],"extra":true,"x":"Tu pareja cierra los ojos. Abre la Nota del cajón, la que apareció buscando velas, y léela en voz alta, despacio, con los labios rozando su oído. Mientras lees, tu mano libre puede ir a donde quiera. Si habéis preparado vuestro propio texto, leed ese."},
    {"id":"ap4","t":"Meses de ascensor","n":3,"tags":["venda"],"x":"Tú cierras los ojos y dejas los brazos caídos, como en el ascensor cuando no sabes dónde ponerlos. Tu pareja te da por fin el beso que lleva meses guardándose: lento, largo, sin prisa por terminarlo. Tus manos no se mueven hasta que te lo diga."},
    {"id":"ap5","t":"Los plomos","n":3,"tags":["venda","guia"],"x":"Tú cierras los ojos. Tu pareja te guía solo con la voz por su propio cuerpo, como quien busca los plomos a oscuras: «más arriba», «más despacio», «ahí». Tus manos solo se mueven cuando te lo dice, durante una canción entera."},
    {"id":"ap6","t":"Piso a piso","n":4,"tags":["venda","intimo"],"x":"Tu pareja cierra los ojos. Bésale cinco sitios, uno por cada piso del edificio, y cada uno más escondido que el anterior. En el quinto, quédate hasta que te pida que bajes."},
    {"id":"ap7","t":"Las manos quietas","n":3,"tags":["venda"],"x":"Tu pareja cierra los ojos y decide dejar las manos quietas, abiertas sobre el sofá, durante una canción: es su prohibición, no la tuya. Tú recorres su cuerpo como quieras, con las manos y con la boca. Si se le escapan las manos, paga un favor."},
    {"id":"ap8","t":"Lo que nunca te conté","n":4,"tags":["venda","voz","confesion"],"x":"Tu pareja cierra los ojos. Cuéntale al oído, como tú y no como tu personaje, una fantasía que nunca le hayas contado, despacio, mientras tus manos recorren su cuerpo al ritmo de lo que cuentas. Si no te atreves a decirla, escríbela y déjala doblada en su mano: no podrá leerla hasta el dormitorio."},
    {"id":"ap9","t":"La bufanda","n":3,"tags":["venda","atar"],"x":"Tu pareja cierra los ojos. Si quiere, átale las muñecas por delante con una bufanda o un pañuelo, flojo y con un nudo que se suelte de un tirón. Durante una canción, tus manos y tu boca deciden el camino; su única tarea es sentir. Si se escapa del nudo, paga un favor. «Rojo» lo deshace gratis."},
    {"id":"ap10","t":"A Tientas","n":3,"tags":["venda"],"x":"Tú cierras los ojos y cuentas hasta treinta mientras tu pareja se esconde sin salir de la habitación. Búscale despacio, con las manos por delante y guiándote por su respiración. Lo primero que toques, lo besas; lo segundo, también."}
  ],
  "cotidiana/prohibicion/dormitorio": [
    {"id":"do1","t":"Los favores","n":4,"tags":[],"x":"Cobrad ahora los favores, por turnos y de uno en uno. Quien cobra pide algo para esta tarde; quien debe lo concede o lo perdona. Empieza quien tenga más."},
    {"id":"do2","t":"La norma rota","n":4,"tags":[],"x":"Elegid la prohibición que más os costó cumplir esta tarde y rompedla ahora, sin pagar nada, durante una canción entera. Despacio: os la habéis ganado."},
    {"id":"do3","t":"La ropa prestada","n":4,"tags":["prenda","desnudez","intimo"],"x":"Quítale a tu pareja lo último que lleve puesto, sea suyo o prestado, sin usar las manos. Después devuélvele el favor con la boca: recorre despacio el camino que ha dejado la tela y quédate donde te pida."},
    {"id":"do4","t":"La siesta que no fue","n":4,"tags":["desnudez"],"x":"Meteos sin ropa bajo el edredón, como para echar una siesta que no vais a echar. Durante una canción solo se mueven las manos, y muy despacio, por todo lo que tapa el edredón. Quien se duerma, pierde."},
    {"id":"do5","t":"Desde las muñecas","n":4,"tags":["intimo","guia"],"x":"Durante una canción solo puedes usar la boca, y tu pareja solo la voz, para decirte «sigue», «ahí» o «más despacio». Empieza por las muñecas, que fue lo primero que tocaste en la cocina, y termina donde te diga."},
    {"id":"do6","t":"Cuando vuelve la luz","n":4,"tags":["prenda","desnudez"],"x":"Ha vuelto la luz. Encended la lámpara de la mesilla y quitaos la ropa sin prisa, cada cual la suya, mirándoos y sin tocar. Cuando no quede nada, recorred con las manos lo que habéis mirado, en el mismo orden."},
    {"id":"do7","t":"Que suene el timbre","n":4,"tags":["voz"],"x":"El timbre puede sonar todo lo que quiera. Por turnos, cada persona pide al oído lo que más ganas le ha dado esta tarde y no se ha atrevido a pedir. La otra persona se lo concede durante una canción, o lo cambia por otra cosa."},
    {"id":"do8","t":"La Bebida Fría","n":4,"tags":["hielo"],"x":"Saca algo frío de la nevera. Mientras os besáis, deja caer un chorrito por su espalda o por su pecho y síguelo con la boca, una y otra vez, hasta que el vaso esté vacío o hasta que deje de importar."}

    {"id":"kr3","t":"Lo que se Ve en el Ascensor","n":2,"tags":["voz"],"x":"En personaje, cuéntale a tu pareja tres cosas en las que te has fijado de su cuerpo en el ascensor durante estos meses. Mientras las cuentas, tus manos las señalan, por encima de la ropa."},

    {"id":"kr5","t":"Las Llaves, Otra Vez","n":2,"tags":["voz"],"x":"En personaje, pregunta cómo se quedaron las llaves dentro, con todo detalle. Tu pareja responde, y tú decides si le crees: si no le crees, te acercas tanto como permita la cocina, sobre la ropa, hasta que cambie de versión."},
    {"id":"kr6","t":"El Delantal","n":1,"tags":[],"x":"Ponle un delantal a tu pareja, o un trapo de cocina en la cintura, desde atrás y despacio. En personaje, aprovecha para decirle al oído algo que nunca le dirías en el ascensor."},
    {"id":"kr7","t":"La Radio de los Domingos","n":2,"tags":[],"x":"En la radio suena una canción que alguien de este rellano pone los domingos. Bailadla entre la nevera y el fregadero, sin espacio entre los cuerpos y con las manos sobre la ropa."},
    {"id":"kr8","t":"El Cristal Empañado","n":1,"tags":[],"x":"Escribe con el dedo tu nombre de personaje en la ventana empañada y deja que tu pareja escriba el suyo debajo. Después coge su mano y dibujad algo con vuestros dedos a la vez."},
    {"id":"kr9","t":"Casi","n":2,"tags":[],"x":"En personaje, acércate a tu pareja como si fueras a besarle y para a un centímetro. Quedaos así, respirando el mismo aire, hasta que alguien aparte la mirada. Quien la aparte, paga un favor."}

    {"id":"sr3","t":"La Manta","n":2,"tags":[],"x":"Bajo la manta, tu mano busca piel: el tobillo, la rodilla, la cintura bajo la camiseta. En personaje, haced como que miráis la tele. Cada vez que tu pareja aparte la vista de la pantalla, tu mano sube un poco más."},
    {"id":"sr4","t":"El Ruido del Tabique","n":2,"tags":["voz"],"x":"Se oye algo al otro lado del tabique. En personaje, quien lea este giro confiesa en voz baja qué ha oído alguna vez desde su casa y qué ha imaginado, mientras sus labios recorren el cuello de su pareja."},
    {"id":"sr5","t":"La Camiseta Prestada","n":2,"tags":["prenda"],"x":"Quien llegó de la calle todavía lleva algo mojado. Quítaselo despacio y ponle una camiseta tuya; en personaje, dile que ya te la devolverá otro día: así tendrá que volver."},

    {"id":"sr7","t":"Tres Pisos","n":3,"tags":["intimo"],"x":"Lo más lejos que habéis llegado en el ascensor son tres pisos de silencio. En personaje, recorre con las manos el cuerpo de tu pareja, bajo la ropa, en tres paradas, cada una más abajo que la anterior, sin llegar todavía a lo más íntimo."},
    {"id":"sr8","t":"Las Gotas en el Cristal","n":2,"tags":[],"x":"Tu pareja mira llover con la frente en el cristal; tú, a su espalda, sin espacio entre los cuerpos. En personaje, cuéntale qué hacías las tardes de lluvia antes de hoy, mientras tus manos se cuelan bajo su ropa."},
    {"id":"sr9","t":"En Todas Partes Menos","n":3,"tags":[],"x":"En personaje, besa a tu pareja en todas partes menos en la boca: en la comisura, en la barbilla, en el cuello, tan cerca como puedas. Si es tu pareja quien busca tu boca, paga un favor."}

    {"id":"bf7","t":"A Ciegas en el Bosque","n":4,"tags":["venda","intimo"],"x":"Véndale los ojos a tu pareja y alterna sin avisar: tu boca, tu mano, tu aliento y tu pelo, cada vez más cerca de su sexo y cada vez más tiempo en él. Que no sepa nunca qué viene ahora, solo que viene."},

    {"id":"f7","t":"El Encantamiento Mudo","n":2,"tags":["silencio"],"x":"Durante la próxima canción no puedes hablar: el Bosque te ha robado la voz. Tu pareja te hace preguntas atrevidas y respondes solo con las manos, sobre su ropa: una caricia es sí; apartarla, no. Si hablas, pagas una moneda. Para parar: tres golpecitos."},

    {"id":"l1","t":"El Agua que Desnuda","n":2,"tags":["prenda","confesion"],"x":"Dicen que el agua del Lago no moja, pero desnuda. Hazle a tu pareja tres preguntas sobre lo que desea esta noche. Por cada respuesta sincera, le quitas una prenda, despacio; por cada evasiva, paga una moneda."},
    {"id":"l2","t":"Lo que muestra el Lago","n":3,"tags":["espejo","prenda","desnudez"],"x":"Ponte detrás de tu pareja, frente al espejo. Desnuda a tu pareja despacio, mirando solo el reflejo, nunca directamente, hasta que te diga «basta». Después, tus manos se quedan en la piel recién descubierta hasta que acabe la canción."},
    {"id":"l3","t":"La Estatua","n":2,"tags":[],"x":"Las criaturas del Lago se quedan quietas cuando alguien las mira. Tu pareja se convierte en estatua durante una canción. Tú das vueltas a su alrededor y la despiertas por partes: cada beso, nunca en la boca, devuelve el movimiento a la parte que toca."},
    {"id":"l4","t":"La Runa","n":2,"tags":["prenda"],"x":"Con la yema de un dedo, dibuja una runa sobre la piel descubierta de tu pareja: una forma, un símbolo, una letra. Si la adivina, te quitas tú una prenda; si falla, se quita una tu pareja. Tres runas, cada una más abajo que la anterior."},
    {"id":"l5","t":"Agua del Lago","n":3,"tags":["aceite","silencio"],"x":"Calienta aceite entre tus manos y masajea a tu pareja como el agua que acaricia una piedra: la nuca, la espalda, la cintura y todo lo que la ropa ya no tape. Nadie puede hablar; quien hable, paga una moneda."},
    {"id":"l6","t":"La Visión del Lago","n":2,"tags":["espejo","voz"],"x":"Mírate en el espejo mientras tu pareja, a tu espalda, te cuenta al oído qué ve el Lago en ti esta noche: qué deseas, qué escondes, qué le harías. Sus manos señalan cada cosa. No puedes apartar los ojos del reflejo."},
    {"id":"l7","t":"El Trato Feérico","n":2,"tags":["prenda","desnudez"],"x":"Piedra, papel o tijera, hasta cinco rondas. Quien pierda una ronda elige: quitarse una prenda o dejar que la otra persona le bese donde elija, menos en la boca y en las zonas más íntimas: eso, todavía no. Los tratos con el Reino siempre tienen letra pequeña: la última ronda vale doble."},
    {"id":"l8","t":"La Marea","n":3,"tags":["prenda","intimo"],"x":"Recorre el cuerpo de tu pareja con los labios como la marea: avanza, retrocede y, cada vez que llegues al borde de una prenda, vuelve atrás. Si tu pareja dice «marea alta», esa prenda desaparece y la marea sigue, pero paga una moneda por impaciencia."},
    {"id":"l9","t":"La Camisa del Lago","n":3,"tags":["prenda","desnudez"],"x":"Tu pareja se pone una camisa tuya, sin nada debajo. Moja tus manos en agua tibia y acaricia su cuerpo por encima de la tela hasta que el agua la pegue a la piel y se transparente todo. Después desabróchala, despacio, y que el Lago se quede con ella."}
  ],
  "fantasia/prohibicion/gruta": [
    {"id":"c1","t":"Las Luciérnagas","n":3,"tags":["venda","intimo"],"x":"Véndale los ojos a tu pareja. Las luciérnagas se encienden donde las tocan: dale un beso en un sitio y espera a que diga «luz»; solo entonces puedes pasar al siguiente, cada vez más escondido."},
    {"id":"c2","t":"El Agua de la Gruta","n":3,"tags":["venda","hielo","intimo"],"x":"Tu pareja lleva la venda. En la Gruta gotea agua helada: traza con un cubito un camino lento por su cuerpo (la nuca, la columna, el vientre, el interior de los muslos) y después devuélvele el calor con la boca, por el mismo camino."},
    {"id":"c3","t":"El Nombre Real","n":3,"tags":["venda","confesion"],"x":"Tú llevas la venda. Di tu nombre de verdad y, con él, confiesa algo que te gustaría que tu pareja te hiciera esta noche y que nunca le has pedido. Tu pareja decide si te lo concede ahora o lo guarda para la Enramada."},
    {"id":"c4","t":"La Canción de la Gruta","n":3,"tags":["venda","voz"],"extra":true,"x":"Tu pareja lleva la venda. Abre la Canción de la Gruta y léela en voz alta, con los labios rozando su oído. Mientras lees, tu mano libre puede ir a donde quiera. Si habéis preparado vuestro propio texto, leed ese."},
    {"id":"c5","t":"El Eco","n":3,"tags":["venda","guia"],"x":"Tú llevas la venda. En la Gruta todo tiene eco: tu pareja te dice dónde quiere tus manos («más abajo», «más despacio», «ahí») y tú repites cada palabra antes de hacerlo. Una canción entera."},
    {"id":"c6","t":"Las Manos Quietas","n":3,"tags":["venda"],"x":"Tu pareja lleva la venda y decide dejar las manos quietas, abiertas, durante una canción: es su voto, no el tuyo. Tú recorres su cuerpo como quieras, con las manos y con la boca. Si se le escapan las manos, paga una moneda."},
    {"id":"c7","t":"El Mapa de Musgo","n":3,"tags":["venda","intimo"],"x":"Tú llevas la venda. Tu pareja besará cinco lugares de tu cuerpo, cada uno más escondido que el anterior. Al terminar, di cuál te ha gustado más: queda marcado para la Enramada."},
    {"id":"c8","t":"El Secreto del Pozo","n":4,"tags":["venda","voz","confesion"],"x":"Tu pareja lleva la venda. Cuéntale al oído una fantasía que nunca le hayas contado, despacio, mientras tus manos recorren su cuerpo al ritmo de lo que cuentas. Si no te atreves a decirla, escríbela, dobla el papel y déjalo en su mano: no podrá leerlo hasta la Enramada."},
    {"id":"c9","t":"El Abrazo de las Raíces","n":3,"tags":["venda","atar"],"x":"Tu pareja lleva la venda. En la Gruta, las raíces abrazan las muñecas de quien se detiene: si quiere, átaselas por delante con una cinta, floja y con un nudo que se suelte de un tirón. Durante una canción, tu boca y tus manos van donde quieran; su voto es dejarse. Si escapa, paga una moneda. «Rojo» la suelta gratis."},
    {"id":"c10","t":"Lo que Vive a Oscuras","n":3,"tags":["venda"],"x":"Tu pareja lleva la venda. Recorre su cuerpo con la boca a un dedo de la piel, sin tocarla: solo tu aliento, como el de algo que vive en la oscuridad de la Gruta. Al final de la canción, elige un sitio y deja que la boca llegue."}
  ],
  "fantasia/prohibicion/enramada": [
    {"id":"en1","t":"El Último Glamour","n":4,"tags":["prenda","desnudez","intimo"],"x":"Quítale a tu pareja la última prenda sin usar las manos: es el último glamour que le queda. Después, recorre con los labios el camino que ha dejado la tela, despacio, y quédate donde te pida."},
    {"id":"en2","t":"El Hechizo de la Boca","n":4,"tags":["intimo"],"x":"Durante una canción, el Bosque solo te deja usar la boca. Empieza por los tobillos y sube por el interior de las piernas, sin prisa. Tu pareja decide si paras, dónde y cuándo."},
    {"id":"en3","t":"El Oro de Hada","n":4,"tags":[],"x":"Antes del amanecer, el oro de hada se convierte en hojas. Cobrad ahora las monedas, por turnos y de una en una: quien cobra pide algo para esta noche; quien debe lo concede o lo perdona."},
    {"id":"en4","t":"El Voto Roto","n":4,"tags":[],"x":"Elegid el voto que más os costó cumplir esta noche y rompedlo ahora, sin pagar nada, durante una canción entera. Despacio: os lo habéis ganado."},
    {"id":"en5","t":"El Musgo","n":4,"tags":["desnudez"],"x":"Tumbaos sin ropa, como sobre el musgo de la Enramada. Durante una canción, una persona explora con la boca y las manos y la otra solo siente; en la siguiente, al revés."},
    {"id":"en6","t":"El Corro, otra vez","n":4,"tags":["desnudez"],"x":"Una última danza del Corro, esta vez sin ropa y sin votos. Bailad sin espacio entre los cuerpos, y que las manos vayan a donde no pudieron ir al principio de la noche."},
    {"id":"en7","t":"El Círculo de Setas","n":4,"tags":["intimo"],"x":"Dibuja con besos un círculo de setas alrededor de lo más íntimo de tu pareja, sin entrar nunca en él: quien entra en un corro de hadas no sale en siete años. Espera a que tu pareja te invite a entrar, con palabras o con las manos."},
    {"id":"en8","t":"El Hechizo que se Rompe","n":4,"tags":["borde","intimo"],"x":"Acaricia a tu pareja donde más lo note, despacio, y para justo cuando más lo esté disfrutando: el hechizo necesita tres intentos. Cuenta tres respiraciones y vuelve a empezar. A la cuarta, el hechizo se rompe y ya no paras."},
    {"id":"en9","t":"Las Dos Lunas","n":4,"tags":["intimo","desnudez"],"x":"Sin ropa y a la vez: cada cual hace sobre su pareja lo que más le ha encendido de toda la noche, hasta que se ponga la segunda luna o hasta que alguien pida tregua. La tregua dura una respiración."}
  ],
  "fantasia/rol/corro": [
    {"id":"fr1","t":"El Precio","n":1,"tags":["voz"],"x":"En personaje, pregunta cuál es el precio del trato. La respuesta no puede ser una mentira, pero puede ser un baile: si tu pareja prefiere no decirlo, te saca a bailar una canción, tan cerca como permita el voto."},
    {"id":"fr2","t":"La Fruta del Reino","n":1,"tags":["comida"],"x":"Te ofrecen fruta del Reino, y quien come de la mano de una criatura se queda en el Bosque, o eso dicen. En personaje, decide si aceptas un bocado de los dedos de tu pareja; si aceptas, tus labios pueden entretenerse en sus dedos tanto como quieran."},
    {"id":"fr3","t":"Siete Años","n":2,"tags":["voz"],"x":"En personaje, cuéntale a tu pareja algo que has hecho cada día de estos siete años por su culpa. Mientras lo cuentas, tus manos recorren su espalda por encima de la ropa, de arriba abajo, siete veces."},
    {"id":"fr4","t":"La Palabra Prohibida","n":2,"tags":[],"x":"Quien diga «gracias» en el Corro queda en deuda. Durante una canción, haz todo lo que puedas para que tu pareja te dé las gracias: un cumplido, una caricia en las manos, un baile. Si lo dice, paga una moneda de oro de hada."},
    {"id":"fr5","t":"El Hierro en el Bolsillo","n":2,"tags":[],"x":"La criatura nota hierro en la ropa de quien lea este giro: su llave. Escóndela donde quieras de tu ropa; tu pareja tiene una canción para encontrarla, solo con las manos y por encima de la ropa."},
    {"id":"fr6","t":"La Corte Mira","n":2,"tags":[],"x":"Toda la Corte del Crepúsculo os mira bailar. Durante una canción, bailad como si quisierais escandalizarla, sin espacio entre los cuerpos y con las manos donde las deje el voto."},
    {"id":"fr7","t":"La Voz Robada","n":2,"tags":["silencio"],"x":"Un encantamiento le roba la voz a quien lea este giro durante una canción. Su pareja le hace preguntas sobre el trato, y solo puede responder con las manos, sobre la ropa: una caricia es sí; apartarlas, no."},
    {"id":"fr8","t":"Lo que Prometiste","n":2,"tags":["voz"],"x":"En personaje, repítele a tu pareja, palabra por palabra, lo que se prometió hace siete años. Lo puedes inventar ahora, pero tiene que sonar a promesa, y tiene que incluir una noche."},
    {"id":"fr9","t":"El Pulso de las Hadas","n":1,"tags":[],"x":"Las criaturas del Reino saben por el pulso si alguien miente. Coge la muñeca de tu pareja y hazle una pregunta, en personaje. Bésale la muñeca después de cada respuesta, diga la verdad o no."}
  ],
  "fantasia/rol/lago": [
    {"id":"fl1","t":"La Forma Verdadera","n":2,"tags":["espejo","prenda"],"x":"El Lago enseña la forma verdadera de quien se asoma. Ponte frente al espejo y deja que tu pareja te quite una prenda; en personaje, describe lo que ves en el reflejo como si fuera la primera vez que te ves así."},
    {"id":"fl2","t":"El Agua que no Moja","n":2,"tags":["prenda"],"x":"Dicen que el agua del Lago no moja, pero desnuda. En personaje, pregúntale a tu pareja algo sobre el trato: por cada respuesta verdadera, le quitas una prenda; por cada evasiva, paga una moneda."},
    {"id":"fl3","t":"La Escama de Plata","n":2,"tags":[],"x":"Quien lleva el papel de la criatura tiene, en algún lugar de la piel, una escama de plata. Búscala con los labios por toda la piel que la ropa no tape; los labios de tu pareja no cuentan. Tu pareja decide dónde estaba."},
    {"id":"fl4","t":"El Reflejo Celoso","n":2,"tags":["espejo","voz"],"x":"En el Lago, tu reflejo desea a tu pareja tanto como tú. En personaje, ponte a su espalda frente al espejo y cuéntale al oído lo que el reflejo quiere hacerle, mientras tus manos lo hacen."},
    {"id":"fl5","t":"La Bruma","n":2,"tags":["silencio"],"x":"Se levanta la bruma del Lago y nadie ve más allá de un palmo. Durante media canción, sin palabras, solo podéis encontraros con las manos sobre la piel."},
    {"id":"fl6","t":"La Mitad del Precio","n":3,"tags":["intimo"],"x":"En personaje, se revela la mitad del precio: «una caricia por cada año». Haz siete caricias a tu pareja, cada una más abajo que la anterior, sin llegar todavía a lo más íntimo."},
    {"id":"fl7","t":"La Orilla","n":3,"tags":["prenda","intimo"],"x":"Recorre con los labios el borde de cada prenda que aún lleva tu pareja, sin cruzarlo nunca, como el agua que lame la orilla. Si tu pareja dice «marea alta», esa prenda desaparece, y paga una moneda por impaciencia."},
    {"id":"fl8","t":"Siete Gotas","n":2,"tags":[],"x":"Moja tus dedos en agua y deja caer siete gotas sobre la piel de tu pareja, una por cada año, donde quieras. Síguelas con los labios hasta donde se pierdan, menos en la boca."},
    {"id":"fl9","t":"Si el Trato se Rompe","n":3,"tags":["desnudez"],"x":"Tumbaos piel con piel a la orilla del Lago, frente al espejo, sin besaros en la boca. En personaje, contaos qué haríais si el trato se rompiera esta noche, mientras vuestras manos se adelantan a las palabras."}
  ],
  "fantasia/rol/gruta": [
    {"id":"fg1","t":"El Nombre","n":3,"tags":["venda","confesion"],"x":"Tu pareja lleva la venda. Dile al oído tu nombre verdadero, el real. En el Reino, quien lo oye tiene poder sobre ti: deja que tu pareja decida qué hace con ese poder durante lo que queda de canción."},
    {"id":"fg2","t":"El Beso del Trato","n":3,"tags":["venda"],"x":"Tú llevas la venda. Tu pareja te da el beso que sella el trato: tan largo como haga falta para que ya no se pueda deshacer. Tú no puedes moverte hasta que termine."},
    {"id":"fg3","t":"Siete Años de Canciones","n":3,"tags":["venda","voz"],"extra":true,"x":"Tu pareja lleva la venda. Abre la Canción de la Gruta y léela en voz alta, con los labios rozando su oído: en personaje, es lo que se ha cantado cada noche de estos siete años. Mientras lees, tu mano libre puede ir a donde quiera."},
    {"id":"fg4","t":"El Precio Entero","n":3,"tags":["venda","intimo"],"x":"Tu pareja lleva la venda. En personaje, dile por fin el precio entero del trato y empieza a cobrarlo, o a pagarlo, ahora mismo, despacio, con la boca."},
    {"id":"fg5","t":"Nadie Miente","n":3,"tags":["venda","voz"],"x":"Tú llevas la venda. Haz a tu pareja tres preguntas sobre lo que siente de verdad: en la Gruta nadie miente, ni la criatura ni la persona mortal. Después de cada respuesta, un beso donde elija."},
    {"id":"fg6","t":"Las Raíces","n":3,"tags":["venda","atar"],"x":"Tu pareja lleva la venda. Las raíces de la Gruta sujetan a quien no se mueve: si quiere, átale las muñecas por delante con una cinta, floja y fácil de soltar. Durante una canción, tus manos y tu boca deciden el camino. «Rojo» la suelta al instante."},
    {"id":"fg7","t":"Un Beso por Año","n":3,"tags":["venda","intimo"],"x":"Tú llevas la venda. Tu pareja besará siete sitios de tu cuerpo, uno por cada año de espera, cada uno más escondido que el anterior. Después dile cuál quieres que repita en la Enramada."},
    {"id":"fg8","t":"El Hierro Suelto","n":3,"tags":["venda"],"x":"Tu pareja lleva la venda. Deja caer tu llave al suelo: ya no hay hierro entre las dos personas. En personaje, dile al oído que no piensas recogerla, y demuéstraselo con las manos."},
    {"id":"fg9","t":"La Verdad del Trato","n":4,"tags":["venda","voz","confesion"],"x":"Tu pareja lleva la venda. Cuéntale al oído, como tú y no como tu personaje, una fantasía que nunca le hayas contado, mientras tus manos recorren su cuerpo al ritmo de lo que cuentas. En el Reino, eso también sella un trato."}
  ],
  "fantasia/rol/enramada": [
    {"id":"fe1","t":"El Trato se Cumple","n":4,"tags":["intimo"],"x":"En personaje o sin él: pagad lo que se debía, sin prisa y sin regatear. Que dure lo que tenga que durar."},
    {"id":"fe2","t":"El Oro de Hada","n":4,"tags":[],"x":"Antes del amanecer, el oro de hada se vuelve hojas. Cobrad ahora las monedas, por turnos: quien cobra pide algo, en personaje si quiere; quien debe lo concede o lo perdona."},
    {"id":"fe3","t":"Un Trato Nuevo","n":4,"tags":["voz"],"x":"Haced un trato nuevo, sin letra pequeña: cada persona dice en voz alta qué ofrece y qué pide para esta noche. Si a las dos personas les parece justo, se sella con un beso y se cumple ahora."},
    {"id":"fe4","t":"Sin Hierro, sin Velo","n":4,"tags":["desnudez"],"x":"Sin ropa y en un abrazo, dile a tu pareja al oído por qué esta noche no vas a volver al otro lado del Velo. Después, demuéstraselo durante una canción, sin decir nada más."},
    {"id":"fe5","t":"La Canción Escrita","n":4,"tags":["voz"],"x":"Por turnos, leed en voz alta la carta del sobre pequeño, despacio y al oído. Después haced lo que diga, o algo mejor."},
    {"id":"fe6","t":"Siete Años Imaginándolo","n":4,"tags":["intimo"],"x":"En personaje por última vez: haz con el cuerpo de tu pareja lo que tu personaje lleva siete años imaginando, sin prisa y sin miedo al amanecer."},
    {"id":"fe7","t":"Hasta que Amanezca","n":4,"tags":["intimo","desnudez"],"x":"Sin ropa, sin papeles y sin prisa: cada cual da placer a su pareja, a la vez, hasta que alguien pida tregua. La tregua dura una respiración; después, la noche sigue."}
  ]
};

  "carnaval/prohibicion/salon": [
    {"id":"gs1","t":"La Nota sin Firma","tags":["voz"],"x":"Un criado te pone en la mano una nota sin firma: «Sé quién se esconde detrás de esa máscara». En personaje, léesela a tu pareja al oído y pregúntale qué daría por que no se supiera. Lo que ofrezca, lo paga bailando la próxima canción, tan cerca como permita el Salón."},
    {"id":"gs2","t":"Entra el Dux","tags":["silencio"],"x":"Se hace el silencio en el Salón: ha entrado el Dux. Durante una canción nadie habla ni se separa: bailad para él, sin espacio entre los cuerpos y con las manos donde las deje la prohibición. Quien hable primero, paga un zecchino."}
  ],
  "carnaval/prohibicion/galeria": [
    {"id":"gg1","t":"El Espejo que Miente","tags":["espejo","voz"],"x":"Uno de los espejos de la Galería no enseña lo que tiene delante, sino lo que se desea. Ponte frente a él y, en personaje, cuéntale a tu pareja lo que ves en el reflejo. Tu pareja, a tu espalda, hace realidad una parte: la que permita la Galería."},
    {"id":"gg2","t":"El Pintor del Dux","tags":[],"x":"Un pintor del Dux quiere un retrato de las dos máscaras. Posad para él una canción entera, en la postura más atrevida que permita la Galería, sin moveros. Cada vez que alguien diga «el pintor ha terminado este trazo», la postura avanza un poco."}
  ],
  "carnaval/prohibicion/biblioteca": [
    {"id":"gb1","t":"El Libro que se Abre Solo","tags":["venda","voz"],"x":"De un estante cae un libro abierto por una página subrayada. Quien lleve la venda se inventa en voz alta lo que pone, como si lo estuviera leyendo, y la otra persona lo hace realidad, si quiere y hasta donde quiera."},
    {"id":"gb2","t":"El Santo Oficio","tags":["silencio"],"x":"Llaman a la puerta: el Santo Oficio busca libros prohibidos. Escondeos en el rincón más oscuro, sin hacer un solo ruido y sin separar los cuerpos, mientras dure media canción. Si a alguien se le escapa un ruido, paga un zecchino."}
  ],
  "carnaval/encender/musica": [
    {"id":"gm1","t":"La Serenata Robada","tags":["voz"],"x":"Por la ventana entra una serenata que no es para nadie de esta sala. En personaje, róbasela: cántale o recítale a tu pareja al oído una letra inventada, como si la hubieras escrito pensando en su cuerpo."},
    {"id":"gm2","t":"El Violinista","tags":["venda"],"x":"Dicen que el violinista de Ca’ Velluto toca con los ojos vendados para no ver quién baila. Bailad la próxima canción con los ojos cerrados, guiándoos solo por el roce y la respiración."}
  ],
  "carnaval/encender/banquete": [
    {"id":"gq1","t":"El Filtro de Amor","tags":[],"x":"Una de las copas lleva un filtro de amor, dicen. Quien beba primero tiene que decir en voz alta, en personaje, lo primero que desea de la otra persona; la otra persona decide si se lo da ahora o al final de la noche."},
    {"id":"gq2","t":"El Catador del Dux","tags":["comida"],"x":"El Dux ha enviado a su catador. En personaje, tu pareja describe el sabor de tres cosas que le des a probar como si fueran manjares de Oriente: con nombres inventados, con detalles y sin ninguna prisa."}
  ],
  "carnaval/encender/banos": [
    {"id":"gn1","t":"El Ámbar que Hace Hablar","tags":["voz","confesion"],"x":"Alguien ha echado esencia de ámbar en el agua: quien la respira no puede mentir durante una canción. Por turnos, una pregunta cada persona, de las que nunca os habéis atrevido a hacer. Responde la persona, no el personaje."},
    {"id":"gn2","t":"La Toalla de Constantinopla","tags":[],"x":"Llega un regalo de Constantinopla: una toalla de seda que solo se puede usar una vez. En personaje, envuelve en ella a tu pareja y sécale gota a gota, despacio, como quien guarda un tesoro."}
  ],
  "carnaval/explicito/ridotto": [
    {"id":"gx1","t":"El Tahúr","tags":["voz"],"x":"Un tahúr os ofrece una partida a una sola mano: gana la carta más alta. En personaje, quien pierda le dice a quien gane lo que más le gustaría que le hiciera, sin eufemismos, y quien gane decide si lo cobra ahora o en el Casino."},
    {"id":"gx2","t":"La Máscara Caída","tags":["prenda"],"x":"A alguien se le cae la máscara en el Ridotto y todo el mundo mira. Quien lea este giro juega sin máscara y con una prenda menos durante la próxima canción, mientras su pareja le mira sin ningún disimulo."}
  ],
  "carnaval/explicito/aretino": [
    {"id":"gx3","t":"El Soneto Perdido","tags":["voz"],"x":"Encontráis un soneto de Aretino que nunca llegó a imprimirse. Quien lea este giro lo improvisa en voz alta sobre el cuerpo de su pareja, y su pareja hace, mientras tanto, lo que dicen los versos."},
    {"id":"gx4","t":"Pasos en el Pasillo","tags":["silencio"],"x":"Pasos en el pasillo: alguien busca los grabados para quemarlos. Durante media canción no se puede hacer ni un ruido, pero tampoco se puede parar lo que estabais haciendo."}
  ],
  "carnaval/explicito/casino": [
    {"id":"gx5","t":"La Otra Cita","tags":["voz"],"x":"Llaman a la puerta del casino: es la otra cita de esta noche de quien lea este giro. En personaje, despáchala sin abrir, con la voz más tranquila del mundo, mientras su pareja se lo pone tan difícil como pueda."},
    {"id":"gx6","t":"El Último Ducado","tags":[],"x":"Habéis perdido en el Ridotto hasta el último ducado, y el casino se paga al salir. En personaje, quien lea este giro ofrece lo único que le queda: una hora entera de lo que su pareja le pida."}
  ],
  "cotidiana/prohibicion/cocina": [
    {"id":"gk1","t":"El Ascensor","tags":["silencio"],"x":"Se oye el ascensor y unos pasos en el rellano. Quedaos inmóviles, sin hablar y sin separaros, hasta que se cierre una puerta: contad hasta veinte. Mientras tanto, cada cual puede mover una sola mano, sobre la ropa."},
    {"id":"gk2","t":"La Cerrajería Llama","tags":[],"x":"Llama la cerrajería: va con retraso. En personaje, quien lea este giro decide cuánto: por cada media hora que diga, su pareja le debe un baile en la cocina, tan cerca como permita la prohibición."}
  ],
  "cotidiana/prohibicion/salon": [
    {"id":"gs3","t":"El Timbre","tags":["silencio"],"x":"Llaman al timbre. Nadie se mueve: quien llama se cansará. Hasta que acabe la canción, nada de ruido y las manos quietas donde estaban; las bocas pueden moverse, pero no hacia la boca."},
    {"id":"gs4","t":"La Escena de la Película","tags":[],"x":"En la película que nadie mira empieza una escena subida de tono. Mientras dure, imitadla en el sofá, hasta donde deje la prohibición del salón."}
  ],
  "cotidiana/prohibicion/apagon": [
    {"id":"ga3","t":"Los Plomos","tags":[],"x":"Desde el patio, alguien del edificio grita que son los plomos y que va para largo. En personaje, quien lea este giro celebra la noticia como quiera, a oscuras y sin decir una sola palabra."},
    {"id":"ga4","t":"La Linterna","tags":["voz"],"x":"Aparece una linterna en un cajón. Quien lea este giro puede encenderla una sola vez, diez segundos, y alumbrar lo que quiera de su pareja. Después le dice al oído lo que ha visto."}
  ],
  "cotidiana/encender/cocina": [
    {"id":"gc5","t":"La Receta del Cajón","tags":["comida"],"x":"En un cajón aparece una receta escrita a mano por quien vivía antes en este piso, con una nota al margen: «para compartir con alguien que te guste». Quien lea este giro elige un ingrediente de lo que haya y se lo da a probar a su pareja, de su boca."},
    {"id":"gc6","t":"La Ventana de Enfrente","tags":["voz"],"x":"En la ventana del edificio de enfrente se apaga una luz. En personaje, quien lea este giro cuenta qué cree que están haciendo allí, con detalle, y su pareja lo imita aquí, en la cocina, hasta donde quiera."}
  ],
  "cotidiana/encender/bano": [
    {"id":"gb7","t":"Se Acaba el Agua Caliente","tags":[],"x":"Se acaba el agua caliente del edificio. Para no pasar frío, durante una canción nadie se separa de nadie: el calor tiene que salir de vuestros cuerpos."},
    {"id":"gb8","t":"La Última Toalla","tags":[],"x":"Solo queda una toalla limpia en toda la casa. En personaje, decidid cómo os secáis con una sola toalla, sin que nadie pase frío y sin ninguna prisa."}
  ],
  "cotidiana/encender/apagon": [
    {"id":"ga5","t":"La Vela se Apaga","tags":["silencio"],"x":"La vela se apaga sola. Durante media canción, a oscuras del todo, nadie habla: solo manos y respiración, hasta que alguien la vuelva a encender."},
    {"id":"ga6","t":"Voces en el Patio","tags":["voz"],"x":"Por el patio de luces se oye una conversación del vecindario. En personaje, quien lea este giro le susurra a su pareja lo que diría esa gente si hablara de lo que está pasando en este piso."}
  ],
  "cotidiana/explicito/entrada": [
    {"id":"gx7","t":"El Ascensor se Para","tags":["voz"],"x":"Se oye el ascensor pararse en vuestro piso. En personaje, quien lea este giro dice en voz alta, sin eufemismos, lo que haría si quien sale del ascensor fuera su pareja, y su pareja se lo hace ahora, aquí."},
    {"id":"gx8","t":"La Llamada","tags":["voz"],"x":"Suena el móvil de quien lea este giro: es la cerrajería. Contesta (finge la llamada) y habla con toda la calma del mundo mientras su pareja hace todo lo posible por que se le note."}
  ],
  "cotidiana/explicito/sofa": [
    {"id":"gx9","t":"La Mudanza de Arriba","tags":[],"x":"En el piso de arriba arrastran un mueble y tiembla el techo. Durante una canción, seguid el ritmo de los golpes, sea lo que sea lo que estéis haciendo."},
    {"id":"gx10","t":"La Lista de la Compra","tags":["voz"],"x":"En la nevera hay una lista de la compra. En personaje, quien lea este giro dicta otra en voz alta, sin eufemismos, con lo que quiere de su pareja antes de que acabe la tarde. Su pareja tacha lo que quiera, y cumple el resto."}
  ],
  "cotidiana/explicito/ducha": [
    {"id":"gx11","t":"Se Acaba el Agua Caliente","tags":[],"x":"Se acaba el agua caliente. A partir de ahora el calor tiene que salir de vuestros cuerpos: durante una canción, nadie se separa ni un centímetro."},
    {"id":"gx12","t":"Las Siete en Punto","tags":["voz"],"x":"Suena el timbre: son las siete y es la cerrajería, puntual por una vez. Nadie va a abrir. Quien lea este giro le dice a su pareja al oído, sin eufemismos, por qué esta tarde ya no hacen falta las llaves, y se lo demuestra mientras el timbre insiste."}
  ],
  "fantasia/prohibicion/corro": [
    {"id":"gc1","t":"El Tributo","tags":["voz"],"x":"La Corte del Corro exige un tributo para dejaros salir: una verdad al oído y un baile. En personaje, quien lea este giro paga el tributo: le susurra a su pareja algo que nunca se ha atrevido a decirle, y después bailáis la canción que suene, tan cerca como permita el voto."},
    {"id":"gc2","t":"Las Setas que se Apagan","tags":[],"x":"Las setas del Corro se apagan si dejáis de bailar. Durante una canción no podéis separaros ni un momento: si alguien se aparta, se apaga una seta y paga una moneda de oro de hada."}
  ],
  "fantasia/prohibicion/lago": [
    {"id":"gl1","t":"El Reflejo Robado","tags":["espejo"],"x":"El Lago se ha quedado con el reflejo de quien lea este giro, y solo lo devuelve a cambio de un beso en cada sitio que elija su pareja, menos en la boca. En personaje, negociad el precio antes de pagarlo."},
    {"id":"gl2","t":"La Bruma","tags":["silencio"],"x":"Se levanta una bruma que apaga todos los sonidos. Durante media canción, nada de palabras: solo manos sobre la piel, para encontraros en la niebla."}
  ],
  "fantasia/prohibicion/gruta": [
    {"id":"gg3","t":"La Luciérnaga Perdida","tags":["venda"],"x":"Una luciérnaga se ha posado en la piel de quien lleva la venda. Su pareja tiene que encontrarla a besos, sin usar las manos, y solo puede parar cuando oiga «luz»."},
    {"id":"gg4","t":"El Eco","tags":["voz"],"x":"La Gruta repite todo lo que se dice en voz baja. En personaje, quien lea este giro le dice al oído a su pareja lo que desea, y su pareja tiene que repetirlo palabra por palabra, como un eco, antes de concederlo."}
  ],
  "fantasia/encender/aire": [
    {"id":"ga1","t":"El Silfo","tags":["voz"],"x":"Un silfo, espíritu del aire, os roba las palabras durante una canción: solo se puede hablar soplando. Quien lea este giro dice lo que desea con el aliento sobre la piel de su pareja, y su pareja tiene que adivinarlo."},
    {"id":"ga2","t":"La Hoja que Cae","tags":[],"x":"Una hoja del Jardín cae sobre el hombro de tu pareja. Donde cae una hoja, dice el Bosque, hay que dar un beso: síguela con la boca mientras cae, despacio, por donde la lleve el viento."}
  ],
  "fantasia/encender/agua": [
    {"id":"gw1","t":"La Ondina","tags":[],"x":"Una ondina sale de la fuente y ofrece un deseo a cambio de un beso. En personaje, quien lea este giro pide el deseo y su pareja paga el beso donde la ondina diga: en el cuello, en la muñeca o detrás de la rodilla."},
    {"id":"gw2","t":"Agua que no Miente","tags":["confesion"],"x":"Quien bebe de esta fuente no puede mentir durante una canción. Bebed un sorbo de agua y haceos, por turnos, una pregunta que nunca os habéis hecho. Responde la persona, no el personaje."}
  ],
  "fantasia/encender/tierra": [
    {"id":"gt1","t":"La Raíz","tags":[],"x":"Una raíz brota del suelo y se enreda en los tobillos de quien lea este giro: no puede moverse durante una canción. Su pareja lo aprovecha: puede acercarse tanto como quiera, y apartarse justo cuando más se le eche de menos."},
    {"id":"gt2","t":"El Fruto de Cien Años","tags":["comida"],"x":"En el Huerto hay un fruto que solo madura una vez cada cien años. En personaje, ofrécele a tu pareja un bocado de lo que tengáis, de tu boca a la suya, y dile al oído qué le pasará cuando lo pruebe."}
  ],
  "fantasia/explicito/hogueras": [
    {"id":"gb1","t":"Las Chispas","tags":[],"x":"Saltan chispas de la hoguera y caen sobre la piel de quien lea este giro. Su pareja tiene que apagarlas a besos, una a una, donde caigan: en el cuello, en el pecho, en el vientre, y una más donde quiera."},
    {"id":"gb2","t":"La Gente del Reino","tags":["voz"],"x":"Alguien de la Corte se acerca a la hoguera y pregunta qué habéis venido a hacer esta noche. En personaje, quien lea este giro se lo cuenta en voz alta, con todo detalle y sin eufemismos, mientras su pareja escucha sin poder tocarle."}
  ],
  "fantasia/explicito/mayo": [
    {"id":"gb3","t":"La Cinta que se Suelta","tags":["atar"],"x":"Una cinta se suelta del Árbol de Mayo y se enreda en las muñecas de quien lea este giro. Si quiere, deja que su pareja la ate, floja y por delante, durante una canción. «Rojo» la suelta al instante."},
    {"id":"gb4","t":"La Música se Acelera","tags":[],"x":"Los músicos del Árbol tocan cada vez más deprisa. Sea lo que sea lo que estéis haciendo, durante una canción seguid el ritmo de la música; al terminar, a la mitad de velocidad."}
  ],
  "fantasia/explicito/helechos": [
    {"id":"gb5","t":"El Ciervo Blanco","tags":["voz"],"x":"Entre los helechos aparece el ciervo blanco de Beltane, que solo se deja ver por quien desea sin miedo. Quien lea este giro dice en voz alta lo que más desea ahora mismo; si su pareja también lo desea, se cumple."},
    {"id":"gb6","t":"La Hora en que el Bosque Calla","tags":["silencio"],"x":"Llega la hora en que el Bosque calla. Durante media canción no se puede decir ni una palabra, pero se puede hacer todo lo demás."}
  ]
};

  AMBIENTES[amb].modos[modo].escenas.forEach(e => { const k = amb + "/" + modo + "/" + e.id; if(CARTAS[k]) e.cartas = CARTAS[k]; if(GIROS[k]) e.giros = GIROS[k]; });

/* ---------- LA ESCAPADA ----------------------------------------------
   Un juego aparte, para una escapada de verdad: sin personajes. Se elige
   estación y alojamiento, y las propuestas llegan solas a lo largo del
   viaje (en la app de Android, con avisos aunque el móvil esté bloqueado).
   Los textos están en escapada/*.json y se inyectan aquí al construir:
   propuestas comunes, de cada estación y de cada alojamiento, más las de
   cada una de las 12 combinaciones, con sus cartas de Perdidos y de la alcoba.
------------------------------------------------------------------------ */
const ESCAPADA = {

  "reglas": ["Aquí no hay personajes: jugáis como sois. La app os va proponiendo cosas a lo largo de la escapada, con tiempo libre entre una y otra.", "Marcad en qué fase estáis: el viaje, la llegada, explorar, la cena y la alcoba. En cada una cambian el ritmo y el tono. Perderse y la cena son caminos opcionales.", "En el viaje, las propuestas las lee en voz alta quien no conduce. Quien conduce, solo conduce.", "Al llegar, las propuestas ya son personales: «Para» una persona, y solo la lee esa persona.", "Al explorar, cada persona tiene un reto secreto con su tiempo. Si se cumple, llega otro; si caduca, también. Si tu pareja dice que no, se marca como rechazado y no se insiste.", "«Perdidos» abre el juego de cartas al aire libre, con el tono al máximo, y solo donde estéis a solas de verdad. Al terminar, la tarde sigue en modo cena.", "La alcoba es el final, en privado, con su carta y su mazo. Cualquier propuesta se cambia sin explicar por qué, y podéis silenciar las propuestas cuando queráis."],
  "fases": {"viaje": {"n": "El viaje", "d": "El juego empieza al cerrar la puerta. Propuestas tranquilas, más o menos cada media hora: las lee siempre en voz alta quien no conduce. Quien conduce solo escucha y conduce.", "ritmo": [20, 35], "primera": [3, 6], "horizonte": 300}, "llegada": {"n": "La llegada", "d": "Ya nadie conduce. Buscad el sitio, montad la casa de esta noche y estrenadla. Las propuestas llegan más a menudo y son personales: solo las lee la persona a la que van.", "ritmo": [12, 20], "primera": [2, 4], "horizonte": 150}, "explora": {"n": "Explorar", "d": "Salid a perderos un poco. Cada persona tiene un reto secreto: si se cumple, llega otro; si caduca o tu pareja dice que no, también. Lo que pase de un beso, solo donde estéis a solas de verdad.", "pausa": [5, 10], "primera": [1, 3], "horizonte": 240}, "perdidos": {"n": "Perdidos", "d": "Un camino aparte: el juego de cartas al aire libre, con el tono al máximo. Solo si estáis a solas de verdad. Al terminar, la tarde sigue en modo cena."}, "cena": {"n": "La cena", "d": "Un respiro con el ambiente encendido: comer, mirar el cielo, hablar. Las propuestas llegan más espaciadas y más tranquilas.", "ritmo": [25, 40], "primera": [4, 8], "horizonte": 240}, "alcoba": {"n": "La alcoba", "d": "El final, en privado: la carta, el mazo de la alcoba y vuestros NO."}},
  "seguridad": [["A solas de verdad", "Lo que pase de un beso, solo donde nadie pueda veros ni llegar sin que lo oigáis. Si aparece alguien, se acabó al instante: ropa y a otra cosa, sin dramas. A la vista de otras personas puede costar una multa, y delante de menores es delito."], ["Quien conduce, conduce", "No mira el móvil ni las propuestas, y nada de juegos que le distraigan. Las propuestas las lee quien va al lado. Si alguien bebe, no conduce."], ["Dormir sin multas", "En la furgo, dentro y con todo recogido, donde se pueda aparcar: sin toldo, sillas ni mesas fuera. La acampada libre está prohibida o regulada casi en toda España y en todos los espacios protegidos: camping, área de acampada o terreno con permiso. Mirad las normas del sitio antes de ir."], ["Nada de fuego ni de gas dentro", "Nunca un hornillo, una estufa o una barbacoa dentro de la tienda o de la furgo cerrada: el monóxido de carbono no avisa. Y fuera, fuego solo en zonas preparadas y si no hay prohibición."], ["Que alguien sepa dónde estáis", "Decid a alguien adónde vais, llevad batería de sobra y el mapa descargado: en los sitios perdidos no siempre hay cobertura."], ["Sin rastro", "Todo lo que llevéis vuelve con vosotros, también los preservativos y los pañuelos."], ["Las señales de siempre", "«Ámbar», «rojo» y tres golpecitos valen también aquí. Cualquier propuesta se cambia o se rechaza sin explicar por qué."]],
  "material": ["Una manta grande para el suelo (o un pareo)", "Agua, algo de comer y una bolsa para la basura", "Batería externa y el mapa descargado", "Toallitas, pañuelos y lo que uséis para cuidaros (preservativos, lubricante)", "Una carta escrita por cada persona, cerrada, para abrir en la alcoba"],
  "estaciones": {"primavera": {"n": "Primavera", "d": "Todo despierta: verde nuevo, agua de deshielo, días que se alargan. Lluvia de repente y hierba alta.", "consejos": ["Garrapatas: evitad la hierba alta, tumbaos siempre sobre la manta y al volver revisaos el cuerpo, rincones incluidos.", "El tiempo cambia en una hora: llevad algo de abrigo y un plan bajo techo."], "material": ["Repelente de insectos y garrapatas", "Chubasquero"]}, "verano": {"n": "Verano", "d": "Días largos, ríos y pozas, noches tibias y cielos llenos de estrellas, con las Perseidas a mediados de agosto.", "consejos": ["Calor: agua de sobra, sombra y nada de esfuerzos al mediodía. Protección solar, también en la piel que no suele ver el sol.", "Ríos y pozas: entrad despacio, nunca de cabeza donde no veáis el fondo, y ojo con las corrientes.", "Riesgo de incendio: nada de fuego, y a menudo ni hornillo, fuera de las zonas permitidas."], "material": ["Crema solar", "Repelente de mosquitos", "Toalla de microfibra"]}, "otono": {"n": "Otoño", "d": "Bosques rojos y amarillos, niebla por la mañana, setas, castañas y la berrea de los ciervos. Anochece pronto.", "consejos": ["Anochece temprano: calculad la vuelta con luz y llevad frontal.", "Setas, solo las que conozcáis de verdad, y mirad si en esa zona hace falta permiso.", "Las garrapatas siguen activas: revisión mutua al volver."], "material": ["Frontal con luz roja", "Capas de ropa", "Un termo con algo caliente"]}, "invierno": {"n": "Invierno", "d": "Frío limpio, nieve quizá, noches largas y cielos nítidos. El calor se fabrica: mantas, cuerpos y algo caliente que beber.", "consejos": ["Fuera, el frío manda: nada de mojarse ni de quedarse sin ropa más de un momento. Lo intenso, bajo techo o bajo la manta.", "Mirad el estado de las carreteras y llevad cadenas si hace falta.", "Para dormir fuera de un hotel: saco adecuado a la temperatura y nada de estufas de gas en un espacio cerrado."], "material": ["Ropa térmica, gorro y guantes", "Bolsa de agua caliente"]}},
