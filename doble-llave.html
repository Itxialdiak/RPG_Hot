    "verano/acampada": {"titulo": "Verano al raso", "gancho": "Un río de montaña con pozas frías, días de cigarras y una noche sin techo: los sacos fuera de la tienda y el cielo entero encima.", "lugar": "Un camping de montaña junto a un río, o un área de acampada con rincones apartados. En agosto, si queréis las Perseidas.", "consejos": ["Al raso, siempre sobre esterilla y con la tienda montada al lado, por si cambia el tiempo o refresca de madrugada.", "En verano el fuego está casi siempre prohibido en el monte: cena fría, u hornillo solo donde se permita."], "material": ["Esterillas y sacos ligeros", "Repelente de mosquitos", "Toalla de microfibra para el río"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido río arriba, donde el sendero se convierte en piedras y el agua suena más fuerte que cualquier voz.", "Antes de nada: nadie en la orilla, nadie que pueda bajar por el camino sin que lo veáis, agua para beber y sombra.", "Extended la toalla grande. Desde aquí las cartas suben hasta el final. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["No hay techo. Encima, el cielo entero; debajo, las esterillas; alrededor, el río y los grillos.", "Comprobad que ninguna tienda os ve y que la vuestra sigue montada al lado, por si refresca. Sacad las cartas que escribisteis antes de salir y leedlas en voz baja, con la luz roja del frontal.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, bajo las estrellas."]}}, "propuestas": [
      {"id":"veac-v1","f":"viaje","para":"copi","t":"Sin techo","x":"Cuéntale a {O} que esta noche dormiréis sin techo. Pregúntale qué le pedirá a la primera estrella fugaz, y no te creas la primera respuesta."},
      {"id":"veac-v2","f":"viaje","para":"copi","t":"La canción de aquel verano","x":"Pon la canción de un verano que hayáis pasado a la vez y cuéntale a {O} el momento exacto en que la oísteis, con todos los detalles que recuerdes."},
      {"id":"veac-v3","f":"viaje","para":"copi","t":"Sin repelente","x":"Pregúntale a {O} en qué sitio de su cuerpo no le importaría que le picara algo esta noche. Toma nota: allí no irá el repelente."},
      {"id":"veac-l1","f":"llegada","para":"ambos","nivel":1,"t":"Pensando en el cielo","x":"Elegid el sitio de la tienda pensando en el cielo: despejado, lejos de las luces y de las demás tiendas. Esta noche, el techo es opcional."},
      {"id":"veac-l2","f":"llegada","para":"uno","nivel":1,"t":"Los pies en el río","x":"Antes de montar nada, lleva a {O} al río y entrad hasta las rodillas. El primer beso del viaje, con los pies helados y el sol en la cara.","tags":["hielo"]},
      {"id":"veac-l3","f":"llegada","para":"uno","nivel":1,"t":"Crema con mimo","x":"Mientras {O} monta la tienda, ponle crema o repelente en la nuca, los brazos y la espalda, despacio y con más mimo del necesario."},
      {"id":"veac-l4","f":"llegada","para":"uno","nivel":2,"t":"Probar el cielo","x":"Prepara los sacos fuera, sobre las esterillas, uno junto al otro. Cuando estén, túmbate y llama a {O} para probar el cielo un minuto."},
      {"id":"veac-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Cigarras","x":"Mientras cante una cigarra cerca, besa a {O}; cuando calle, dile algo de su cuerpo que te guste. Así hasta que caduque el reto.","suave":"Por cada cigarra que oigáis, un beso corto a {O}."},
      {"id":"veac-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"La roca caliente","x":"Tumbaos sobre una roca lisa calentada por el sol, lejos de la gente. Tu mano, por dentro de la camiseta de {O}, sigue el calor de la piedra.","suave":"Tumbaos en una roca caliente junto al río, con las manos entrelazadas.","tags":["aire"]},
      {"id":"veac-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"La poza más fría","x":"Lleva a {O} a la poza más fría y entrad a la vez. Al salir, el calor se recupera abrazando a {O} por dentro de su toalla.","suave":"Mojaos las piernas en la poza y abraza a {O} con la toalla al salir.","tags":["agua","hielo"]},
      {"id":"veac-e4","f":"explora","para":"uno","nivel":3,"min":45,"t":"El chorro de agua","x":"Buscad una cascada pequeña o un chorro de agua sin nadie cerca. Ponte detrás de {O} bajo el agua y desabrocha lo que haga falta para que le recorra la piel.","suave":"Bajo un chorro de agua, un beso largo con el agua cayendo.","tags":["aire","agua","prenda"]},
      {"id":"veac-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"Siesta con las ventanas abiertas","x":"A la hora de más calor, abrid las mosquiteras de la tienda y echaos la siesta con lo mínimo puesto. Tu mano no duerme.","suave":"Siesta en la tienda, en un abrazo y sin hacer nada más.","tags":["prenda"]},
      {"id":"veac-e6","f":"explora","para":"uno","nivel":3,"min":45,"t":"La sombra junto al río","x":"Siéntate con la espalda en un árbol junto al río y {O} entre tus piernas: tus manos le refrescan con agua del río por debajo de la ropa.","suave":"Siéntate con la espalda en un árbol junto al río, con {O} recostándose en ti y tus manos en su cintura.","tags":["aire"]},
      {"id":"veac-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Piedras lisas","x":"En una orilla de piedras lisas, lejos de todo, desnuda a {O} y túmbale sobre la toalla. Las piedras guardan el calor del día; tú pones el resto.","suave":"En una orilla de piedras lisas, tumbaos en la toalla en un abrazo, con tu mano bajo la ropa de {O}.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"El ensayo","x":"Antes de que anochezca del todo, y si ninguna tienda os ve, meteos en los sacos fuera, sin nada encima, como ensayo de la noche. El ensayo puede alargarse.","suave":"Antes de anochecer, tumbaos en los sacos fuera de la tienda, en un abrazo, a esperar la primera estrella.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-p1","f":"perdidos","temp":"seda","t":"Agua en la nuca","x":"Llena tus manos de agua del río y suéltala en la nuca de {R}. Con cada escalofrío, una prenda menos y un beso donde estaba.","tags":["aire","prenda","hielo"]},
      {"id":"veac-p2","f":"perdidos","temp":"seda","t":"Piedras calientes","x":"Tumba a {R} boca abajo sobre la toalla, en las piedras calientes, y recorre su espalda con las manos mojadas, bajando cada vez un poco más.","tags":["aire","prenda"]},
      {"id":"veac-p3","f":"perdidos","temp":"seda","t":"Menos en la boca","x":"Mientras canten las cigarras, besa a {R} en todas partes menos en la boca. Cuando callen, en la boca y en ninguna parte más.","tags":["aire"]},
      {"id":"veac-p4","f":"perdidos","temp":"brasa","t":"Sin bañador","x":"Desnuda a {R} en la orilla y entrad en el agua. Dentro, donde hagáis pie, que tus manos lo encuentren todo.","tags":["aire","agua","desnudez","intimo"]},
      {"id":"veac-p5","f":"perdidos","temp":"brasa","t":"Secarse al sol","x":"Al salir del agua, sobre la toalla y sin ropa, recorre a {R} con la boca mientras el sol le seca la piel.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-p6","f":"perdidos","temp":"brasa","t":"El río lo tapa todo","x":"El río tapa cualquier ruido. Sin ropa ni cartas, lo que pida {R}, como lo pida y tan alto como quiera.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-c1","f":"cena","para":"ambos","t":"Cena sin fuego","x":"Cena fría y sin fuego: fruta, pan, queso y algo fresco. Comed de las manos de la otra persona mientras se va el sol.","tags":["comida"]},
      {"id":"veac-c2","f":"cena","para":"uno","t":"El repelente de la noche","x":"Ponle a {O} el repelente de la noche con tus manos, despacio, por todo lo que vaya a quedar fuera del saco. Que se note que lo haces por gusto."},
      {"id":"veac-c3","f":"cena","para":"ambos","t":"La primera estrella","x":"Tumbaos en los sacos a esperar la primera estrella. Quien la vea antes elige cómo empieza la noche."},
      {"id":"veac-a1","f":"alcoba","temp":"seda","t":"Una prenda por estrella","x":"Por cada estrella fugaz que veáis, una prenda menos de {R} dentro del saco. Si no cae ninguna, inventaos una.","tags":["prenda","desnudez"]},
      {"id":"veac-a2","f":"alcoba","temp":"seda","t":"El cielo en la piel","x":"Señala una constelación y dibújala con el dedo en la piel de {R}, por dentro del saco. Después, otra, un poco más abajo.","tags":[]},
      {"id":"veac-a3","f":"alcoba","temp":"seda","t":"Fresco de madrugada","x":"Cuando refresque, junta tu cuerpo al de {R} dentro del saco y calienta con las manos cada sitio que se le haya enfriado.","tags":[]},
      {"id":"veac-a4","f":"alcoba","temp":"brasa","t":"Bajo el cielo","x":"Si ninguna tienda os ve, abrid los sacos como manta y desnuda a {R} bajo el cielo. Tu boca, por donde te deje, a la luz de las estrellas.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-a5","f":"alcoba","temp":"brasa","t":"El río tapa","x":"El río tapa los ruidos: durante una canción, que {R} no tenga que contenerse. Tus manos y tu boca, sin prisa.","tags":["aire","intimo"]},
      {"id":"veac-a6","f":"alcoba","temp":"brasa","t":"Hasta el alba","x":"Las noches de verano son cortas: que el alba os encuentre sin haber dormido mucho. Lo que queráis, hasta que {R} diga basta.","tags":["aire","desnudez","intimo"]},
      {"id":"veac-p7","f":"perdidos","temp":"brasa","t":"Las gotas del río","tags":["aire","desnudez","intimo"],"x":"Después de un baño en el río, a solas de verdad, tumba a {R} sobre la manta y recoge con la boca cada gota de su cuerpo, de arriba abajo, sin saltarte ningún camino."},
      {"id":"veac-a7","f":"alcoba","temp":"brasa","t":"Al raso del todo","tags":["aire","desnudez","intimo"],"x":"Fuera de la tienda, sin saco y sin ropa, bajo las estrellas: tu boca recorre todo el cuerpo de {R}, despacio, y se queda donde {R} se lo pida hasta la próxima estrella fugaz."}
    ]},
    "otono/hotel": {"titulo": "Otoño en el pueblo", "gancho": "Un pueblo de montaña que huele a humo de chimenea, castaños y hayedos encendidos de rojo, niebla al amanecer y una habitación donde la tarde se hace corta.", "lugar": "Un pueblo pequeño de montaña o de valle, cerca de un hayedo o de un castañar. Mejor una casa rural u hotel pequeño con chimenea y bañera.", "consejos": ["Los fines de semana de otoño los hayedos famosos se llenan: id entre semana o buscad el bosque menos conocido del valle.", "Anochece pronto y el monte se enfría deprisa: el paseo, por la mañana o a media tarde, y de vuelta con luz."], "material": ["Un jersey grande para prestar", "Una vela o una luz cálida para la habitación"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en el hayedo. El suelo es una alfombra roja que cruje, y el pueblo solo se adivina por el humo.", "Antes de nada: nadie entre los árboles, nadie en el camino, y la vuelta clara antes de que anochezca. Aquí, a las seis ya es tarde.", "Extended la manta sobre las hojas. Desde aquí las cartas suben hasta el final, con la ropa justa que permita el frío. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["Fuera hace frío y huele a leña. Dentro, la habitación ya guarda el calor de la tarde.", "Encended una luz cálida y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, bajo la manta.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que se levante la niebla."]}}, "propuestas": [
      {"id":"otho-v1","f":"viaje","para":"copi","t":"Cuando hay niebla","x":"Si hay niebla en la carretera, nada de juegos: pon música suave y cuéntale a {O}, en voz baja, cómo te gustaría que acabara el día, con la niebla al otro lado de la ventana."},
      {"id":"otho-v2","f":"viaje","para":"copi","t":"Dos horas y una chimenea","x":"Pregúntale a {O} qué haría con una chimenea, una alfombra y dos horas por delante. Que te lo cuente despacio: hay curvas."},
      {"id":"otho-v3","f":"viaje","para":"copi","t":"Tarde de lluvia","x":"Si llueve, cuéntale a {O} qué te gustaría hacer una tarde de lluvia sin salir de la cama. Con detalles, y sin saltarte la merienda."},
      {"id":"otho-l1","f":"llegada","para":"uno","nivel":1,"t":"El jersey prestado","x":"Al llegar, ponle a {O} tu jersey, aunque no tenga frío. Esta noche se lo quitas tú."},
      {"id":"otho-l2","f":"llegada","para":"ambos","nivel":1,"t":"Olor a leña","x":"Una vuelta corta por el pueblo siguiendo el olor a leña. Delante de cada casa con humo en la chimenea, adivinad qué estará pasando dentro."},
      {"id":"otho-l3","f":"llegada","para":"uno","nivel":2,"t":"Llenar la bañera","x":"Llena la bañera mientras {O} deshace la maleta y llámale cuando esté. Tú decides si entras o si miras.","tags":["agua"]},
      {"id":"otho-l4","f":"llegada","para":"uno","nivel":2,"t":"Manos frías","x":"Asoma a {O} a la ventana a mirar el valle, abrázale por detrás y mete tus manos frías por debajo de su jersey hasta que se calienten."},
      {"id":"otho-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Castañas","x":"Recoged castañas por el camino, donde esté permitido. Cada erizo que abras, un beso a {O} donde quieras.","suave":"Cada erizo que abras, un beso en la mano de {O}."},
      {"id":"otho-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"La bufanda","x":"En el hayedo, bajo las hojas rojas, quítale a {O} la bufanda o el gorro y bésale donde estaban: el cuello, las orejas, la nuca.","suave":"En el hayedo, un beso largo con las hojas cayendo."},
      {"id":"otho-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"Dos pasos fuera del camino","x":"Aprovechad la niebla: a dos pasos del camino, donde ya no se os ve, un beso con las manos por dentro de los abrigos.","suave":"Dentro de la niebla, un beso largo sin salir del camino."},
      {"id":"otho-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"La tarde corta","x":"Volved a la habitación cuando empiece a oscurecer: la tarde se acaba fuera, pero dentro empieza. Desnuda a {O} con la última luz.","suave":"Volved a la habitación con la última luz y echaos un rato en un abrazo.","tags":["desnudez"]},
      {"id":"otho-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"El banco del mirador","x":"En el mirador, si no hay nadie, siéntate en el banco con {O} encima, y tus manos por dentro de su abrigo mientras miráis el valle encendido.","suave":"En el mirador, un abrazo largo mirando el valle encendido.","tags":["aire"]},
      {"id":"otho-e6","f":"explora","para":"uno","nivel":3,"min":45,"t":"Setas","x":"Buscad setas, solo para mirar salvo que sepáis de verdad. Cada vez que encuentres una, quítale a {O} algo pequeño: un guante, la bufanda, un botón.","suave":"Cada seta que encontréis, un beso a {O}.","tags":["prenda"]},
      {"id":"otho-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"El castañar","x":"En un castañar a solas, sobre la manta y el colchón de hojas, desabrocha a {O} lo que el frío permita y que tu boca haga el resto. El bosque cruje: si alguien se acerca, lo oiréis.","suave":"En un castañar, tumbaos en la manta sobre las hojas, en un abrazo.","tags":["aire","prenda","intimo"]},
      {"id":"otho-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"La luz del fuego","x":"Con la habitación a oscuras y una vela, o la chimenea si es solo vuestra, una manta y {O} sin nada debajo de ella. Lo demás, despacio.","suave":"Junto a una vela o a la chimenea, un abrazo bajo la manta con tus manos bajo el jersey de {O}.","tags":["desnudez","intimo"]},
      {"id":"otho-p1","f":"perdidos","temp":"seda","t":"Como un regalo","x":"Tumba a {R} sobre la manta y las hojas, y desabrocha su abrigo como si abrieras un regalo. Debajo, tus manos frías piden permiso.","tags":["aire","prenda"]},
      {"id":"otho-p2","f":"perdidos","temp":"seda","t":"Una hoja grande","x":"Coge una hoja grande y suave y recorre con ella el cuello y el pecho de {R}, por dentro de la ropa. Donde se estremezca, tu boca.","tags":["aire","pluma"]},
      {"id":"otho-p3","f":"perdidos","temp":"seda","t":"Dentro del abrigo","x":"Abre tu abrigo y mete dentro a {R}, de espaldas a ti. Tus manos, por dentro de su ropa, despacio, mientras miráis el bosque.","tags":["aire"]},
      {"id":"otho-p4","f":"perdidos","temp":"brasa","t":"Lo justo","x":"Quítale a {R} solo lo imprescindible, que hace fresco, y que tu boca encuentre el camino entre la ropa que queda.","tags":["aire","prenda","intimo"]},
      {"id":"otho-p5","f":"perdidos","temp":"brasa","t":"El calor se fabrica","x":"Bajo la manta y sobre las hojas, con el cuerpo de {R} pegado al tuyo, lo que pida y como lo pida. El frío se queda fuera.","tags":["aire","desnudez","intimo"]},
      {"id":"otho-p6","f":"perdidos","temp":"brasa","t":"Hasta que se vaya la luz","x":"Que el bosque os retenga hasta que empiece a irse la luz. Lo que pase, al ritmo de {R}; después, ropa, abrazo y de vuelta con el frontal.","tags":["aire","desnudez","intimo"]},
      {"id":"otho-c1","f":"cena","para":"ambos","t":"De cuchara","x":"Pedid algo de cuchara y de pueblo: un guiso, una sopa, unas migas. Brindad por el frío que se ha quedado fuera."},
      {"id":"otho-c2","f":"cena","para":"uno","t":"Castaña caliente","x":"Pela una castaña asada y dásela a {O} en la boca, todavía caliente. Después, sopla en sus labios.","tags":["comida"]},
      {"id":"otho-c3","f":"cena","para":"ambos","t":"El bolsillo ajeno","x":"Volved a la habitación por la calle más oscura, con cada mano dentro del bolsillo de la otra persona."},
      {"id":"otho-a1","f":"alcoba","temp":"seda","t":"El jersey, de vuelta","x":"Quítale a {R} el jersey que le prestaste al llegar, despacio, y lo demás, igual de despacio. Cada prenda, un beso donde estaba.","tags":["prenda","desnudez"]},
      {"id":"otho-a2","f":"alcoba","temp":"seda","t":"Bañera con vela","x":"Una bañera caliente con la luz apagada y una vela. Colócate detrás de {R} y lávale la espalda, el cuello y los hombros, sin prisa.","tags":["agua","desnudez"]},
      {"id":"otho-a3","f":"alcoba","temp":"seda","t":"Gotas en el cristal","x":"Si llueve, apagad la luz y escuchad. Al ritmo de las gotas, tus dedos recorren la espalda de {R}, cada vez más despacio.","tags":[]},
      {"id":"otho-a4","f":"alcoba","temp":"brasa","t":"El edredón más gordo","x":"Bajo el edredón más gordo de la casa, sin nada encima, tu boca baja por el cuerpo de {R} hasta donde te pida.","tags":["desnudez","intimo"]},
      {"id":"otho-a5","f":"alcoba","temp":"brasa","t":"Manos de fuego","x":"A la luz de una vela, desnuda a {R} y recórrele con las manos calientes. Después, con la boca, sin dejarte nada de lo que te deje.","tags":["desnudez","intimo"]},
      {"id":"otho-a6","f":"alcoba","temp":"brasa","t":"La noche más larga","x":"Anochece a las seis: tenéis la noche entera. Lo que queráis, como queráis, sin mirar el reloj, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"otho-p7","f":"perdidos","temp":"brasa","t":"El abrigo como tienda","tags":["aire","intimo"],"x":"Sobre la manta y las hojas, con el abrigo abierto como una tienda, ponte entre las piernas de {R} y dale calor con la boca hasta que se le olvide el frío."},
      {"id":"otho-a7","f":"alcoba","temp":"brasa","t":"Avivar la chimenea","tags":["borde","intimo"],"x":"Frente a la chimenea o a una vela, acaricia a {R} donde más lo note y para justo cuando más lo esté disfrutando, como quien aviva un fuego. Tres veces. A la cuarta, que arda."}
    ]},
    "otono/furgo": {"titulo": "Otoño en furgo: la berrea", "gancho": "Un monte de robles y hayas en plena berrea: los ciervos braman al anochecer, la niebla se queda en el valle y la furgo se convierte en el sitio más caliente en kilómetros.", "lugar": "Una sierra o un valle con ciervos, con aparcamiento permitido en una pista o junto a un pueblo pequeño. Al atardecer, en silencio y a distancia, se oye la berrea.", "consejos": ["En la berrea, los ciervos no se molestan: miradlos de lejos, sin luces ni ruido, y nunca entre ellos y las hembras.", "Las noches de otoño en la furgo son frías y húmedas: ventilad un poco aunque refresque y llevad edredón de verdad."], "material": ["Prismáticos", "Edredón o saco de otoño", "Un termo de chocolate o vino caliente"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en el robledal, donde se acaba la pista. Huele a tierra mojada y, a lo lejos, un ciervo llama a quien desea.", "Antes de nada: nadie en la pista, nadie entre los árboles, y la furgo a la vista o el camino claro. Si dudáis, otro sitio.", "Extended la manta sobre las hojas. Desde aquí las cartas suben hasta el final, con la ropa que permita el frío. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["Fuera, el monte brama y hace frío. Dentro, la furgo es el sitio más caliente en kilómetros.", "Echad todas las cortinas, encended la luz cálida y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, bajo el edredón.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que la niebla suba del valle."]}}, "propuestas": [
      {"id":"otfu-v1","f":"viaje","para":"copi","t":"Los prismáticos","x":"Cuéntale a {O} que esta tarde miraréis ciervos en silencio, de lejos. Pregúntale qué harán sus manos mientras las tuyas sujetan los prismáticos."},
      {"id":"otfu-v2","f":"viaje","para":"copi","t":"De fuera hacia dentro","x":"Haced la lista de todo lo que os quitaréis esta noche, de fuera hacia dentro. Gana quien la diga más despacio."},
      {"id":"otfu-v3","f":"viaje","para":"copi","t":"Cuando esté caliente","x":"Pregúntale a {O} qué es lo primero que hará cuando la furgo esté caliente y las cortinas echadas. Si duda, que te lo diga al oído en la próxima parada."},
      {"id":"otfu-l1","f":"llegada","para":"ambos","nivel":1,"t":"Donde se oye el monte","x":"Buscad un aparcamiento permitido y tranquilo desde donde se oiga el monte. Apagad el motor y escuchad: si brama un ciervo, beso."},
      {"id":"otfu-l2","f":"llegada","para":"uno","nivel":2,"t":"La cama caliente","x":"Prepara la cama con el edredón grueso y deja dentro algo caliente: una bolsa de agua, tu jersey. Invita a {O} a meter las manos debajo, y las tuyas detrás."},
      {"id":"otfu-l3","f":"llegada","para":"uno","nivel":2,"t":"Pies fríos","x":"Quítale a {O} las botas y los calcetines y caliéntale los pies entre tus manos, en la cama, con la puerta abierta al monte."},
      {"id":"otfu-l4","f":"llegada","para":"uno","nivel":1,"t":"La misma taza","x":"Sirve a {O} algo caliente del termo y bebed de la misma taza. Donde ponga sus labios, pon los tuyos."},
      {"id":"otfu-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Solo con las manos","x":"Para ver ciervos hay que estar en silencio: mientras miréis, solo os habláis con las manos. Las tuyas, en la cintura de {O}.","suave":"Mientras miréis, solo os habláis con las manos, entrelazadas.","tags":["silencio"]},
      {"id":"otfu-e2","f":"explora","para":"uno","nivel":2,"min":40,"t":"Que no pierda al ciervo","x":"Mientras {O} mira por los prismáticos, ponte detrás y que tus manos le distraigan, sin que pierda de vista al ciervo.","suave":"Mientras {O} mira por los prismáticos, abrázale por detrás y respira en su nuca."},
      {"id":"otfu-e3","f":"explora","para":"uno","nivel":2,"min":35,"t":"El bramido","x":"Cuando brame un ciervo, besa a {O} con la misma intensidad. Si el ciervo repite, tú también.","suave":"Cada vez que brame un ciervo, un beso corto a {O}."},
      {"id":"otfu-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"Contra la furgo","x":"En una pista sin nadie, apoya a {O} contra la furgo, por el lado que no da a ningún camino, y bésale con las manos por dentro de la ropa.","suave":"Apoya a {O} contra la furgo y bésale despacio.","tags":["aire"]},
      {"id":"otfu-e5","f":"explora","para":"uno","nivel":3,"min":45,"t":"La siesta de la tarde","x":"Volved a la furgo, echad las cortinas y meteos bajo el edredón con lo mínimo. Fuera, el monte; dentro, vuestras manos.","suave":"Volved a la furgo y meteos bajo el edredón en un abrazo.","tags":["prenda"]},
      {"id":"otfu-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Hojas que caen","x":"Tumbaos en la manta sobre la hojarasca de un robledal. Por cada hoja que caiga sobre {O}, un botón menos.","suave":"Tumbaos en la manta sobre la hojarasca: por cada hoja que caiga, un beso.","tags":["aire","prenda"]},
      {"id":"otfu-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Antes de la berrea","x":"Una hora antes de que empiece la berrea, volved a la furgo: que la berrea os pille sin ropa y la escuchéis desde la cama.","suave":"Que la berrea os pille en la cama de la furgo, en un abrazo.","tags":["desnudez","intimo"]},
      {"id":"otfu-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"La puerta al bosque","x":"Si el bosque está vacío y el frío lo permite, abre la puerta grande y consigue que {O} se desnude para ti en la cama, despacio, mientras el bosque se pone rojo.","suave":"Con la puerta abierta al bosque, consigue que {O} se quite el jersey para ti, despacio.","tags":["aire","desnudez"]},
      {"id":"otfu-p1","f":"perdidos","temp":"seda","t":"La llamada","x":"Cuando brame un ciervo, quítale a {R} una prenda. Si el monte está generoso, la tarde se queda corta.","tags":["aire","prenda","desnudez"]},
      {"id":"otfu-p2","f":"perdidos","temp":"seda","t":"Hojas que crujen","x":"Tumba a {R} sobre la manta y las hojas secas, y desabrocha despacio lo que lleve. Cada hoja que cruja, un beso un poco más abajo.","tags":["aire","prenda"]},
      {"id":"otfu-p3","f":"perdidos","temp":"seda","t":"Aliento","x":"Con el frío de la tarde, recorre el cuello y el pecho de {R} solo con tu aliento caliente, por dentro de la ropa. Las manos, sin moverse.","tags":["aire"]},
      {"id":"otfu-p4","f":"perdidos","temp":"brasa","t":"Que el monte lo oiga","x":"Sin ropa bajo la manta, lo que pida {R}, con la misma urgencia que los ciervos… o más despacio, si lo pide. Que el monte también lo oiga.","tags":["aire","desnudez","intimo"]},
      {"id":"otfu-p5","f":"perdidos","temp":"brasa","t":"Entre los abrigos","x":"Sin quitar más de lo justo, que hace fresco: tus manos y tu boca encuentran a {R} entre los abrigos abiertos.","tags":["aire","prenda","intimo"]},
      {"id":"otfu-p6","f":"perdidos","temp":"brasa","t":"Hasta que se vaya la luz","x":"Sin cartas: lo que pida {R}, bajo la manta, hasta que se vaya la luz. Después, a la furgo a entrar en calor.","tags":["aire","desnudez","intimo"]},
      {"id":"otfu-c1","f":"cena","para":"ambos","t":"Una taza para compartir","x":"Calentad vino o chocolate, con la ventana abierta si usáis gas, y bebed de la misma taza mirando cómo se apaga el monte."},
      {"id":"otfu-c2","f":"cena","para":"uno","t":"Setas de confianza","x":"Cocina para {O} algo con setas o castañas de confianza, compradas valen, y dale la primera cucharada soplando antes.","tags":["comida"]},
      {"id":"otfu-c3","f":"cena","para":"ambos","t":"La berrea a oscuras","x":"Con la cena hecha, apagad todo y escuchad la berrea a oscuras. Cada bramido, un beso; cada silencio, una caricia."},
      {"id":"otfu-a1","f":"alcoba","temp":"seda","t":"Como una castaña","x":"Desnuda a {R} como se pela una castaña: capa a capa, sin prisa y con cuidado de no quemarte. Cada capa, un beso.","tags":["prenda","desnudez"]},
      {"id":"otfu-a2","f":"alcoba","temp":"seda","t":"Pies fríos, manos calientes","x":"Bajo el edredón, tus pies fríos buscan los de {R} y tus manos, todo lo demás. Durante una canción, solo manos.","tags":[]},
      {"id":"otfu-a3","f":"alcoba","temp":"seda","t":"El último bramido","x":"Si todavía brama algún ciervo, escuchad en silencio, y en cada bramido, tu boca en un sitio nuevo de {R}.","tags":[]},
      {"id":"otfu-a4","f":"alcoba","temp":"brasa","t":"El frío, en los cristales","x":"Que el frío se quede en los cristales: sin ropa bajo el edredón, recorre a {R} con la boca hasta donde te pida.","tags":["desnudez","intimo"]},
      {"id":"otfu-a5","f":"alcoba","temp":"brasa","t":"El monte entero desea","x":"Esta noche, el monte entero desea. Si {R} quiere, sin prisa pero sin pausa: lo que pida y como lo pida.","tags":["desnudez","intimo"]},
      {"id":"otfu-a6","f":"alcoba","temp":"brasa","t":"Hasta la niebla","x":"Que la niebla de la mañana os encuentre sin haber dormido. Lo que queráis, como queráis, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"otfu-p7","f":"perdidos","temp":"brasa","t":"Como la berrea","tags":["aire","desnudez","intimo","voz"],"x":"Mientras la berrea suena en el monte, dentro de la furgo y sin ropa: haz que a {R} se le olvide la vergüenza de hacer ruido. Si el monte grita, aquí también se puede."},
      {"id":"otfu-a7","f":"alcoba","temp":"brasa","t":"Cristales empañados","tags":["solo","desnudez"],"x":"Con los cristales empañados, tócate delante de {R} hasta que no se vea nada por las ventanas. {R} solo puede mirar, hasta que no pueda más."}
    ]},
    "otono/acampada": {"titulo": "Otoño en tienda", "gancho": "Un bosque que cruje bajo los pies, setas por todas partes, tardes cortas y noches frías en las que la tienda se convierte en el único sitio tibio del mundo.", "lugar": "Un camping de montaña o de bosque, casi vacío fuera de temporada, con parcelas bajo los árboles. Comprobad que sigue abierto: muchos cierran en octubre.", "consejos": ["Las noches de otoño bajan de diez grados con facilidad: saco de verdad, esterilla gruesa y ropa seca solo para dormir.", "Si llueve, la tienda bien tensada y nada tocando las paredes por dentro, o entrará el agua."], "material": ["Saco para frío y esterilla gruesa", "Una lona por si llueve", "Ropa seca solo para dormir"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en el bosque, entre troncos cubiertos de musgo y un suelo que cruje a cada paso. El camping queda lejos y en silencio.", "Antes de nada: nadie entre los árboles, nadie en el sendero, y el camino de vuelta claro antes de que anochezca. Aquí oscurece pronto.", "Extended la manta sobre las hojas. Desde aquí las cartas suben hasta el final, con la ropa que permita el frío. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["La noche de otoño cae deprisa y fría. La tienda es ahora una isla tibia en un bosque que cruje.", "Cerrad la cremallera, poned el frontal en luz roja y sacad las cartas que escribisteis antes de salir. Leedlas en voz baja, dentro del saco.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta la mañana."]}}, "propuestas": [
      {"id":"otac-v1","f":"viaje","para":"copi","t":"De valientes","x":"Cuéntale a {O} por qué acampar en otoño es de valientes, y qué piensas hacer para que no pase frío esta noche. Todo, con detalle."},
      {"id":"otac-v2","f":"viaje","para":"copi","t":"A qué huele","x":"Pregúntale a {O} a qué le huele el otoño: tierra mojada, humo, castañas. Después, dile tú a qué huele su cuello cuando hace frío."},
      {"id":"otac-v3","f":"viaje","para":"copi","t":"Setas con nombre","x":"Inventad nombres de setas que suenen picantes. Por cada uno que os haga reír, un beso en la próxima parada."},
      {"id":"otac-l1","f":"llegada","para":"ambos","nivel":1,"t":"El árbol bueno","x":"Elegid una parcela bajo un árbol que no gotee ni tenga ramas secas encima, y montad la tienda antes de que se vaya la luz: a las siete ya es de noche."},
      {"id":"otac-l2","f":"llegada","para":"uno","nivel":1,"t":"Hojas en la tienda","x":"Mientras montáis, por cada hoja que caiga dentro de la tienda, un beso a {O}. En otoño, no paran."},
      {"id":"otac-l3","f":"llegada","para":"uno","nivel":2,"t":"Sacos tibios","x":"Mete tú los sacos en la tienda y caliéntalos un rato desde dentro. Cuando estén tibios, invita a {O} a entrar en el tuyo."},
      {"id":"otac-l4","f":"llegada","para":"uno","nivel":2,"t":"La ropa de dormir","x":"Calienta contra tu cuerpo la ropa seca de dormir de {O} antes de dársela. Si prefieres cambiársela tú, mejor."},
      {"id":"otac-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Crujidos","x":"Por cada paso de {O} que cruja sobre las hojas secas, una palabra bonita al oído. Si se cansa de oírlas, que te calle con un beso.","suave":"Cada vez que cruja una hoja bajo vuestros pies, un apretón de manos.","tags":["voz"]},
      {"id":"otac-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"La seta más bonita","x":"Busca la seta más bonita del bosque, sin cogerla, y enséñasela a {O}. Tu premio: un beso donde tú elijas.","suave":"Busca la seta más bonita del bosque y enséñasela a {O}: tu premio es un beso en la mejilla."},
      {"id":"otac-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"Niebla entre las tiendas","x":"Si la niebla cubre el camping, aprovechadla: un beso largo donde nadie os vea, con las manos por dentro de los abrigos.","suave":"Si hay niebla, un beso dentro de ella, sin más."},
      {"id":"otac-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"El tronco caído","x":"Sobre un tronco caído, lejos del camping, que {O} se siente en tus piernas y que tus manos se calienten por dentro de su ropa.","suave":"Sobre un tronco caído, un abrazo largo mirando el bosque.","tags":["aire"]},
      {"id":"otac-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"Entrar en calor","x":"A media tarde, cuando empiece a refrescar, meteos en la tienda a entrar en calor con lo mínimo puesto. En silencio: las tiendas oyen.","suave":"A media tarde, meteos en la tienda a entrar en calor, en un abrazo.","tags":["prenda","silencio"]},
      {"id":"otac-e6","f":"explora","para":"uno","nivel":3,"min":45,"t":"Gotas en la tela","x":"Si llueve, que os pille dentro de la tienda: por cada gota que suene fuerte en la tela, una prenda menos de {O}, hasta que pare o hasta que no quede ninguna.","suave":"Si llueve, escuchad la lluvia en la tienda, en un abrazo.","tags":["prenda","desnudez"]},
      {"id":"otac-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"El hayedo vacío","x":"En un hayedo vacío, lejos del camping, extended la manta sobre las hojas y desnuda a {O} lo que el frío permita. Lo demás, bajo el abrigo.","suave":"En un hayedo vacío, tumbaos en la manta en un abrazo, bajo el abrigo.","tags":["aire","desnudez","intimo"]},
      {"id":"otac-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"Antes de cenar","x":"Antes de cenar, meteos en un solo saco sin nada encima, solo para calentaros. La cena puede esperar.","suave":"Antes de cenar, meteos en un solo saco con la ropa puesta, en un abrazo.","tags":["desnudez","intimo"]},
      {"id":"otac-p1","f":"perdidos","temp":"seda","t":"Leer la piel","x":"Tumba a {R} sobre la manta junto a un tronco con musgo. Abre su abrigo y su ropa como quien abre una carta, y lee la piel con los labios.","tags":["aire","prenda"]},
      {"id":"otac-p2","f":"perdidos","temp":"seda","t":"Un puñado de hojas","x":"Echa un puñado de hojas secas sobre {R} y quítaselas una a una, con un beso donde estaba cada hoja.","tags":["aire"]},
      {"id":"otac-p3","f":"perdidos","temp":"seda","t":"El vaho","x":"Con el frío, el aliento se ve. Recorre el cuerpo de {R} por dentro de la ropa, y que vea tu vaho en cada beso.","tags":["aire"]},
      {"id":"otac-p4","f":"perdidos","temp":"brasa","t":"Bajo la manta","x":"Sin ropa bajo la manta y sobre las hojas, tu boca recorre a {R} mientras el bosque cruje. Que el frío se quede fuera.","tags":["aire","desnudez","intimo"]},
      {"id":"otac-p5","f":"perdidos","temp":"brasa","t":"Más cerca, nunca menos","x":"Quítale a {R} lo que el frío permita y que tus manos y tu boca hagan el resto. Si tiene frío, más cerca, nunca menos.","tags":["aire","prenda","intimo"]},
      {"id":"otac-p6","f":"perdidos","temp":"brasa","t":"Hasta que se vaya la luz","x":"Sin cartas: lo que pida {R}, como lo pida. Cuando la luz empiece a irse, abrazo, ropa y de vuelta al camping.","tags":["aire","desnudez","intimo"]},
      {"id":"otac-c1","f":"cena","para":"ambos","t":"Algo caliente","x":"Cenad algo caliente del hornillo, fuera de la tienda y donde se permita: una sopa, un guiso, un chocolate. Una manta sobre los hombros de quien no cocina."},
      {"id":"otac-c2","f":"cena","para":"uno","t":"Delante del fuego","x":"Si el camping tiene una zona de fuego permitida, ponte con {O} delante, en un abrazo, y caliéntale las manos dentro de tu abrigo."},
      {"id":"otac-c3","f":"cena","para":"ambos","t":"Noches claras","x":"Las noches frías son las más claras. Diez minutos mirando el cielo antes de entrar en la tienda, en un abrazo, buscando la primera estrella fugaz del otoño."},
      {"id":"otac-a1","f":"alcoba","temp":"seda","t":"Cambio de ropa","x":"Desnuda a {R} dentro del saco y cambia su ropa de día por tu cuerpo. La ropa seca de dormir, para después… si hace falta.","tags":["prenda","desnudez"]},
      {"id":"otac-a2","f":"alcoba","temp":"seda","t":"Manos frías, piel tibia","x":"Calienta tus manos con el aliento antes de tocar a {R}. Cada vez que se enfríen, vuelve a empezar, un poco más abajo.","tags":[]},
      {"id":"otac-a3","f":"alcoba","temp":"seda","t":"Lluvia sobre la tela","x":"Si llueve, escuchad la lluvia en la tela sin decir nada. Al ritmo de las gotas, tus manos recorren a {R} dentro del saco.","tags":[]},
      {"id":"otac-a4","f":"alcoba","temp":"brasa","t":"Solo vuestro calor","x":"Que el saco solo guarde vuestro calor: sin ropa, tu boca baja por el cuerpo de {R} hasta donde te pida.","tags":["desnudez","intimo"]},
      {"id":"otac-a5","f":"alcoba","temp":"brasa","t":"Un palmo de frío","x":"Abre la cremallera un palmo para que entre el frío y no la cierres hasta que {R} te lo pida, mientras tu boca le hace olvidar el frío.","tags":["intimo"]},
      {"id":"otac-a6","f":"alcoba","temp":"brasa","t":"Escarcha fuera","x":"Que la mañana os pille con la escarcha fuera y el calor dentro. Lo que queráis, como queráis, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"otac-p7","f":"perdidos","temp":"brasa","t":"Dentro de la niebla","tags":["aire","intimo"],"x":"En la niebla, a dos pasos de nadie, desabrocha a {R} lo justo y que tu mano y tu boca trabajen sin prisa bajo la ropa abierta, hasta que se levante la niebla o {R} te pida más."},
      {"id":"otac-a7","f":"alcoba","temp":"brasa","t":"El saco doble","tags":["desnudez","intimo"],"x":"Unid los sacos, quitaos todo y haced el amor despacio, a oscuras, sin abrir la cremallera y al ritmo que marque {R}: el calor no se escapa si no hay prisa."}
    ]},
    "invierno/hotel": {"titulo": "Invierno en el pueblo", "gancho": "Un pueblo de montaña con nieve en los tejados, humo en todas las chimeneas y una habitación caliente donde la noche empieza a las seis.", "lugar": "Un pueblo de montaña o de valle frío, con un hotel pequeño o una casa rural con chimenea y, si puede ser, bañera.", "consejos": ["Mirad el estado de la carretera antes de salir y llevad cadenas o neumáticos de invierno: los puertos cierran sin avisar.", "Fuera, el frío manda: lo intenso, en la habitación. En la calle, abrigos abiertos y poco más."], "material": ["Cadenas o neumáticos de invierno", "Ropa de abrigo de verdad", "Algo suave y cómodo para la habitación"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en el monte blanco. No se oye nada: la nieve se traga los ruidos y las únicas huellas son las vuestras.", "Con este frío, perderse es corto y abrigado: nada de quitarse la ropa ni de mojarse. Comprobad que estáis a solas y que el camino de vuelta se ve.", "Las cartas suben desde aquí, pero por dentro de los abrigos. Cuando el frío avise, a la habitación: allí os espera lo demás."]}, "alcoba": {"parrafos": ["La noche de invierno ha llegado pronto y se quedará muchas horas. Fuera nieva o hiela; dentro, solo hace calor.", "Echad las cortinas, encended una luz cálida y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, bajo el edredón.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta la mañana blanca."]}}, "propuestas": [
      {"id":"inho-v1","f":"viaje","para":"copi","t":"Si hay nieve","x":"Si hay nieve en la carretera, nada de juegos: música tranquila y que {O} conduzca en paz. Cuando no la haya, cuéntale cómo vas a calentarle esta noche."},
      {"id":"inho-v2","f":"viaje","para":"copi","t":"Delante de una chimenea","x":"Pregúntale a {O} qué es lo que más le gusta hacer delante de una chimenea. Si la respuesta es «leer», que lo piense otra vez."},
      {"id":"inho-v3","f":"viaje","para":"copi","t":"El bigote de chocolate","x":"Promete a {O} un chocolate caliente al llegar, y cuéntale cómo vas a quitarle el bigote de chocolate cuando se lo beba."},
      {"id":"inho-l1","f":"llegada","para":"uno","nivel":1,"t":"Botas mojadas","x":"Al entrar en la habitación, quítale a {O} las botas mojadas y los calcetines, y caliéntale los pies entre tus manos."},
      {"id":"inho-l2","f":"llegada","para":"ambos","nivel":1,"t":"Probar la cama","x":"Subid la calefacción, echad las cortinas y comprobad que la cama es lo bastante grande para lo que tenéis pensado. Probadla, sin quitaros nada… de momento."},
      {"id":"inho-l3","f":"llegada","para":"uno","nivel":2,"t":"Quitar el frío","x":"Prepara un baño caliente nada más llegar y mete a {O} dentro para quitarle el frío del viaje. Tú, dentro o en el borde.","tags":["agua"]},
      {"id":"inho-l4","f":"llegada","para":"uno","nivel":2,"t":"La ventana nevada","x":"Abraza a {O} por detrás frente a la ventana, mirando la nieve, con tus manos por dentro de su jersey y tu boca en su nuca."},
      {"id":"inho-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Huellas","x":"En la nieve recién caída, escribe con el pie un mensaje para {O}: dos palabras, las dos para esta noche.","suave":"Escribe el nombre de {O} en la nieve, con un corazón alrededor si te atreves."},
      {"id":"inho-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"Bigote de chocolate","x":"En el bar del pueblo, pide un chocolate para compartir. Cuando a {O} le quede chocolate en el labio, quítaselo con un beso, aunque haya gente.","suave":"Pide un chocolate para compartir y, cuando a {O} le quede en el labio, quítaselo con el dedo.","tags":["comida"]},
      {"id":"inho-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"Copos en el pelo","x":"Si nieva, salid a la calle más vacía y besa a {O} bajo los copos hasta que se le queden en el pelo.","suave":"Si nieva, un beso corto bajo los copos y de vuelta al calor."},
      {"id":"inho-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"El soportal","x":"En un portal o un soportal vacío, abre tu abrigo, mete dentro a {O} y que tus manos frías busquen su piel por debajo de las capas.","suave":"En un soportal vacío, mete a {O} dentro de tu abrigo, en un abrazo.","tags":["hielo"]},
      {"id":"inho-e5","f":"explora","para":"uno","nivel":3,"min":45,"t":"La siesta de invierno","x":"A media tarde, volved a la habitación, echad las cortinas y meteos en la cama sin ropa, solo para entrar en calor.","suave":"A media tarde, volved a la habitación y meteos bajo el edredón en un abrazo.","tags":["desnudez"]},
      {"id":"inho-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Resbalones","x":"En el paseo por la nieve, cada vez que {O} resbale, le sujetas con un beso… y una mano que se queda dentro de su abrigo.","suave":"En el paseo por la nieve, cada vez que {O} resbale, le sujetas con un beso."},
      {"id":"inho-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Bañera con nieve en la ventana","x":"Mientras fuera nieva, una bañera caliente compartida, con la luz apagada y la nieve en la ventana. Lo que pase en el agua, sin prisa.","suave":"Una bañera caliente en la que {O} se recuesta en ti, en silencio, mirando nevar.","tags":["agua","desnudez","intimo"]},
      {"id":"inho-e8","f":"explora","para":"uno","nivel":4,"min":45,"t":"Un rincón nevado","x":"En un rincón a solas del monte nevado, abrid los abrigos y que tus manos se metan por dentro de la ropa de {O}, todo lo cerca que deje el frío. Después, corriendo a la habitación.","suave":"En un rincón nevado, un beso con los abrigos abiertos y corriendo a la habitación.","tags":["aire","intimo","hielo"]},
      {"id":"inho-p1","f":"perdidos","temp":"seda","t":"Dentro del abrigo","x":"Abre tu abrigo y mete dentro a {R}, de frente. Tus manos buscan su piel por debajo de las capas, despacio, sin dejar entrar el frío.","tags":["aire"]},
      {"id":"inho-p2","f":"perdidos","temp":"seda","t":"Aliento en la garganta","x":"Desabrocha solo el cuello del abrigo de {R} y caliéntale la garganta con tu aliento y tus labios.","tags":["aire"]},
      {"id":"inho-p3","f":"perdidos","temp":"seda","t":"Copos","x":"Si nieva, mira cómo caen los copos en la cara de {R} y quítaselos uno a uno con la boca.","tags":["aire"]},
      {"id":"inho-p4","f":"perdidos","temp":"seda","t":"Contar capas","x":"Quítate los guantes, calienta las manos con tu aliento y mételas por la espalda de {R}, debajo de todas las capas. Cuéntalas en voz alta al pasar.","tags":["aire","hielo"]},
      {"id":"inho-p5","f":"perdidos","temp":"brasa","t":"Sin quitar nada","x":"Sin quitar nada, que hace frío: tus manos bajan por dentro de la ropa de {R} hasta donde te deje, con los abrigos haciendo de tienda.","tags":["aire","intimo"]},
      {"id":"inho-p6","f":"perdidos","temp":"brasa","t":"Contra un árbol","x":"Abrid los abrigos y juntad los cuerpos dentro, de pie contra un árbol. Lo que hagan ahí las manos no lo verá nadie, y el frío tampoco.","tags":["aire","intimo"]},
      {"id":"inho-p7","f":"perdidos","temp":"brasa","t":"Rápido y abrigado","x":"Lo que pase aquí, rápido y abrigado: un beso que no acaba y tus manos dentro de la ropa de {R}. Cuando el frío avise, a la habitación a terminarlo.","tags":["aire","intimo"]},
      {"id":"inho-p8","f":"perdidos","temp":"brasa","t":"De vuelta corriendo","x":"Volved sin soltaros, tan deprisa como deje la nieve. En la habitación, lo que pida {R}: el monte solo era el principio.","tags":["desnudez","intimo"]},
      {"id":"inho-c1","f":"cena","para":"ambos","t":"La mesa del fuego","x":"Si hay chimenea en el comedor, pedid la mesa más cercana. Brindad por el frío que habéis pasado y por el calor que queda."},
      {"id":"inho-c2","f":"cena","para":"uno","t":"La primera cucharada","x":"Sopla la primera cucharada de sopa de {O} y dásela tú. La segunda, que te la dé a ti.","tags":["comida"]},
      {"id":"inho-c3","f":"cena","para":"ambos","t":"Copos y farolas","x":"Volved a la habitación por la calle nevada, despacio y en un abrazo. En cada farola, un copo que se derrite en un beso."},
      {"id":"inho-a1","f":"alcoba","temp":"seda","t":"Capas de invierno","x":"Desnuda a {R} capa a capa, que en invierno son muchas. Cada capa que caiga, un beso donde estaba.","tags":["prenda","desnudez"]},
      {"id":"inho-a2","f":"alcoba","temp":"seda","t":"Pies fríos","x":"Bajo el edredón, calienta los pies de {R} con los tuyos y sus manos con tu aliento. Lo demás, con lo que quieras.","tags":[]},
      {"id":"inho-a3","f":"alcoba","temp":"seda","t":"Nieve en la ventana","x":"Con la luz apagada y la nieve en la ventana, recorre con los dedos la espalda de {R} durante una canción entera, de la nuca a la cintura.","tags":[]},
      {"id":"inho-a4","f":"alcoba","temp":"brasa","t":"La cueva","x":"Meteos bajo el edredón como en una cueva, sin ropa y sin luz. Tu boca baja por el cuerpo de {R} hasta donde te pida.","tags":["desnudez","intimo"]},
      {"id":"inho-a5","f":"alcoba","temp":"brasa","t":"Manos de fuego","x":"Delante de la chimenea o la estufa, si la habitación la tiene, y sin ropa: recorre a {R} con las manos calientes y después con la boca.","tags":["desnudez","intimo"]},
      {"id":"inho-a6","f":"alcoba","temp":"brasa","t":"Catorce horas de noche","x":"Tenéis catorce horas de noche: lo que queráis, como queráis, con pausas para el chocolate, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"inho-p9","f":"perdidos","temp":"brasa","t":"El abrigo abierto","tags":["aire","intimo"],"x":"En un sitio a solas, abre tu abrigo, mete a {R} dentro, de espaldas a ti, y desliza la mano por dentro de su ropa hasta lo más íntimo, sin dejar entrar el frío."},
      {"id":"inho-a7","f":"alcoba","temp":"brasa","t":"La bañera caliente","tags":["agua","borde","intimo"],"x":"En la bañera caliente, detrás de {R}: acaríciale bajo el agua donde más lo note y para cuando esté a punto. Tres veces, despacio. A la cuarta, que se enfríe el agua si quiere."}
    ]},
    "invierno/furgo": {"titulo": "Invierno en furgo", "gancho": "La furgo aparcada junto a un valle nevado, la calefacción en marcha, escarcha en los cristales y, fuera, un silencio blanco que solo se rompe desde dentro.", "lugar": "Un aparcamiento permitido en un valle o un puerto de montaña con nieve, cerca de un pueblo por si acaso. Mirad las previsiones y no os quedéis en un sitio sin salida.", "consejos": ["Si la furgo tiene calefacción estacionaria, que esté bien instalada y con la salida de gases fuera, y llevad detector de monóxido. Nunca estufas de gas ni hornillos para calentar.", "Aparcad en un sitio del que podáis salir aunque nieve más, con el depósito lleno y las cadenas a mano."], "material": ["Detector de monóxido de carbono", "Edredón grueso o saco de invierno", "Bolsas de agua caliente", "Cadenas"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido a dos pasos de la furgo, que es lo más lejos que conviene perderse con nieve.", "El frío decide: nada de quitarse ropa fuera ni de mojarse. Comprobad que estáis a solas, que la furgo está caliente y que el camino se ve.", "Las cartas suben desde aquí, primero fuera y con abrigo, y en cuanto el frío avise, dentro de la furgo. Allí sigue todo."]}, "alcoba": {"parrafos": ["Fuera hiela y la nieve brilla con la luna. Dentro, la calefacción zumba y los cristales se han vuelto blancos.", "Poned los aislantes, comprobad que entra un poco de aire y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, bajo el edredón.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que el sol derrita la escarcha."]}}, "propuestas": [
      {"id":"infu-v1","f":"viaje","para":"copi","t":"A qué temperatura","x":"Pregúntale a {O} a qué temperatura quiere la furgo esta noche, y por qué. Si dice que le da igual, avísale: la subirás lo justo para que sobre la ropa."},
      {"id":"infu-v2","f":"viaje","para":"copi","t":"Con hielo, nada","x":"Si la carretera tiene nieve o hielo, nada de juegos ni de distraer: música suave y paciencia. Pasado lo peor, cuéntale a {O} lo primero que harás al aparcar."},
      {"id":"infu-v3","f":"viaje","para":"copi","t":"Un deseo de invierno","x":"Pídele a {O} un deseo para esta noche que empiece por «Quiero que me…». Apúntalo, y no digas cuándo lo vas a cumplir."},
      {"id":"infu-l1","f":"llegada","para":"ambos","nivel":1,"t":"El sitio blanco","x":"Buscad un sitio permitido, llano y fácil de dejar aunque nieve más. Apagad el motor, encended la calefacción y mirad la nieve un minuto en silencio."},
      {"id":"infu-l2","f":"llegada","para":"uno","nivel":2,"t":"Lo que sobra","x":"Cuando la furgo esté caliente, quítale a {O} el abrigo, las botas y lo que sobre. De lo que quede, decides tú qué sobra.","tags":["prenda"]},
      {"id":"infu-l3","f":"llegada","para":"uno","nivel":1,"t":"Bolsas de agua caliente","x":"Prepara las bolsas de agua caliente y mételas en la cama. Cuando esté tibia, mete a {O} entre ellas… y entre tus brazos."},
      {"id":"infu-l4","f":"llegada","para":"uno","nivel":2,"t":"Aislantes","x":"Pon tú los aislantes de las ventanas mientras {O} mira desde la cama. Cada ventana tapada, un beso; la última, uno que no acabe."},
      {"id":"infu-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Ángeles","x":"Tírate a la nieve y haz un ángel; después, ayuda a {O} a hacer el suyo y bésale en la nieve antes de levantaros.","suave":"Haced dos ángeles en la nieve, uno junto al otro, y volved dentro de la mano."},
      {"id":"infu-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"Escarcha","x":"Escribe con el dedo en la escarcha de un cristal de la furgo, por fuera, algo que vaya a pasar esta noche. Que {O} lo descifre desde dentro, al revés.","suave":"Escribe el nombre de {O} en la escarcha de un cristal."},
      {"id":"infu-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"El paseo corto","x":"Un paseo corto por la nieve, de la mano. A la vuelta, antes de entrar, un beso con la puerta abierta y el calor saliendo a buscaros.","suave":"Un paseo corto por la nieve, de la mano, y un beso al volver."},
      {"id":"infu-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"Fuera nieva","x":"Volved a la furgo, encended la calefacción y meteos en la cama con lo mínimo. Fuera nieva; dentro, tus manos no paran.","suave":"Volved a la furgo y meteos en la cama en un abrazo, mirando nevar.","tags":["prenda"]},
      {"id":"infu-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"Cristales empañados","x":"Consigue que los cristales de la furgo se empañen a media tarde. Cómo, ya lo sabes: solo tienes que convencer a {O}.","suave":"Besa a {O} hasta que se empañe un cristal, y para ahí."},
      {"id":"infu-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Un copo en la nuca","x":"En la puerta de la furgo, coge un poco de nieve y pásala por la nuca de {O}, una sola vez. Después, caliéntale hasta que te pida que pares.","suave":"Deja caer un copo en la nuca de {O} y caliéntasela con un beso.","tags":["hielo"]},
      {"id":"infu-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Un iglú caliente","x":"Con la calefacción en marcha y la nieve fuera, desnuda a {O} en la cama, despacio y sin prisa por taparle: aquí dentro no hace frío.","suave":"Bajo el edredón, quítale a {O} el jersey y abrázale piel con piel.","tags":["desnudez"]},
      {"id":"infu-e8","f":"explora","para":"uno","nivel":4,"min":45,"t":"Un minuto fuera","x":"Si estáis a solas en kilómetros, salid un minuto con el edredón por encima y nada debajo, a mirar la nieve. Después, dentro, a recuperar el calor como queráis.","suave":"Salid un minuto con el edredón por encima a mirar la nieve y volved dentro en un abrazo.","tags":["aire","desnudez","hielo"]},
      {"id":"infu-p1","f":"perdidos","temp":"seda","t":"Abrigos abiertos","x":"Abrid los abrigos y juntad los cuerpos dentro, de cara a la nieve. Tus manos, por debajo de su ropa, buscan dónde guarda {R} el calor.","tags":["aire"]},
      {"id":"infu-p2","f":"perdidos","temp":"seda","t":"Labios fríos","x":"Derrite un poco de nieve en tu boca y besa a {R} con los labios fríos. Después, con los calientes.","tags":["aire","hielo"]},
      {"id":"infu-p3","f":"perdidos","temp":"seda","t":"Contra la furgo","x":"Apoya a {R} contra la furgo, por el lado que no da a nada, y caliéntale el cuello con la boca, por dentro de la bufanda.","tags":["aire"]},
      {"id":"infu-p4","f":"perdidos","temp":"seda","t":"Dentro ya","x":"En cuanto el frío pique, dentro: quítale a {R} la ropa con nieve y envuélvele en el edredón, contigo dentro.","tags":["prenda","desnudez"]},
      {"id":"infu-p5","f":"perdidos","temp":"brasa","t":"Con la nieve cayendo","x":"Fuera y sin quitar nada: tus manos bajan por dentro de la ropa de {R} hasta donde te deje, con la nieve cayendo alrededor.","tags":["aire","intimo"]},
      {"id":"infu-p6","f":"perdidos","temp":"brasa","t":"La puerta entreabierta","x":"Con la puerta entreabierta para ver la nieve y el edredón encima, sin ropa debajo: lo que pida {R}.","tags":["aire","desnudez","intimo"]},
      {"id":"infu-p7","f":"perdidos","temp":"brasa","t":"Quitar el frío","x":"Puerta cerrada, calefacción, cristales blancos: recorre todo el cuerpo de {R} con la boca, como si quisieras quitarle el frío de cada rincón.","tags":["desnudez","intimo"]},
      {"id":"infu-p8","f":"perdidos","temp":"brasa","t":"Hasta que se derrita","x":"Sin cartas ya: lo que pida {R}, como lo pida, hasta que se derrita la escarcha de los cristales.","tags":["desnudez","intimo"]},
      {"id":"infu-c1","f":"cena","para":"ambos","t":"Cena en la cama","x":"Una sopa o un guiso caliente, con la ventana entreabierta si cocináis con gas. Cenad en la cama, con la misma manta por encima."},
      {"id":"infu-c2","f":"cena","para":"uno","t":"Vino caliente","x":"Calienta vino con canela, o un chocolate, y dale a {O} el primer trago de tu boca.","tags":["comida"]},
      {"id":"infu-c3","f":"cena","para":"ambos","t":"El cielo helado","x":"Las noches de helada tienen el cielo más limpio: salid cinco minutos con todo el abrigo a mirar las estrellas, y volved corriendo a la cama."},
      {"id":"infu-a1","f":"alcoba","temp":"seda","t":"La bolsa de agua caliente","x":"Recorre el cuerpo de {R} con una bolsa de agua caliente, despacio, por encima de la ropa primero y por debajo después.","tags":[]},
      {"id":"infu-a2","f":"alcoba","temp":"seda","t":"Sin dejar entrar el frío","x":"Mientras los cristales se cubren de escarcha, desnuda a {R} bajo el edredón sin dejar entrar ni un poco de frío.","tags":["prenda","desnudez"]},
      {"id":"infu-a3","f":"alcoba","temp":"seda","t":"La respiración","x":"A oscuras, solo la calefacción y la respiración. Durante una canción, tus manos recorren a {R} al ritmo de su respiración.","tags":[]},
      {"id":"infu-a4","f":"alcoba","temp":"brasa","t":"Ni un pie fuera","x":"Bajo el edredón y sin ropa, tu boca baja por el cuerpo de {R} sin dejar que asome ni un pie.","tags":["desnudez","intimo"]},
      {"id":"infu-a5","f":"alcoba","temp":"brasa","t":"Apagar la calefacción","x":"Apaga un rato la calefacción: que el calor lo pongan vuestros cuerpos. Lo que pida {R}, como lo pida.","tags":["desnudez","intimo"]},
      {"id":"infu-a6","f":"alcoba","temp":"brasa","t":"La noche blanca","x":"Tenéis toda la noche y la nieve no deja salir: lo que queráis, como queráis, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"infu-p9","f":"perdidos","temp":"brasa","t":"Con la calefacción puesta","tags":["aire","desnudez","intimo"],"x":"Con la calefacción de la furgo puesta y nieve fuera, quítale todo a {R} y que tu boca empiece por los pies fríos y suba sin prisa hasta que no le quede nada frío."},
      {"id":"infu-a7","f":"alcoba","temp":"brasa","t":"Un puñado de nieve","tags":["hielo","intimo"],"x":"Abre la puerta, coge un poco de nieve y pásala por el cuerpo de {R}, despacio. Después devuélvele el calor con la boca, por el mismo camino y un poco más allá."}
    ]},
    "invierno/acampada": {"titulo": "Invierno en tienda", "gancho": "Para valientes con buen saco: un camping de montaña casi vacío, escarcha o nieve alrededor de la tienda y la noche más larga del año dentro de un saco compartido.", "lugar": "Un camping de montaña abierto en invierno, con baños calientes cerca de la parcela. Solo con experiencia y material de invierno; si no, mejor la furgo o el hotel.", "consejos": ["Material de invierno de verdad: tienda de cuatro estaciones, saco para bajo cero y dos esterillas aislantes por persona. Dormir con frío no tiene nada de romántico.", "Nada de estufas ni hornillos dentro de la tienda, ni siquiera un momento. El calor, con bolsas de agua caliente, ropa seca y cuerpos."], "material": ["Tienda de cuatro estaciones", "Saco para bajo cero y dos esterillas por persona", "Bolsas de agua caliente y un termo grande", "Gorro para dormir"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido entre la nieve, a pocos minutos del camping, que es lo más lejos que conviene en invierno.", "El frío decide: nada de quitarse ropa fuera ni de mojarse. Comprobad que estáis a solas y que las huellas de vuelta se ven.", "Las cartas suben desde aquí, por dentro de los abrigos, y en cuanto el frío avise, a la tienda. Allí sigue todo."]}, "alcoba": {"parrafos": ["Fuera hiela y la tienda cruje de escarcha. Dentro, dos sacos se han convertido en uno.", "Cerrad la cremallera, poned el frontal en luz roja, comprobad que entra un poco de aire y sacad las cartas que escribisteis antes de salir. Leedlas en voz baja, dentro del saco.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, durante la noche más larga."]}}, "propuestas": [
      {"id":"inac-v1","f":"viaje","para":"copi","t":"El plan de calor","x":"Cuéntale a {O}, paso a paso, tu plan para que no pase frío esta noche. Los pasos que no sean del todo prácticos, también."},
      {"id":"inac-v2","f":"viaje","para":"copi","t":"Catorce horas","x":"Pregúntale a {O} qué haría con catorce horas de noche dentro de un saco. Si le falta imaginación, ayúdale tú."},
      {"id":"inac-v3","f":"viaje","para":"copi","t":"Con nieve, nada","x":"Si la carretera tiene nieve, nada de juegos. Si no, cuéntale a {O} cómo vas a calentarle los pies esta noche, y lo que vendrá después."},
      {"id":"inac-l1","f":"llegada","para":"ambos","nivel":1,"t":"La parcela","x":"Elegid una parcela resguardada del viento y cerca de los baños calientes. Montad la tienda antes de que caiga el sol: después, todo cuesta el doble."},
      {"id":"inac-l2","f":"llegada","para":"uno","nivel":1,"t":"Manos alrededor","x":"Mientras {O} termina de tensar la tienda, prepara algo caliente y dáselo en las manos, con las tuyas alrededor."},
      {"id":"inac-l3","f":"llegada","para":"uno","nivel":2,"t":"El nido de invierno","x":"Prepara el interior: esterillas dobles, sacos unidos y bolsas de agua caliente dentro. Cuando esté, mete a {O} con la excusa de probarlo."},
      {"id":"inac-l4","f":"llegada","para":"uno","nivel":2,"t":"El cambio de ropa","x":"Lleva a {O} a la tienda a cambiarse, que la ropa del viaje está húmeda. Tú ayudas, y tú decides cuánto tarda el cambio.","tags":["prenda"]},
      {"id":"inac-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Palabras que se ven","x":"Con el frío, el aliento se ve: dile a {O} al oído, despacio, lo que harás esta noche, y que vea salir cada palabra.","suave":"Dile a {O} al oído una cosa bonita, y que vea tu vaho.","tags":["voz"]},
      {"id":"inac-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"El sol de mediodía","x":"Buscad el sol de mediodía en un rincón resguardado del viento y tomadlo en un abrazo, con tus manos dentro del abrigo de {O}.","suave":"Buscad el sol de mediodía en un rincón sin viento y tomadlo en un abrazo."},
      {"id":"inac-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"El mismo vaso","x":"Comparte con {O} el chocolate del termo en el mismo vaso, y en cada sorbo, un beso que sepa a chocolate.","suave":"Comparte con {O} el chocolate del termo en el mismo vaso.","tags":["comida"]},
      {"id":"inac-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"Siesta en el saco","x":"A media tarde, meteos en los sacos unidos con lo mínimo puesto, solo para calentaros. Que tus manos se calienten en {O}.","suave":"A media tarde, meteos en los sacos unidos en un abrazo.","tags":["prenda"]},
      {"id":"inac-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"Pies contra la piel","x":"Dentro de la tienda, quítale a {O} las botas y los calcetines húmedos y calienta sus pies contra tu piel, por dentro de tu ropa.","suave":"Dentro de la tienda, quítale a {O} los calcetines húmedos y calienta sus pies entre tus manos."},
      {"id":"inac-e6","f":"explora","para":"uno","nivel":3,"min":45,"t":"Labios helados","x":"Derrite un copo de nieve en tu boca y besa el cuello de {O} con los labios helados; después, con los calientes, un poco más abajo.","suave":"Un beso con los labios fríos de nieve y otro con los calientes.","tags":["hielo"]},
      {"id":"inac-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Antes de que oscurezca","x":"Antes de que oscurezca, meteos en un solo saco sin nada encima. Fuera, cero grados; dentro, lo que pase.","suave":"Antes de que oscurezca, meteos en un solo saco con la ropa de dormir, en un abrazo.","tags":["desnudez","intimo"]},
      {"id":"inac-e8","f":"explora","para":"uno","nivel":4,"min":45,"t":"Un minuto de abrigos abiertos","x":"En un rincón a solas, lejos del camping, abre tu abrigo y el de {O}: un minuto de manos por dentro de la ropa, todo lo cerca que deje el frío, y corriendo a la tienda.","suave":"En un rincón a solas, un beso con los abrigos abiertos y corriendo a la tienda.","tags":["aire","intimo","hielo"]},
      {"id":"inac-p1","f":"perdidos","temp":"seda","t":"De espaldas","x":"Mete a {R} dentro de tu abrigo, de espaldas a ti, y caliéntale la nuca con la boca mientras miráis la nieve.","tags":["aire"]},
      {"id":"inac-p2","f":"perdidos","temp":"seda","t":"Vaho","x":"Besa a {R} despacio y que vuestro vaho se mezcle: un beso que dure lo que tarde en irse el frío de sus labios.","tags":["aire"]},
      {"id":"inac-p3","f":"perdidos","temp":"seda","t":"Dedo a dedo","x":"Quítale a {R} un guante y calienta su mano en tu boca, dedo a dedo. Después, la otra.","tags":["aire"]},
      {"id":"inac-p4","f":"perdidos","temp":"seda","t":"A la tienda","x":"Cuando el frío pique, a la tienda: quítale a {R} la ropa con nieve y mételo todo en tu saco, contigo dentro.","tags":["prenda","desnudez"]},
      {"id":"inac-p5","f":"perdidos","temp":"brasa","t":"Por dentro","x":"Fuera, sin quitar nada: tus manos por dentro de la ropa de {R}, hasta donde te deje, con la nieve alrededor.","tags":["aire","intimo"]},
      {"id":"inac-p6","f":"perdidos","temp":"brasa","t":"Corto y caliente","x":"Lo que pase fuera, corto y caliente: un beso sin final y tus manos por dentro de la ropa de {R}. El final, en la tienda.","tags":["aire","intimo"]},
      {"id":"inac-p7","f":"perdidos","temp":"brasa","t":"El saco","x":"En la tienda, en un solo saco y sin ropa: tu boca baja por el cuerpo de {R} mientras fuera cae la nieve.","tags":["desnudez","intimo"]},
      {"id":"inac-p8","f":"perdidos","temp":"brasa","t":"Hasta olvidar el frío","x":"Sin cartas ya: lo que pida {R}, como lo pida, hasta que el frío sea solo un recuerdo.","tags":["desnudez","intimo"]},
      {"id":"inac-c1","f":"cena","para":"ambos","t":"Cena temprana","x":"En invierno se cena pronto y caliente: algo de cuchara en el hornillo, fuera de la tienda y donde se permita. Comed en un abrazo, bajo la misma manta."},
      {"id":"inac-c2","f":"cena","para":"uno","t":"El último té","x":"Antes de entrar en la tienda, prepárale a {O} un té o un chocolate y caliéntale las manos con la taza y con las tuyas."},
      {"id":"inac-c3","f":"cena","para":"ambos","t":"Estrellas de helada","x":"Si el cielo está limpio, cinco minutos de estrellas con todo el abrigo puesto. Quien vea una fugaz elige cómo empieza la noche."},
      {"id":"inac-a1","f":"alcoba","temp":"seda","t":"Solo el gorro","x":"Desnuda a {R} dentro del saco y déjale solo el gorro. Lo demás, bajo tus manos.","tags":["prenda","desnudez"]},
      {"id":"inac-a2","f":"alcoba","temp":"seda","t":"Bolsas calientes","x":"Mueve las bolsas de agua caliente por el cuerpo de {R}, despacio, y donde se aparte una, pon tu mano.","tags":[]},
      {"id":"inac-a3","f":"alcoba","temp":"seda","t":"La nieve se traga los ruidos","x":"La nieve se traga los ruidos. Durante una canción, a oscuras, tus manos recorren a {R} dentro del saco.","tags":[]},
      {"id":"inac-a4","f":"alcoba","temp":"brasa","t":"Sin abrir la cremallera","x":"Que el saco guarde el calor de dos cuerpos sin ropa: tu boca baja por el cuerpo de {R} hasta donde te pida, sin abrir la cremallera.","tags":["desnudez","intimo"]},
      {"id":"inac-a5","f":"alcoba","temp":"brasa","t":"La escarcha cruje","x":"Cada vez que cruja la escarcha en la tela, un sitio nuevo del cuerpo de {R} para tu boca.","tags":["desnudez","intimo"]},
      {"id":"inac-a6","f":"alcoba","temp":"brasa","t":"Un saco para dos","x":"Catorce horas de noche y un saco para dos: lo que queráis, como queráis, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"inac-p9","f":"perdidos","temp":"brasa","t":"La tienda a mediodía","tags":["aire","intimo"],"x":"A mediodía, con el sol calentando la tienda, abre el saco de {R} y recorre con la boca todo lo que el frío no deja enseñar fuera, hasta donde te pida."},
      {"id":"inac-a7","f":"alcoba","temp":"brasa","t":"Que dure","tags":["desnudez","borde","intimo"],"x":"Sin ropa dentro del saco, acaricia a {R} donde más lo note y para justo antes del final, una y otra vez. La noche de invierno es larga: que dure."}
    ]}
  }
