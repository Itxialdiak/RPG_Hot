/* La puerta de enfrente dura una tarde: los textos comunes dicen «noche» y se ajustan al pintar.
   Solo frases hechas: «la mejor noche» o «el turno de noche» se quedan como están. */
const A_TARDE = [[/Buenas noches/g, 'Hasta otra tarde'], [/hasta el amanecer/g, 'hasta mañana'], [/\b(Esta|esta|La|la|Una|una|Otra|otra|buena) noche\b/g, '$1 tarde']];
function enTarde(){ return S.amb === 'cotidiana' && S.modo !== 'escapada' && !['inicio', 'elegir-modo', 'elegir-amb'].includes(S.pant); }
function aTarde(t){ return enTarde() ? A_TARDE.reduce((x, r) => x.replace(r[0], r[1]), t) : t; }
function nom(i){ return (S.p[i].nombre || '').trim() || (i === 0 ? 'Primera persona' : 'Segunda persona'); }
function quien(i){
  const pj = (S.p[i].personaje || '').trim();
  const enFinal = S.pant === 'escena' && S.modo && esc().tipo === 'final';
  return (!enFinal && pj) ? pj.split(/\s+/)[0] : nom(i);
}
function alternar(arr, id, on){ const k = arr.indexOf(id); if(on && k < 0) arr.push(id); if(!on && k >= 0) arr.splice(k, 1); }
function okVetos(c){ return !(c.tags || []).some(t => S.vetos.includes(t)); }
function textoReloj(){
  if(!S.t0) return '';
  const m = Math.floor((Date.now() - S.t0) / 60000);
  if(m < 1) return 'Acabáis de empezar esta escena.';
  return m === 1 ? 'Lleváis 1 minuto en esta escena.' : 'Lleváis ' + m + ' minutos en esta escena.';
}
function prepararPropias(){
  const sala0 = S.modo === 'escapada' ? 'alcoba' : X().escenas.find(e => e.tipo === 'mazo').id;
  S.p.forEach(P => { P.propias = [0,1,2].map(() => ({txt:'', sala:sala0, temp:'seda', tipo:'regalar'})); });
}
function fechaCorta(t){ try{ return new Date(t).toLocaleDateString('es-ES', {day:'numeric', month:'long'}); }catch(e){ return ''; } }

/* pantalla encendida mientras se juega con cartas. En la escapada, solo en Perdidos y en la
   alcoba: el resto del viaje el móvil duerme y avisa cuando llega algo. */
let despierto = false, centinela = null;
async function pedirWake(){
  const ka = plugin('KeepAwake');
  if(ka){ if(despierto) return; despierto = true; try{ await ka.keepAwake(); }catch(e){ despierto = false; } return; }
  try{ if('wakeLock' in navigator && document.visibilityState === 'visible' && !(centinela && !centinela.released)) centinela = await navigator.wakeLock.request('screen'); }catch(e){}
}
async function soltarWake(){
  const ka = plugin('KeepAwake');
  if(ka){ if(!despierto) return; despierto = false; try{ await ka.allowSleep(); }catch(e){} return; }
  try{ if(centinela && !centinela.released) await centinela.release(); }catch(e){}
  centinela = null;
}
function quiereWake(){ return S.pant === 'escena' && (S.modo !== 'escapada' || !!(S.eg && (S.eg.fase === 'perdidos' || S.eg.fase === 'alcoba'))); }
function ajustarWake(){ if(quiereWake()) pedirWake(); else soltarWake(); }
document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible'){ ajustarWake(); tickEsc(); limpiarBandeja(); } });
window.addEventListener('beforeunload', e => { if(S.pant === 'escena' && S.modo !== 'escapada'){ e.preventDefault(); e.returnValue = ''; } });
setInterval(() => {
  document.querySelectorAll('[data-reloj]').forEach(el => { el.textContent = textoReloj(); });
  document.querySelectorAll('[data-hasta]').forEach(el => { el.textContent = textoHasta(+el.dataset.hasta); });
  tickEsc();
}, 10000);

/* ---------- cartas ---------- */
function poolA(){
  const e = esc();
  const base = e.cartas.map(c => Object.assign({origen:'casa'}, c));
  S.p.forEach((P, i) => P.propias.forEach((c, k) => {
    if(c.txt.trim() && c.sala === e.id) base.push({id:'p'+i+'-'+k, t:'Escrita a mano', tags:[], x:c.txt.trim(), autor:i, origen:'propia'});
  }));
  CARTAS_PROPIAS.forEach((c, k) => {
    if(c.amb === S.amb && c.modo === S.modo && c.sala === e.id) base.push({id:'f'+k, t:c.titulo || 'Carta de la casa', n:c.nivel || 4, tags:c.etiquetas || [], x:c.texto || '', origen:'archivo'});
  });
  return base.filter(okVetos);
}
function robarA(){
  const libres = poolA().filter(c => !S.usadas[c.id]);
  if(!libres.length){ S.agotado = true; S.carta = null; return; }
  const c = azar(libres); S.usadas[c.id] = true; S.carta = c; S.revelada = false;
}
function favorito(){
  const w = [0, 1].map(i => (S.p[i].pref === 'recibir' ? 1 : 0) + (S.p[1-i].pref === 'dar' ? 1 : 0));
  return w[0] > w[1] ? 0 : (w[1] > w[0] ? 1 : -1);
}
function rec(){
  const f = favorito();
  if(f < 0) return (S.inicio + S.ciclo) % 2;
  return [f, f, 1-f][S.ciclo % 3];
}
function frenoTags(r){ return FRENOS.filter(f => f.tag && S.p[r].frenos.includes(f.id)).map(f => f.tag); }
function anteriorConMazo(){
  if(S.modo === 'escapada') return null;
  for(let k = S.esc - 1; k >= 0; k--){ const e = X().escenas[k]; if(e.tipo === 'mazo') return e; }
  return null;
}
function acelerantes(r){
  const P = S.p[r], out = [];
  P.ace.forEach(id => { const a = ACELERANTES.find(x => x.id === id); if(a) out.push({id:'a'+r+'-'+id, t:'Algo que enciende a {R}', x:a.carta, tags:a.tags || [], origen:'acelerante'}); });
  P.aceTxt.forEach((txt, k) => { if(txt.trim()) out.push({id:'at'+r+'-'+k, t:'Algo que enciende a {R}', x:'{R} lo escribió así: «' + txt.trim() + '». Haz que pase, sin prisa.', tags:[], origen:'acelerante'}); });
  const fr = frenoTags(r);
  return out.filter(c => okVetos(c) && !(c.tags || []).some(t => fr.includes(t)));
}
function poolB(e, temp, r){
  const fr = frenoTags(r);
  const base = (e.cartas || []).filter(c => c.temp === temp).map(c => Object.assign({origen:'casa'}, c));
  S.p.forEach((P, i) => P.propias.forEach((c, k) => {
    if(!c.txt.trim() || c.sala !== e.id || c.temp !== temp) return;
    const vale = c.tipo === 'recibir' ? i === r : i !== r;
    if(vale) base.push({id:'p'+i+'-'+k, t:'Escrita a mano', x:c.txt.trim(), tags:[], autor:i, kind:c.tipo, origen:'propia', temp:temp});
  }));
  CARTAS_PROPIAS.forEach((c, k) => {
    if(c.amb === S.amb && c.modo === 'encender' && c.sala === e.id && (c.temp || 'brasa') === temp) base.push({id:'f'+k, t:c.titulo || 'Carta de la casa', x:c.texto || '', tags:c.etiquetas || [], origen:'archivo', temp:temp});
  });
  return base.filter(c => okVetos(c) && !(c.tags || []).some(t => fr.includes(t)));
}
function elegirTemp(t){
  const r = rec(), g = 1 - r;
  let e = esc(), temp = t;
  if(t === 'suave'){ e = anteriorConMazo() || esc(); temp = 'seda'; }
  S.sinCartas = null;
  if(t !== 'suave'){
    // en la escapada: nada de velas fuera del hotel, y al aire libre tampoco ataduras (hay que poder vestirse en un momento)
    const fuera = S.modo !== 'escapada' ? [] : (e.id === 'perdidos' ? ['luz', 'atar'] : (S.alo !== 'hotel' ? ['luz'] : []));
    const aces = acelerantes(r).filter(c => !S.usadas[c.id] && !fuera.some(k => c.id === 'a' + r + '-' + k));
    if(aces.length && !S.ultimaAce && Math.random() < 0.3){
      const c = azar(aces); S.usadas[c.id] = true; S.ultimaAce = true;
      S.carta = Object.assign({}, c, {r:r, g:g, temp:temp, pedida:t}); S.revelada = false; return;
    }
  }
  S.ultimaAce = false;
  const pool = poolB(e, temp, r);
  let libres = pool.filter(c => !S.usadas[c.id]);
  if(!libres.length) libres = pool;
  if(!libres.length){ S.carta = null; S.sinCartas = temp; return; }
  const c = azar(libres); S.usadas[c.id] = true;
  S.carta = Object.assign({}, c, {r:r, g:g, temp:temp, pedida:t}); S.revelada = false;
}
function repartirSecreto(i){
  const sec = X().secretos, otro = S.p[1-i].secreto;
  let ks = sec.map((s, k) => k).filter(k => k !== otro && okVetos(sec[k]));
  if(!ks.length) ks = sec.map((s, k) => k).filter(k => k !== otro);
  S.p[i].secreto = azar(ks); S.p[i].cumplido = false;
}
function listaOraculo(max){
  // en la furgo o en la tienda no hay ducha ni espejo grande
  const fuera = S.modo === 'escapada' && S.alo !== 'hotel';
  let base = ORACULO.filter(d => !d.modo || d.modo === S.modo).filter(okVetos).filter(d => !(fuera && d.tags.some(t => t === 'agua' || t === 'espejo'))).map(d => d.x);
  if(max && base.length > max){
    base = base.slice();
    for(let i = base.length - 1; i > 0; i--){ const k = Math.floor(Math.random() * (i + 1)); [base[i], base[k]] = [base[k], base[i]]; }
    base = base.slice(0, max);
  }
  return base.concat(S.or.propios.map(s => s.trim()).filter(Boolean));
}
function listaFrenos(i){
  const P = S.p[i];
  const l = P.frenos.map(id => (FRENOS.find(f => f.id === id) || {}).label).filter(Boolean);
  if(P.frenosTxt.trim()) l.push(P.frenosTxt.trim());
  return l;
}

/* ---------- la escapada: fases, agenda y avisos ----------
   S.eg guarda la escapada en curso:
   fase     viaje | llegada | explora | perdidos | cena | alcoba
   agenda   lo que va a llegar: {k:'prop'|'reto', para, id, t, t1, nid}. Se planea al entrar en una
            fase, hasta su horizonte, y en Android cada entrada tiene su aviso programado (nid).
   ranuras  lo que ha llegado y está por hacer: 'copi' (lee quien no conduce), 'ambos', '0' y '1'.
   retos    el reto de cada persona al explorar: {id, t, t1, estado, visto}.
   Las propuestas se eligen al planear, pero solo cuentan como usadas cuando llegan. */
const MIN = 60e3;
function minAzar(r){ return (r[0] + Math.random() * (r[1] - r[0])) * MIN; }
function pesoAzar(a, w){ let r = Math.random() * w.reduce((x, y) => x + y, 0); for(let i = 0; i < a.length; i++){ r -= w[i]; if(r < 0) return a[i]; } return a[a.length - 1]; }
function esNoche(t){ const hr = new Date(t).getHours(); return hr >= 1 && hr < 7; }
function hora(t){ try{ return new Date(t).toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'}); }catch(e){ return ''; } }
function copiloto(){ const c = S.eg ? S.eg.conduce : S.conduce; return c >= 0 ? 1 - c : null; }
/* {O} es siempre la otra persona; en el viaje, quien conduce */
function otroDe(para){ if(para === 'copi'){ const c = S.eg.conduce; return c >= 0 ? c : 0; } return 1 - para; }
function propPorId(id){ return X().porId[id] || null; }
function reservadas(){ return new Set(S.eg.agenda.map(a => a.id)); }
function textoHasta(t1){
  const g = S.eg;
  if(g && g.pausa && g.pausa.hasta == null) return 'En pausa.';
  const m = Math.ceil((t1 - Date.now()) / MIN);
  return m <= 1 ? 'Le queda menos de un minuto.' : 'Caduca en ' + m + ' minutos.';
}
/* el tono sube con el tiempo al llegar, y al explorar con cada reto cumplido; un «no» lo baja */
function nivelObjetivo(f, para, t){
  const g = S.eg, min = Math.max(0, (t - g.t0Fase) / MIN);
  if(f === 'llegada') return min < 30 ? 1 : 2;
  if(f === 'explora') return Math.max(1, Math.min(4, g.escalon[para] + (g.rechazos[para] ? 0 : Math.floor(min / 60))));
  return 4;
}
function porNivel(l, obj){
  const ok = l.filter(p => (p.nivel || 1) <= obj);
  const minimo = Math.min.apply(null, l.map(p => p.nivel || 1));
  const base = ok.length ? ok : l.filter(p => (p.nivel || 1) === minimo);
  return pesoAzar(base, base.map(p => (p.nivel || 1) === obj ? 3 : 1));
}
function candidatas(f, para){
  const fuera = S.eg.vetadas || {};   // lo que se ha rechazado no vuelve
  const l = (X().props[f] || []).filter(p => !fuera[p.id] && (f === 'viaje' ? p.para === 'copi' : (para === 'ambos' ? p.para === 'ambos' : p.para === 'uno')));
  const fr = para === 'ambos' ? frenoTags(0).concat(frenoTags(1)) : frenoTags(otroDe(para));
  return l.filter(p => okVetos(p) && !(p.tags || []).some(tg => fr.includes(tg)));
}
function elegirProp(f, para, reserv, t){
  const l = candidatas(f, para), obj = nivelObjetivo(f, para, t);
  let libres = l.filter(p => !S.usadas[p.id] && !reserv.has(p.id));
  // si no queda nada nuevo a este nivel, mejor repetir algo suave que subir el tono
  if(!libres.some(p => (p.nivel || 1) <= obj)){
    const repes = l.filter(p => !reserv.has(p.id) && (p.nivel || 1) <= obj);
    if(repes.length) libres = repes;
  }
  if(!libres.length) libres = l.filter(p => !reserv.has(p.id));   // agotadas: se repiten
  if(!libres.length) return null;
  const p = porNivel(libres, obj);
  reserv.add(p.id);
  return p;
}
function itemAgenda(k, para, p, t, t1){ const a = {k:k, para:para, id:p.id, t:Math.round(t), nid:S.eg.nid++}; if(t1) a.t1 = Math.round(t1); return a; }
function inicioTrasPausa(t){ const p = S.eg.pausa; return p && p.hasta ? Math.max(t, p.hasta) : t; }
function cadenaRetos(i, desde, limite, reserv, forzar){
  const out = [], pausa = ESCAPADA.fases.explora.pausa;
  let t = inicioTrasPausa(desde);
  while(t < limite && out.length < 8){
    if(esNoche(t) && !(forzar && !out.length)) break;
    const p = elegirProp('explora', i, reserv, t);
    if(!p) break;
    const t1 = t + p.min * MIN;
    out.push(itemAgenda('reto', i, p, t, t1));
    t = t1 + minAzar(pausa);
  }
  return out;
}
function libres(f, para, reserv){ return candidatas(f, para).filter(p => !S.usadas[p.id] && !reserv.has(p.id)).length; }
function planificar(desde, forzar){
  const g = S.eg, f = g.fase, F = ESCAPADA.fases[f], ahora = Date.now();
  if(!F || !F.horizonte) return;
  const ini = inicioTrasPausa(desde != null ? desde : ahora + minAzar(F.primera));
  const limite = ahora + F.horizonte * MIN, reserv = reservadas(), nuevos = [];
  if(f === 'explora'){
    [0, 1].forEach(i => { nuevos.push.apply(nuevos, cadenaRetos(i, ini + (forzar ? 0 : i * minAzar([0.5, 2])), limite, reserv, forzar)); });
  } else {
    let t = ini, k = 0;
    while(t < limite && nuevos.length < 30){
      const primero = forzar && k === 0;
      if(!esNoche(t) || primero){
        const quien = (g.turno + k) % 2;
        if(f === 'viaje'){
          const para = g.conduce >= 0 ? 'copi' : quien;
          const p = elegirProp(f, para, reserv, t);
          if(p) nuevos.push(itemAgenda('prop', para, p, t));
        } else {
          // en la llegada y en la cena: o algo para compartir, o una para cada persona casi a la vez
          const nA = libres(f, 'ambos', reserv), nU = Math.min(libres(f, 0, reserv), libres(f, 1, reserv));
          const pA = nU < 1 ? 1 : Math.min(0.6, Math.max(0.2, nA / (nA + nU * 2 || 1)));
          if(nA && Math.random() < pA){
            const p = elegirProp(f, 'ambos', reserv, t);
            if(p) nuevos.push(itemAgenda('prop', 'ambos', p, t));
          } else {
            [quien, 1 - quien].forEach((i, n) => {
              const tt = t + (n && !primero ? minAzar([0.3, 2.5]) : 0);
              const p = elegirProp(f, i, reserv, tt);
              if(p) nuevos.push(itemAgenda('prop', i, p, tt));
            });
          }
        }
      }
      k++;
      t += minAzar(F.ritmo);
    }
    g.turno = (g.turno + k) % 2;
  }
  g.agenda = g.agenda.concat(nuevos).sort((a, b) => a.t - b.t);
  programarAvisos(nuevos);
}
function quitarAgenda(pred){
  const g = S.eg, fuera = g.agenda.filter(pred);
  g.agenda = g.agenda.filter(a => !pred(a));
  cancelarAvisos(fuera.map(a => a.nid));
}
function replanRetos(i, desde, forzar){
  quitarAgenda(a => a.k === 'reto' && a.para === i);
  const nuevos = cadenaRetos(i, desde, Date.now() + ESCAPADA.fases.explora.horizonte * MIN, reservadas(), forzar);
  S.eg.agenda = S.eg.agenda.concat(nuevos).sort((a, b) => a.t - b.t);
  programarAvisos(nuevos);
}
/* Lo que ya ha llegado pasa de la agenda a la pantalla. Si se han juntado varias (la app estaba
   cerrada), queda solo la última de cada persona: nada de avalanchas al abrir. */
function tickEsc(forzar){
  const g = S.eg;
  if(!(g && S.pant === 'escena' && S.modo === 'escapada')) return false;
  if(!forzar && document.visibilityState !== 'visible') return false;
  if(g.pausa && g.pausa.hasta == null) return false;
  const ahora = Date.now();
  let cambio = false, llego = false;
  if(g.pausa && g.pausa.hasta <= ahora){ g.pausa = null; cambio = true; }
  const vencidos = g.agenda.filter(a => a.t <= ahora);
  if(vencidos.length){
    g.agenda = g.agenda.filter(a => a.t > ahora);
    cancelarAvisos(vencidos.map(a => a.nid));
    const ult = {};
    vencidos.forEach(a => { ult[a.k + ':' + a.para] = a; });
    Object.keys(ult).forEach(k => {
      const a = ult[k];
      if(a.k === 'reto'){
        if(a.t1 <= ahora) return;
        g.retos[a.para] = {id:a.id, t:a.t, t1:a.t1, estado:'activo', visto:false};
      } else g.ranuras[String(a.para)] = {id:a.id, t:a.t, leida:false};
      S.usadas[a.id] = true; llego = true;
    });
    cambio = true;
  }
  g.retos.forEach(r => { if(r && (r.estado === 'activo' || r.estado === 'suave') && r.t1 <= ahora){ r.estado = 'caducado'; cambio = true; } });
  if(cambio){
    if(llego) avisarEnApp();
    render(); guardarPartida();
  }
  return cambio;
}
function cambiarFase(f){
  const g = S.eg, desdePerdidos = g.fase === 'perdidos';
  quitarAgenda(() => true);
  g.ranuras = {}; g.retos = [null, null]; g.pausa = null;
  g.fase = f; g.t0Fase = Date.now(); g.sub = '';
  g.trasPerdidos = f === 'cena' && desdePerdidos;
  S.carta = null; S.revelada = false; S.sinCartas = null; S.abierto = false; S.t0 = null;
  if(f === 'perdidos'){ S.esc = 0; g.sub = 'carta'; }
  else if(f === 'alcoba'){ S.esc = 1; g.sub = 'carta'; }
  else planificar();
  cerrarVelo(); ir('escena');
}
function empezarEscapada(){
  S.esc = 0; S.fase = 'juego'; S.abierto = false; S.t0 = null; S.usadas = {};
  S.inicio = Math.random() < .5 ? 0 : 1; S.turno = S.inicio; S.ciclo = 0;
  S.carta = null; S.revelada = false; S.sinCartas = null; S.ultimaAce = false; S.agotado = false;
  S.p.forEach(P => { P.personaje = ''; P.mascara = null; P.secreto = null; P.cumplido = false; P.fichas = 0; });
  S.or = {paso:'intro', propios:['',''], lista:[], marcas:[{},{}], i:0, coinc:[], hecho:false};
  S.finRevelado = false; S.alcobaMazo = false; S.finalSuave = false;
  const ahora = Date.now();
  S.eg = {fase:'viaje', sub:'', t0:ahora, t0Fase:ahora, conduce:S.conduce, agenda:[], ranuras:{}, retos:[null, null],
    escalon:[2, 2], rechazos:[0, 0], vetadas:{}, pausa:null, nid:1, turno:S.inicio, trasPerdidos:false};
  prepararCanal();
  cancelarAvisos();   // por si quedaba algo de otra escapada
  cambiarFase('viaje');
}
/* pausa: con tiempo, todo se retrasa ese tiempo y los avisos se reprograman; sin tiempo,
   se congela todo y, al quitarla, se retrasa lo que haya durado */
function desplazar(d){
  const g = S.eg;
  g.agenda.forEach(a => { a.t += d; if(a.t1) a.t1 += d; });
  g.retos.forEach(r => { if(r && (r.estado === 'activo' || r.estado === 'suave')) r.t1 += d; });
}
function pausar(min){
  const g = S.eg, ahora = Date.now();
  if(g.pausa) quitarPausa();
  cancelarAvisos(g.agenda.map(a => a.nid));
  if(min > 0){ desplazar(min * MIN); g.pausa = {desde:ahora, hasta:ahora + min * MIN}; programarAvisos(g.agenda); }
  else g.pausa = {desde:ahora, hasta:null};
}
function quitarPausa(){
  const g = S.eg, ahora = Date.now();
  if(!g.pausa) return;
  cancelarAvisos(g.agenda.map(a => a.nid));
  desplazar(g.pausa.hasta ? -Math.max(0, g.pausa.hasta - ahora) : ahora - g.pausa.desde);
  g.pausa = null;
  programarAvisos(g.agenda);
}

/* avisos (app de Android, plugin LocalNotifications). Nunca dicen qué es la propuesta:
   solo «Doble Llave» y para quién. Todas las llamadas van en cola, en orden. */
function LN(){ return plugin('LocalNotifications'); }
let colaAvisos = Promise.resolve();
function enCola(fn){ colaAvisos = colaAvisos.then(fn).catch(() => {}); return colaAvisos; }
function prepararCanal(){
  const ln = LN(); if(!ln || !ln.createChannel) return;
  enCola(() => ln.createChannel({id:'propuestas', name:'Propuestas de la escapada', description:'Un aviso discreto cuando llega una propuesta o un reto', importance:3, visibility:0, vibration:true}));
}
function textoAviso(a){
  if(a.k === 'reto') return 'Un reto nuevo para ' + nom(a.para);
  if(a.para === 'ambos') return 'Algo para compartir';
  const i = a.para === 'copi' ? copiloto() : a.para;
  return 'Algo para ' + nom(i == null ? 0 : i);
}
function programarAvisos(items){
  const ln = LN(), g = S.eg, ahora = Date.now();
  if(!ln || !ln.schedule || !g || (g.pausa && g.pausa.hasta == null)) return;
  const l = items.filter(a => a.t > ahora + 5000);
  if(!l.length) return;
  enCola(() => ln.schedule({notifications: l.map(a => ({id:a.nid, title:'Doble Llave', body:textoAviso(a), channelId:'propuestas',
    schedule:{at:new Date(a.t), allowWhileIdle:true}, isExactNotification:false, autoCancel:true}))}));
}
function cancelarAvisos(nids){
  const ln = LN(); if(!ln) return;
  if(nids){ if(nids.length && ln.cancel) enCola(() => ln.cancel({notifications:nids.map(id => ({id:id}))})); return; }
  enCola(() => ln.cancelAll ? ln.cancelAll() : ln.getPending().then(r => { const n = (r && r.notifications) || []; return n.length ? ln.cancel({notifications:n.map(x => ({id:x.id}))}) : null; }));
  if(ln.removeAllDeliveredNotifications) enCola(() => ln.removeAllDeliveredNotifications());
}
function sincronizarAvisos(){ if(!S.eg) return; cancelarAvisos(); programarAvisos(S.eg.agenda); }
function limpiarBandeja(){
  const ln = LN();
  if(ln && ln.removeAllDeliveredNotifications && S.modo === 'escapada' && S.pant === 'escena') enCola(() => ln.removeAllDeliveredNotifications());
}
function avisarEnApp(){
  if(document.visibilityState !== 'visible') return;
  limpiarBandeja();
  try{ if(!NATIVA && navigator.vibrate) navigator.vibrate([90, 60, 90]); }catch(e){}
}
function comprobarAvisos(pedir){
  const ln = LN(); if(!ln) return;
  const f = pedir ? ln.requestPermissions : ln.checkPermissions;
  if(!f) return;
  if(!pedir){ if(S._permAvisos !== undefined) return; S._permAvisos = null; }
  Promise.resolve(f.call(ln)).then(r => {
    const v = (r && r.display) || null;
    if(v !== S._permAvisos){ S._permAvisos = v; if(S.pant === 'llegada') render(); }
  }).catch(() => {});
}

/* ---------- la música: listas por escena y reproductor ----------
   Las escenas con mazo y las de bienvenida duran lo que su música: cuando ha sonado
   el tiempo de la escena, la música para al acabar la canción. Los finales y la escapada
   siguen sonando. La primera vez hay que pulsar «Música» (o elegirla antes de empezar). */
const CLAVE_MUSICA = 'doble-llave.musica.v1';
const MU = {hay: null, cola: [], i: 0, clave: '', listas: [], audio: null, on: false, fin: false,
  tFade: null, tReloj: null, sonado: 0, ultimo: 0};
function prefMusica(){ try{ return JSON.parse(localStorage.getItem(CLAVE_MUSICA) || '{}'); }catch(e){ return {}; } }
function guardarPrefMusica(){ try{ localStorage.setItem(CLAVE_MUSICA, JSON.stringify({on: MU.on})); }catch(e){} }
function musicaDisponible(){ return Array.isArray(MU.hay) && MU.hay.length > 0; }
function iniciarMusica(){
  if(location.protocol === 'file:' || !window.fetch){ MU.hay = []; return; }
  fetch('musica/disponibles.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : null).then(d => {
    MU.hay = d && Array.isArray(d.pistas) ? d.pistas.filter(id => MUSICA.pistas && MUSICA.pistas[id]) : [];
    if(d && d.dur) Object.keys(d.dur).forEach(id => { if(MUSICA.pistas[id]) MUSICA.pistas[id].dur = d.dur[id]; });
    MU.on = musicaDisponible() && prefMusica().on === true;
    render();
  }).catch(() => { MU.hay = []; });
}
function listasAhora(){
  if(S.pant !== 'escena' || !S.modo) return [];
  if(S.modo === 'escapada') return (S.eg && LISTAS_ESCAPADA[S.eg.fase]) || [];
  const e = esc();
  return (e && e.lista) || [];
}
function colaDe(listas){
  const ids = [];
  listas.forEach(l => ((MUSICA.listas[l] || {}).pistas || []).forEach(id => { if(MU.hay.includes(id) && !ids.includes(id)) ids.push(id); }));
  return ids;
}
/* ¿la escena se acaba con su música? */
function minutosEscena(){
  if(S.modo === 'escapada' || S.pant !== 'escena') return 0;
  const e = esc();
  return e && e.tipo !== 'final' && e.min ? e.min : 0;
}
function audioMu(){
  if(MU.audio) return MU.audio;
  const a = MU.audio = new Audio();
  a.preload = 'auto';
  a.addEventListener('ended', () => {
    const lim = minutosEscena();
    if(lim && MU.sonado >= lim * 60){ MU.fin = true; pintarMusica(); return; }
    siguientePista(false);
  });
  a.addEventListener('error', () => { if(MU.on && MU.cola.length > 1) setTimeout(() => siguientePista(false), 400); });
  a.addEventListener('timeupdate', () => {
    const t = a.currentTime;
    if(t > MU.ultimo && t - MU.ultimo < 2) MU.sonado += t - MU.ultimo;
    MU.ultimo = t;
  });
  return a;
}
function fundir(a, hasta, ms, fin){
  clearInterval(MU.tFade);
  const desde = a.volume, t0 = Date.now();
  MU.tFade = setInterval(() => {
    const k = Math.min(1, (Date.now() - t0) / ms);
    a.volume = Math.max(0, Math.min(1, desde + (hasta - desde) * k));
    if(k >= 1){ clearInterval(MU.tFade); MU.tFade = null; if(fin) fin(); }
  }, 50);
}
function ponerPista(k, suave){
  if(!MU.cola.length) return;
  const a = audioMu();
  MU.i = (k + MU.cola.length) % MU.cola.length; MU.fin = false; MU.ultimo = 0;
  const id = MU.cola[MU.i];
  const poner = () => {
    a.src = 'musica/' + id + '.ogg';
    a.volume = suave ? 0 : 1;
    const p = a.play(); if(p && p.catch) p.catch(() => { MU.on = false; pintarMusica(); });
    if(suave) fundir(a, 1, 1400);
    pintarMusica();
  };
  if(!a.paused && a.src) fundir(a, 0, 700, poner); else poner();
}
function siguientePista(suave){ if(MU.cola.length) ponerPista(MU.i + 1, suave); }
function pararMusica(){ const a = MU.audio; if(a && !a.paused) fundir(a, 0, 900, () => a.pause()); clearInterval(MU.tReloj); MU.tReloj = null; }
/* se llama en cada render: cambia de lista con fundido cuando cambia la escena */
function sincronizarMusica(){
  if(!musicaDisponible()) return;
  const ls = listasAhora(), clave = ls.join('+') + '|' + (S.modo || '') + '|' + (S.amb || '') + '|' + (S.modo === 'escapada' ? (S.eg && S.eg.fase) : S.esc);
  if(clave === MU.clave) return;
  MU.clave = clave; MU.listas = ls; MU.sonado = 0; MU.fin = false;
  MU.cola = colaDe(ls); MU.i = 0;
  if(!MU.cola.length){ pararMusica(); return; }
  if(MU.on){ ponerPista(0, true); relojMu(); }
}
function relojMu(){
  clearInterval(MU.tReloj);
  MU.tReloj = setInterval(() => { const el = document.getElementById('mu-resta'); if(el) el.textContent = textoResta(); }, 1000);
}
function textoResta(){
  const a = MU.audio, id = MU.cola[MU.i], p = id && MUSICA.pistas[id];
  if(!a || !p) return '';
  const total = isFinite(a.duration) && a.duration > 0 ? a.duration : p.dur, quedan = Math.max(0, Math.round(total - a.currentTime));
  return 'Quedan ' + Math.floor(quedan / 60) + ':' + String(quedan % 60).padStart(2, '0') + '.';
}
function alternarMusica(){
  MU.on = !MU.on; guardarPrefMusica();
  const a = audioMu();
  if(MU.on){
    if(!MU.cola.length) MU.cola = colaDe(listasAhora());
    if(!MU.cola.length){ MU.on = false; pintarMusica(); return; }
    if(a.src && a.paused && !MU.fin){ a.volume = 0; const p = a.play(); if(p && p.catch) p.catch(() => {}); fundir(a, 1, 800); }
    else ponerPista(MU.fin ? MU.i + 1 : MU.i, true);
    relojMu();
  } else pararMusica();
  pintarMusica();
}
/* «durante una canción»: empieza una nueva desde el principio y no corta la escena a medias */
function empezarCancion(){
  if(!musicaDisponible()) return;
  if(!MU.cola.length) MU.cola = colaDe(listasAhora());
  if(!MU.cola.length) return;
  if(!MU.on){ MU.on = true; guardarPrefMusica(); }
  ponerPista(MU.audio && MU.audio.src ? MU.i + 1 : MU.i, true); relojMu();
}
function vMusicaDentro(){
  const id = MU.cola[MU.i], p = id && MUSICA.pistas[id], l = MUSICA.listas[MU.listas[0]];
  let linea = '';
  if(MU.fin) linea = '<span>Se ha acabado la música de esta escena.</span>';
  else if(MU.on && p) linea = '<span>' + h(p.t) + ', de ' + h(p.a) + '</span><span id="mu-resta">' + h(textoResta()) + '</span>';
  else linea = '<span>' + (MU.cola.length ? 'Música para esta escena, lista para sonar.' : 'Sin música en esta escena.') + '</span>';
  return '<button class="mu-btn" data-a="mu-on" aria-pressed="' + (MU.on && !MU.fin) + '">' + (MU.fin ? 'Otra canción' : (MU.on ? 'Pausar' : 'Música')) + '</button>' +
    '<p class="mu-txt" aria-live="polite"><b>' + h(l ? l.n : 'Música') + '</b>' + linea + '</p>' +
    (MU.on && !MU.fin ? '<button class="mu-btn" data-a="mu-sig" aria-label="Siguiente canción">Siguiente</button>' : '');
}
function vMusica(){
  if(!musicaDisponible() || !listasAhora().length) return '';
  return '<div class="musica" id="mu" role="group" aria-label="Música">' + vMusicaDentro() + '</div>';
}
function pintarMusica(){ const el = document.getElementById('mu'); if(el) el.innerHTML = vMusicaDentro(); }
function botonCancion(texto){
  return musicaDisponible() && listasAhora().length && /canci[oó]n/i.test(texto || '') ? '<button class="btn fant cancion" data-a="mu-cancion">Empezar una canción desde el principio</button>' : '';
}
function vCreditosMusica(){
  const ids = (MU.hay || []).slice().sort((a, b) => MUSICA.pistas[a].t.localeCompare(MUSICA.pistas[b].t));
  return '<h2>Créditos de la música</h2><p class="sub">Toda la música es de Kevin MacLeod (incompetech.com), con licencia ' +
    '<a href="' + h(MUSICA.licencia.url) + '" target="_blank" rel="noopener">' + h(MUSICA.licencia.n) + '</a>. Gracias, Kevin.</p>' +
    '<ul class="creditos">' + ids.map(id => { const p = MUSICA.pistas[id]; return '<li>«' + h(p.t) + '», de ' + h(p.a) + ' (<a href="' + h(p.pagina) + '" target="_blank" rel="noopener">incompetech.com</a>).</li>'; }).join('') + '</ul>' +
    '<button class="btn prim" data-a="cerrar">Cerrar</button>';
}
function vEligeMusica(){
  if(!musicaDisponible()) return '';
  return '<h3>La música</h3><p class="sub">La app pone la de cada escena, y cuando una carta dice «durante una canción», un botón la empieza desde el principio. Se apaga o se pausa en cualquier momento.</p>' +
    '<div class="chips" role="group" aria-label="Música"><button class="chip marca" data-a="mu-pref" data-on="1" aria-pressed="' + MU.on + '">Con música</button>' +
    '<button class="chip marca" data-a="mu-pref" data-on="0" aria-pressed="' + !MU.on + '">Sin música</button></div>';
}

/* ---------- flujo ---------- */
function ir(p){
  S.pant = p; S._arriba = true; render(); ajustarWake();
  if(NATIVA) return;
  if(p === 'inicio'){ if(history.state && history.state.dl === 'guardia'){ consumiendo = true; history.back(); } }
  else armarAtras();
}
function empezar(){
  S.esc = 0; S.fase = 'carta'; S.abierto = false; S.t0 = null; S.usadas = {};
  S.inicio = Math.random() < .5 ? 0 : 1; S.turno = S.inicio; S.ciclo = 0;
  S.p.forEach(P => { P.fichas = X().fichas.inicial; P.secreto = null; P.cumplido = false; P.personaje = ''; P.mascara = null; });
  S.or = {paso:'intro', propios:['',''], lista:[], marcas:[{},{}], i:0, coinc:[], hecho:false};
  S.finRevelado = false; S.alcobaMazo = false; S.finalSuave = false; S.papel = null; S.pp = {who:0, ver:false};
  pedirWake(); ir('escena');
}
function romper(el){
  if(S._rompiendo) return;
  S._rompiendo = true;
  const quieto = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  el.classList.add('roto');
  setTimeout(() => { S._rompiendo = false; S.abierto = true; S._arriba = true; render(); }, quieto ? 0 : 430);
}
function aPapeles(e){
  if(!(e.papeles && e.papeles.length === 2)) return false;
  if(!S.papel) S.papel = Math.random() < .5 ? [0, 1] : [1, 0];
  S.fase = 'papeles'; S.pp = {who:0, ver:false}; return true;
}
function trasPapeles(){
  const e = esc();
  if(e.tipo === 'guiada'){ S.fase = 'pasos'; S.t0 = Date.now(); }
  else { S.fase = 'juego'; S.t0 = Date.now(); S.carta = null; S.agotado = false; }
}
function trasCarta(){
  const e = esc(); S.abierto = false;
  if(e.personajes){ S.fase = 'personajes'; S.pj = {who:0, ver:false}; }
  else if(e.tipo !== 'final' && aPapeles(e)){}
  else if(e.tipo === 'guiada'){ S.fase = 'pasos'; S.t0 = Date.now(); }
  else if(e.tipo === 'mazo'){ S.fase = 'juego'; S.t0 = Date.now(); S.carta = null; S.agotado = false; }
  else { S.fase = 'final'; S.t0 = null; }
  ir('escena');
}
function siguiente(){
  S.esc++; S.fase = 'carta'; S.abierto = false; S.carta = null; S.revelada = false;
  S.agotado = false; S.sinCartas = null; S.t0 = null; S.alcobaMazo = false;
  ir('escena');
}

/* ---------- acciones ---------- */
function accion(a, d, el){
  switch(a){
    case 'nueva': S.confOlvidar = false; ir('elegir-modo'); break;
    case 'seguir-partida': {
      const pa = cargarPartida(), g = cargar();
      if(!pa){ S.guardada = g; render(); return; }
      S = Object.assign(nuevo(), pa.s); S.guardada = g;
      ir(S.pant);
      if(S.modo === 'escapada' && S.eg && S.pant === 'escena'){ prepararCanal(); sincronizarAvisos(); tickEsc(true); limpiarBandeja(); }
      break;
    }
    case 'borrar-partida':
      if(!S.confBorrar){ S.confBorrar = true; render(); }
      else { borrarPartida(); S.confBorrar = false; render(); }
      break;
    case 'elegir-modo': S.modo = d.m; if(d.m === 'escapada'){ S.amb = 'escapada'; ir('elegir-est'); } else { S.amb = null; ir('elegir-amb'); } break;
    case 'elegir-amb':
      S.amb = d.amb; S.checks = {}; S.creada = Date.now(); prepararPropias(); guardar();
      ir('preparacion'); break;
    case 'reanudar': {
      const g = S.guardada; if(!g) return;
      S.modo = g.modo; S.amb = g.amb; S.est = g.est || null; S.alo = g.alo || null; S.checks = g.checks || {}; S.inv = Object.assign({de:'', para:'', cuando:'', nota:''}, g.inv || {}); S.creada = g.creada;
      prepararPropias(); ir('preparacion'); break;
    }
    case 'olvidar':
      if(!S.confOlvidar){ S.confOlvidar = true; render(); }
      else { olvidar(); S.confOlvidar = false; render(); }
      break;
    case 'volver-inicio': { const g = cargar(); S = nuevo(); S.guardada = g; cerrarVelo(); ir('inicio'); break; }
    case 'volver-modo': ir('elegir-modo'); break;
    case 'imprimir-lista': imprimir(htmlLista()); break;
    case 'imprimir-inv': imprimir('<div class="tarjeta">' + htmlInvitacion() + '</div>'); break;
    case 'compartir-inv': compartirInvitacion(); break;
    case 'preparar':
      if(!S.p[0].nombre.trim() && S.inv.de.trim()) S.p[0].nombre = S.inv.de.trim();
      if(!S.p[1].nombre.trim() && S.inv.para.trim()) S.p[1].nombre = S.inv.para.trim();
      ir('nombres'); break;
    case 'nombres-ok':
      if(!S.p[0].nombre.trim() || !S.p[1].nombre.trim()){ S.err = 'Escribid los dos nombres; pueden ser apodos.'; render(); return; }
      S.err = ''; ir('noes'); break;
    case 'veto': alternar(S.vetos, d.t, !S.vetos.includes(d.t)); render(); break;
    case 'noes-ok': S.priv = {who:0, ver:false}; ir('privado'); break;
    case 'priv-mostrar': S.priv.ver = true; ir('privado'); break;
    case 'priv-ok':
      if(S.priv.who === 0){ S.priv = {who:1, ver:false}; ir('privado'); }
      else ir(M().pideFrenos ? 'frenos' : 'llegada');
      break;
    case 'frenos-ok': ir('llegada'); break;
    case 'empezar': if(S.modo === 'escapada') empezarEscapada(); else empezar(); break;
    case 'romper': romper(el); break;
    case 'carta-ok': trasCarta(); break;
    case 'pj-mostrar': S.pj.ver = true; ir('escena'); break;
    case 'azar-nombre': S.p[+d.i].personaje = azar(A().nombres) + ' ' + azar(A().apellidos); render(); break;
    case 'robar-secreto': repartirSecreto(+d.i); render(); break;
    case 'pj-ok':
      if(S.pj.who === 0){ S.pj = {who:1, ver:false}; }
      else if(!aPapeles(esc())){ S.fase = 'pasos'; S.t0 = Date.now(); }
      ir('escena'); break;
    case 'pp-mostrar': S.pp.ver = true; ir('escena'); break;
    case 'pp-ok':
      if(S.pp.who === 0) S.pp = {who:1, ver:false};
      else trasPapeles();
      ir('escena'); break;
    case 'pp-releer': abrirVelo('<h2>¿Quién lo lee?</h2><p class="sub">Que la otra persona aparte la vista.</p>' + [0, 1].map(i => '<button class="btn" data-a="pp-ver" data-i="' + i + '">' + h(nom(i)) + '</button>').join('') + '<button class="btn fant" data-a="cerrar">Volver</button>'); break;
    case 'pp-ver': abrirVelo(vPapelPrivado(+d.i)); break;
    case 'giro': {
      const l = girosLibres(esc());
      if(l.length){ const g = azar(l); S.usadas['g:' + g.id] = true; abrirVelo(vGiro(g)); guardarPartida(); render(); }
      break;
    }
    case 'robar': robarA(); ir('escena'); break;
    case 'girar': S.revelada = true; render(); break;
    case 'hecho':
      if(turnos()) S.turno = 1 - S.turno; else S.ciclo++;
      S.carta = null; S.revelada = false; ir('escena'); break;
    case 'cambiar':
      if(turnos()) robarA(); else elegirTemp(S.carta ? (S.carta.pedida || S.carta.temp) : 'seda');
      render(); break;
    case 'temp': elegirTemp(d.t); ir('escena'); break;
    case 'encontrado': abrirVelo(vEncontrado()); break;
    case 'a-puerta': S.fase = 'puerta'; ir('escena'); break;
    case 'abrir': siguiente(); break;
    case 'cerrada': S.fase = 'cerrada'; ir('escena'); break;
    case 'seguir-sala': S.fase = esc().tipo === 'guiada' ? 'pasos' : 'juego'; ir('escena'); break;
    case 'terminar': S.finalSuave = true; borrarPartida(); cerrarVelo(); ir('fin'); break;
    case 'oraculo': if(S.modo === 'escapada') S.eg.sub = 'oraculo'; else S.fase = 'oraculo'; S.or.paso = 'intro'; ir('escena'); break;
    case 'or-movil': S.or.lista = listaOraculo(); S.or.marcas = [{}, {}]; S.or.coinc = []; S.or.paso = S.or.lista.length ? 'c0' : 'res'; ir('escena'); break;
    case 'or-cartas': S.or.lista = listaOraculo(6); S.or.i = 0; S.or.coinc = []; S.or.paso = S.or.lista.length ? 'cartas' : 'res'; ir('escena'); break;
    case 'or-mostrar': S.or.paso = S.or.paso === 'c0' ? 'm0' : 'm1'; ir('escena'); break;
    case 'or-listo':
      if(S.or.paso === 'm0') S.or.paso = 'c1';
      else { S.or.coinc = S.or.lista.filter((x, k) => S.or.marcas[0][k] && S.or.marcas[1][k]); S.or.paso = 'res'; }
      ir('escena'); break;
    case 'or-si': S.or.coinc.push(S.or.lista[S.or.i]); S.or.i++; if(S.or.i >= S.or.lista.length) S.or.paso = 'res'; ir('escena'); break;
    case 'or-calla': S.or.i++; if(S.or.i >= S.or.lista.length) S.or.paso = 'res'; ir('escena'); break;
    case 'or-fin': S.or.hecho = true; if(S.modo === 'escapada') S.eg.sub = 'hub'; else S.fase = 'juego'; ir('escena'); break;
    case 'or-salir': if(S.modo === 'escapada') S.eg.sub = 'hub'; else S.fase = 'juego'; ir('escena'); break;
    case 'final-revelar': S.finRevelado = true; render(); break;
    case 'final-cumplido': S.p[+d.i].cumplido = !S.p[+d.i].cumplido; render(); break;
    case 'alcoba-mazo': S.alcobaMazo = true; S.carta = null; S.revelada = false; S.agotado = false; ir('escena'); break;
    case 'alcoba-dejar': S.alcobaMazo = false; S.carta = null; ir('escena'); break;
    case 'fin': borrarPartida(); ir('fin'); break;
    case 'olvidar-fin': olvidar(); render(); break;
    case 'pausa': abrirVelo(vPausa()); break;
    case 'rojo':
      if(MU.on){ MU.on = false; pararMusica(); }
      if(S.modo === 'escapada' && S.eg && ESCAPADA.fases[S.eg.fase].horizonte && !(S.eg.pausa && S.eg.pausa.hasta == null)){ pausar(0); render(); }
      abrirVelo(vRojo()); break;
    case 'fichas': abrirVelo(vFichas()); break;
    case 'ficha': { const P = S.p[+d.i]; P.fichas = Math.max(0, P.fichas + (+d.d)); abrirVelo(vFichas()); break; }
    case 'secreto': abrirVelo(vQuienSecreto()); break;
    case 'secreto-de': abrirVelo(vCortinaModal(+d.i)); break;
    case 'secreto-ver': abrirVelo(vSecretoModal(+d.i)); break;
    case 'cumplido': S.p[+d.i].cumplido = !S.p[+d.i].cumplido; abrirVelo(vSecretoModal(+d.i)); break;
    case 'ayuda': S.confSalir = false; abrirVelo(vAyuda()); break;
    case 'ver-lista': abrirVelo(vListaModal()); break;
    case 'salir':
      if(!S.confSalir){ S.confSalir = true; abrirVelo(vAyuda()); }
      else { borrarPartida(); cerrarVelo(); const g = cargar(); S = nuevo(); S.guardada = g; ir('inicio'); }
      break;
    /* escapada */
    case 'elegir-est': S.est = d.est; ir('elegir-alo'); break;
    case 'elegir-alo':
      S.alo = d.alo; S.checks = {}; S.creada = Date.now(); prepararPropias(); guardar();
      ir('preparacion'); break;
    case 'volver-est': ir('elegir-est'); break;
    case 'pedir-avisos': prepararCanal(); comprobarAvisos(true); break;
    case 'conduce': {
      S.conduce = +d.i;
      const g = S.eg;
      if(g){ g.conduce = S.conduce; if(g.fase === 'viaje'){ quitarAgenda(() => true); g.ranuras = {}; planificar(); } }
      render(); break;
    }
    case 'e-fase':
      if(d.f === 'perdidos' && !perdidosOk()) return;
      cambiarFase(d.f); break;
    case 'e-fases': abrirVelo(vFasesModal()); break;
    case 'e-girar': { const it = S.eg.ranuras[d.s]; if(it) it.leida = true; render(); break; }
    case 'e-ver': abrirVelo(vCortinaProp(d.s)); break;
    case 'e-mostrar': { const it = S.eg.ranuras[d.s]; if(it) it.leida = true; abrirVelo(vPropModal(d.s)); render(); break; }
    case 'e-hecho': delete S.eg.ranuras[d.s]; cerrarVelo(); render(); break;
    case 'e-otra': {
      const g = S.eg, k = d.s, para = (k === 'copi' || k === 'ambos') ? k : +k;
      const p = elegirProp(g.fase, para, reservadas(), Date.now());
      if(p){ g.ranuras[k] = {id:p.id, t:Date.now(), leida:true}; S.usadas[p.id] = true; }
      if(!$velo.hidden) abrirVelo(vPropModal(k));
      render(); break;
    }
    case 'e-ya':
      if(S.eg.fase === 'explora') replanRetos(+d.i, Date.now(), true);
      else { quitarAgenda(() => true); planificar(Date.now(), true); }
      tickEsc(true); render(); break;
    case 'e-reto-ver': abrirVelo(vCortinaReto(+d.i)); break;
    case 'e-reto-mostrar': { const r = S.eg.retos[+d.i]; if(r) r.visto = true; abrirVelo(vRetoModal(+d.i)); render(); break; }
    case 'e-reto-suave': { const r = S.eg.retos[+d.i]; if(r && r.estado === 'activo') r.estado = 'suave'; abrirVelo(vRetoModal(+d.i)); render(); break; }
    case 'e-reto-cumplido': case 'e-reto-no': {
      const i = +d.i, g = S.eg, r = g.retos[i];
      if(r && (r.estado === 'activo' || r.estado === 'suave')){
        if(a === 'e-reto-cumplido'){ r.estado = 'cumplido'; g.escalon[i] = Math.min(4, g.escalon[i] + 1); }
        else { r.estado = 'rechazado'; g.escalon[i] = Math.max(1, g.escalon[i] - 1); g.rechazos[i]++; (g.vetadas = g.vetadas || {})[r.id] = true; }
        replanRetos(i, Date.now() + minAzar(ESCAPADA.fases.explora.pausa));
      }
      cerrarVelo(); render(); break;
    }
    case 'e-reto-cambiar': {
      const i = +d.i, r = S.eg.retos[i];
      if(r) r.estado = 'cambiado';
      replanRetos(i, Date.now(), true); tickEsc(true);
      const n = S.eg.retos[i]; if(n && n.estado === 'activo') n.visto = true;
      abrirVelo(vRetoModal(i)); render(); break;
    }
    case 'e-pausa': pausar(+d.m); cerrarVelo(); render(); break;
    case 'e-quitar-pausa': quitarPausa(); cerrarVelo(); tickEsc(true); render(); break;
    case 'e-viene': abrirVelo(vVieneAlguien()); break;
    case 'e-carta-ok': {
      const g = S.eg; S.abierto = false;
      if(g.fase === 'perdidos'){ g.sub = 'mazo'; S.t0 = Date.now(); S.carta = null; S.revelada = false; }
      else g.sub = 'hub';
      ir('escena'); break;
    }
    case 'e-mazo': S.eg.sub = 'mazo'; S.carta = null; S.revelada = false; S.sinCartas = null; if(!S.t0) S.t0 = Date.now(); ir('escena'); break;
    case 'e-fin-perdidos': cambiarFase('cena'); break;
    case 'e-dejar': S.eg.sub = 'hub'; S.carta = null; S.revelada = false; ir('escena'); break;
    /* música */
    case 'mu-on': if(MU.fin){ MU.on = true; guardarPrefMusica(); siguientePista(true); relojMu(); } else alternarMusica(); return;
    case 'mu-sig': siguientePista(true); return;
    case 'mu-cancion': empezarCancion(); return;
    case 'mu-pref': MU.on = d.on === '1'; guardarPrefMusica(); render(); return;
    case 'mu-creditos': abrirVelo(vCreditosMusica()); return;
    case 'cerrar': cerrarVelo(); break;
  }
  guardarPartida();
}

function setCampo(c, v){
  let m = c.match(/^p([01])\.(.+)$/);
  if(m){
    const P = S.p[+m[1]], k = m[2];
    let mm;
    if(k === 'nombre' || k === 'personaje' || k === 'pref' || k === 'frenosTxt'){ P[k] = v; return; }
    if(k === 'mascara'){ P.mascara = +v; return; }
    if((mm = k.match(/^ace:(.+)$/))){ alternar(P.ace, mm[1], v); return; }
    if((mm = k.match(/^frenos:(.+)$/))){ alternar(P.frenos, mm[1], v); return; }
    if((mm = k.match(/^aceTxt\.(\d)$/))){ P.aceTxt[+mm[1]] = v; return; }
    if((mm = k.match(/^prop\.(\d)\.(txt|sala|temp|tipo)$/))){ P.propias[+mm[1]][mm[2]] = v; return; }
    return;
  }
  if((m = c.match(/^check\.(\d+)$/))){ S.checks[m[1]] = v; guardar(); return; }
  if((m = c.match(/^inv\.(de|para|cuando|nota)$/))){ S.inv[m[1]] = v; guardar(); refrescarInvitacion(); return; }
  if((m = c.match(/^or\.p([01])$/))){ S.or.propios[+m[1]] = v; return; }
  if((m = c.match(/^or\.m([01])\.(\d+)$/))){ S.or.marcas[+m[1]][+m[2]] = v; return; }
}

function render(){
  document.body.classList.toggle('encender', S.modo === 'encender');
  ['explicito', 'rol'].forEach(m => document.body.classList.toggle('m-' + m, S.modo === m));
  Object.keys(AMBIENTES).forEach(k => document.body.classList.toggle('amb-' + k, S.amb === k));
  let v = '';
  switch(S.pant){
    case 'inicio': v = vInicio(); break;
    case 'elegir-modo': v = vElegirModo(); break;
    case 'elegir-amb': v = vElegirAmb(); break;
    case 'elegir-est': v = vElegirEst(); break;
    case 'elegir-alo': v = vElegirAlo(); break;
    case 'preparacion': v = vPreparacion(); break;
    case 'nombres': v = vNombres(); break;
    case 'noes': v = vNoes(); break;
    case 'privado': v = vPrivado(); break;
    case 'frenos': v = vFrenos(); break;
    case 'llegada': v = vLlegada(); break;
    case 'escena': v = vEscena() + vBarra(); break;
    case 'fin': v = vFin(); break;
  }
  $app.innerHTML = aTarde(v);
  sincronizarMusica();
  if(S._arriba){
    S._arriba = false; window.scrollTo(0, 0);
    const f = $app.querySelector('[data-foco]'); if(f) f.focus({preventScroll:true});
  }
}

function tagsUsados(){
  const u = new Set();
  try{ (X().escenas || []).forEach(e => (e.cartas || []).concat(e.giros || []).forEach(c => (c.tags || []).forEach(t => u.add(t))));
    Object.values(X().props || {}).forEach(l => l.forEach(c => (c.tags || []).forEach(t => u.add(t)))); }catch(e){}

    '<button class="btn fant" data-a="e-fase" data-f="explora">Mejor no: seguir explorando</button>');
  return vJuegoB(e, false, '<div class="salida"><button class="btn" data-a="e-viene">Viene alguien</button>' +
    '<button class="btn prim" data-a="e-fin-perdidos">Terminar el encuentro</button><p class="nota centro">Al terminar, la tarde sigue en modo cena.</p></div>');
}
function vDeseosHechos(){
  return '<h3>Lo que deseáis a la vez</h3>' + (S.or.coinc.length ? '<ul class="deseos">' + S.or.coinc.map(x => '<li>' + h(x) + '</li>').join('') + '</ul>' : '<p class="sub">Esta vez el oráculo calló, y no pasa nada.</p>');
}
function vEscAlcoba(){
  const g = S.eg, e = esc();
  if(g.sub === 'carta') return vEscSobre(e, '<button class="btn prim" data-a="e-carta-ok">Seguir</button>');
  if(g.sub === 'oraculo') return vOraculo();
  if(g.sub === 'mazo') return vJuegoB(e, true, '<button class="btn fant" data-a="e-dejar">Dejar las cartas</button>');
  return '<main class="page"><header class="cab"><p class="sala" data-foco tabindex="-1">' + h(e.nombre) + '</p><p class="ambiente">' + h(e.luz) + (musicaDisponible() ? '' : '. ' + h(e.musica)) + '.</p></header>' + vMusica() +
    '<p>Las cartas que escribisteis antes de salir: abridlas ahora y leedlas en voz alta, si no lo habéis hecho ya.</p>' +
    (S.or.hecho ? vDeseosHechos() : '<p class="sub">Si queréis, antes de las cartas: el oráculo descubre lo que deseáis a la vez sin delatar lo que solo desea una persona.</p><button class="btn" data-a="oraculo">' + h(A().oraculo.boton) + '</button>') +
    ((e.cartas || []).length ? '<button class="btn prim" data-a="e-mazo">Sacar las cartas de la alcoba</button>' : '') +
    '<p class="cierre">Solo vuestros NO siguen en pie hasta el amanecer, y la única pregunta: «¿te gusta?».</p>' +
    '<p class="nota">¿Seguís mañana? No terminéis: con «Fases», abajo, volvéis a explorar o empezáis el viaje de vuelta.</p>' +
    '<button class="btn" data-a="fin">Terminar la escapada</button></main>';
}

/* ventanas de la escapada */
function vFasesModal(){
  const g = S.eg, E = ESCAPADA, ir_a = n => ('Ir a ' + n.toLowerCase()).replace(/ a el /, ' al ');
  return '<h2>Las fases</h2><p class="sub">Marcad dónde estáis. Se puede saltar a cualquiera, también hacia atrás: para el día siguiente o para el viaje de vuelta.</p>' +
    ['viaje', 'llegada', 'explora', 'cena', 'alcoba'].map(f => '<div class="fase-op' + (f === g.fase ? ' actual' : '') + '"><p class="tit">' + h(E.fases[f].n) + (f === g.fase ? ': ahora' : '') + '</p>' +
      '<p class="sub">' + h(E.fases[f].d) + '</p>' + (f === g.fase ? '' : '<button class="btn" data-a="e-fase" data-f="' + f + '">' + h(ir_a(E.fases[f].n)) + '</button>') + '</div>').join('') +
    (g.fase === 'perdidos' ? '<p class="nota">Ahora estáis en Perdidos. Al terminar el encuentro, la tarde sigue en modo cena.</p>' : '<p class="nota">Perdidos se abre desde Explorar.</p>') +
    '<button class="btn fant" data-a="cerrar">Cerrar</button>';
}
function vPausaEsc(){
  const p = S.eg.pausa;
  if(p) return '<h2>En pausa</h2><p>' + (p.hasta ? 'Hasta las ' + h(hora(p.hasta)) + '.' : 'Hasta que la quitéis.') + ' Las propuestas esperan y los retos no corren.</p>' +
    '<button class="btn prim" data-a="e-quitar-pausa">Quitar la pausa</button><button class="btn fant" data-a="cerrar">Volver</button>';
  return '<h2>Pausa</h2><p>Las propuestas esperan, los retos dejan de correr y no llega ningún aviso. Agua, un abrazo, lo que haga falta.</p>' +
    '<button class="btn" data-a="e-pausa" data-m="30">Media hora</button><button class="btn" data-a="e-pausa" data-m="60">Una hora</button>' +
    '<button class="btn" data-a="e-pausa" data-m="0">Hasta que la quitemos</button><button class="btn fant" data-a="cerrar">Volver</button>';
}
function vVieneAlguien(){
  return '<h2>Viene alguien</h2><p>Ropa y a otra cosa, sin dramas: un paseo, el paisaje, algo de comer. Nadie tiene que enterarse de nada.</p>' +
    '<p class="sub">Cuando se vaya, decidid con calma si seguís aquí, buscáis otro rincón o lo dejáis para la alcoba.</p>' +
    '<button class="btn prim" data-a="cerrar">Ya se ha ido</button>' +
    '<button class="btn" data-a="e-fase" data-f="explora">Seguir explorando</button>' +
    '<button class="btn fant" data-a="e-fase" data-f="cena">Dejarlo para luego: modo cena</button>';
}
function vCortinaProp(k){
  const i = +k;
  return '<h2>Ahora solo mira ' + h(nom(i)) + '</h2><p class="sub">' + h(nom(1 - i)) + ', aparta la vista un momento.</p>' +
    '<button class="btn prim" data-a="e-mostrar" data-s="' + k + '">Soy ' + h(nom(i)) + ': mostrar</button><button class="btn fant" data-a="cerrar">Cancelar</button>';
}
function vPropModal(k){
  const it = S.eg.ranuras[k];
  if(!it) return '<h2>Ya no está</h2><p class="sub">Esta propuesta se ha cerrado.</p><button class="btn prim" data-a="cerrar">Cerrar</button>';
  return vPropCara(k, it) + '<div class="fila"><button class="btn" data-a="e-otra" data-s="' + k + '">Otra</button><button class="btn prim" data-a="e-hecho" data-s="' + k + '">Hecho</button></div>' +
    '<button class="btn fant" data-a="cerrar">Ocultar</button>';
}
function vCortinaReto(i){
  return '<h2>Ahora solo mira ' + h(nom(i)) + '</h2><p class="sub">' + h(nom(1 - i)) + ', aparta la vista un momento.</p>' +
    '<button class="btn prim" data-a="e-reto-mostrar" data-i="' + i + '">Soy ' + h(nom(i)) + ': mostrar</button><button class="btn fant" data-a="cerrar">Cancelar</button>';
}
function vRetoModal(i){
  const r = S.eg.retos[i];
  if(!r || !(r.estado === 'activo' || r.estado === 'suave')) return '<h2>Este reto ya no está</h2><p class="sub">Ha caducado o se ha cerrado. El siguiente llegará solo.</p><button class="btn prim" data-a="cerrar">Cerrar</button>';
  const p = propPorId(r.id), o = nom(1 - i), sx = s => h(String(s).replace(/\{O\}/g, o)), suave = r.estado === 'suave';
  return '<article class="carta"><p class="para">' + h('Reto de ' + nom(i) + (suave ? ', en su versión suave' : '')) + '</p><h3>' + sx(p.t) + '</h3>' +
    '<p class="texto">' + sx(suave ? p.suave : p.x) + '</p><p class="tags"><span data-hasta="' + r.t1 + '">' + h(textoHasta(r.t1)) + '</span></p></article>' +
    '<button class="btn prim" data-a="e-reto-cumplido" data-i="' + i + '">Cumplido</button>' +
    (suave ? '' : '<button class="btn" data-a="e-reto-suave" data-i="' + i + '">' + h(o) + ' me ha pedido algo más suave</button>') +
    '<button class="btn" data-a="e-reto-no" data-i="' + i + '">' + h(o) + ' me ha dicho que no</button>' +
    '<button class="btn fant" data-a="e-reto-cambiar" data-i="' + i + '">Cambiar este reto</button>' +
    '<p class="nota">Si ' + h(o) + ' te pide algo más suave o te dice que no, se acepta sin insistir: márcalo aquí y llegará otro.</p>' +
    '<button class="btn fant" data-a="cerrar">Ocultar</button>';
}

/* ventanas */
function abrirVelo(html){
  $velo.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + aTarde(html) + '</div>';
  $velo.hidden = false;
  const f = $velo.querySelector('button, input, textarea'); if(f) f.focus();
}
function cerrarVelo(){ $velo.hidden = true; $velo.innerHTML = ''; }
function vPausa(){ if(S.modo === 'escapada' && S.eg && ESCAPADA.fases[S.eg.fase].horizonte) return vPausaEsc(); return '<h2>Pausa</h2><p>Agua, un abrazo, respirad. La partida espera y nadie pierde nada.</p>' + (MU.on ? '<button class="btn" data-a="mu-on">Pausar la música</button>' : '') + '<button class="btn prim" data-a="cerrar">Volver</button>'; }
function vRojo(){
  const viaje = S.modo === 'escapada';
  return '<h2>Rojo</h2><p>' + (viaje ? 'Paramos, sin preguntas incómodas.' + (S.eg && S.eg.pausa ? ' Las propuestas quedan en pausa hasta que la quitéis.' : '') : 'Paramos. Fuera de personaje y sin preguntas incómodas.') + '</p><p class="sub">¿Qué hace falta ahora: hablar, un abrazo o dejarlo aquí? Las tres respuestas están bien.</p>' +
    '<button class="btn" data-a="cerrar">Retomar cuando queráis</button><button class="btn prim" data-a="terminar">' + (viaje ? 'Terminar la escapada' : 'Terminar la noche') + '</button>';
}
function vFichas(){
  const F = X().fichas;
  return '<h2>' + h(F.nombre) + '</h2><p class="sub">' + h(F.explica) + '</p>' +
    [0,1].map(i => '<div class="ficha-fila"><span>' + h(nom(i)) + '</span><button class="mini" data-a="ficha" data-i="' + i + '" data-d="-1" aria-label="Quitar ' + h(F.una) + ' a ' + h(nom(i)) + '">−</button><b>' + S.p[i].fichas + '</b><button class="mini" data-a="ficha" data-i="' + i + '" data-d="1" aria-label="Añadir ' + h(F.una) + ' a ' + h(nom(i)) + '">+</button></div>').join('') +
    '<button class="btn" data-a="cerrar">Cerrar</button>';
}
function vQuienSecreto(){
  if(S.p[0].secreto == null && S.p[1].secreto == null) return '<h2>Secretos</h2><p class="sub">Todavía no hay Secretos: se reparten al elegir ' + masc().las + '.</p><button class="btn" data-a="cerrar">Cerrar</button>';
  return '<h2>¿De quién es el Secreto?</h2><p class="sub">Solo puede mirarlo quien lo tiene.</p>' +
    [0,1].map(i => S.p[i].secreto != null ? '<button class="btn" data-a="secreto-de" data-i="' + i + '">' + h(nom(i)) + '</button>' : '').join('') +
    '<button class="btn fant" data-a="cerrar">Cerrar</button>';
}
function vCortinaModal(i){
  return '<h2>Ahora solo mira ' + h(nom(i)) + '</h2><p class="sub">' + h(nom(1-i)) + ', aparta la vista un momento.</p>' +
    '<button class="btn prim" data-a="secreto-ver" data-i="' + i + '">Soy ' + h(nom(i)) + ': mostrar</button><button class="btn fant" data-a="cerrar">Cancelar</button>';
}
function vSecretoModal(i){
  const P = S.p[i];
  return vSecretoBloque(i) + '<button class="chip marca" style="margin-top:.8rem" aria-pressed="' + P.cumplido + '" data-a="cumplido" data-i="' + i + '">' + (P.cumplido ? 'Cumplido' : 'Marcar como cumplido') + '</button>' +
    '<button class="btn prim" data-a="cerrar">Ocultar</button>';
}
function vAyuda(){
  const m = M();
  return '<h2>Ayuda</h2><h3>Las señales</h3><dl class="senales">' + senales().map(s => '<dt>' + h(s[0]) + '</dt><dd>' + h(s[1]) + '</dd>').join('') + '</dl>' +
    '<h3>Cómo se juega</h3><ul class="reglas">' + m.reglas.map(r => '<li>' + h(r) + '</li>').join('') + '</ul>' +
    (S.modo === 'escapada' ? '<h3>Seguridad</h3><dl class="senales">' + ESCAPADA.seguridad.map(s => '<dt>' + h(s[0]) + '</dt><dd>' + h(s[1]) + '</dd>').join('') + '</dl>' : '') +
    (musicaDisponible() ? '<button class="btn fant" data-a="mu-creditos">Créditos de la música</button>' : '') +
    '<button class="btn" data-a="cerrar">Volver al juego</button>' +
    '<button class="btn fant" data-a="salir">' + (S.confSalir ? 'Sí, salir de la partida' : 'Salir al inicio') + '</button>' +
    (S.confSalir ? '<p class="nota">La partida se borra; la noche preparada sigue guardada.</p>' : '');
}
function vListaModal(){
  return '<h2>Lo que hace falta</h2>' + X().material.map((t, k) => vCheck('check.' + k, t, !!S.checks[k])).join('') + '<button class="btn prim" data-a="cerrar">Cerrar</button>';
}
function vEncontrado(){
  return '<div class="pergamino">' + A().encontrado.parrafos.map(p => '<p>' + h(p) + '</p>').join('') + '</div><button class="btn prim" data-a="cerrar">Cerrar</button>';
}

/* eventos */
$app.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if(!b || b.disabled) return; accion(b.dataset.a, b.dataset, b); });
$velo.addEventListener('click', e => { if(e.target === $velo){ cerrarVelo(); return; } const b = e.target.closest('[data-a]'); if(!b) return; accion(b.dataset.a, b.dataset, b); });
function campo(e){
  const t = e.target;
  if(!t.dataset || !t.dataset.campo) return;
  if(t.type === 'radio' && !t.checked) return;
  setCampo(t.dataset.campo, t.type === 'checkbox' ? t.checked : t.value);
  guardarPartida();
}
document.addEventListener('input', campo);
document.addEventListener('change', campo);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !$velo.hidden) cerrarVelo(); });

/* Atrás: durante la partida abre la Pausa; antes, vuelve a la pantalla anterior; en el inicio, sale. */
const PREVIA = {'elegir-modo':'inicio', 'elegir-amb':'elegir-modo', 'elegir-est':'elegir-modo', 'elegir-alo':'elegir-est', 'preparacion':'inicio', 'nombres':'preparacion', 'noes':'nombres', 'privado':'noes', 'frenos':'noes', 'llegada':'noes', 'fin':'inicio'};
let consumiendo = false;
function atras(){
  if(!$velo.hidden){ cerrarVelo(); return true; }
  if(S.pant === 'escena'){ abrirVelo(vPausa()); return true; }
  const prev = PREVIA[S.pant];
  if(!prev) return false;
  if(prev === 'inicio') accion('volver-inicio'); else ir(prev);
  return true;
}
function armarAtras(){ try{ if(!(history.state && history.state.dl === 'guardia')) history.pushState({dl:'guardia'}, ''); }catch(e){} }
if(NATIVA){
  const app = plugin('App');
  if(app && app.addListener) app.addListener('backButton', () => { if(!atras() && app.exitApp) app.exitApp(); });
  // tocar un aviso abre la app: si la escapada estaba cerrada, se retoma en su fase
  const ln = LN();
  if(ln && ln.addListener) ln.addListener('localNotificationActionPerformed', () => {
    if(S.pant === 'escena'){ tickEsc(true); limpiarBandeja(); return; }
    const pa = cargarPartida();
    if(pa && pa.s.modo === 'escapada' && pa.s.pant === 'escena') accion('seguir-partida');
  });
} else {
  window.addEventListener('popstate', () => {
    if(consumiendo){ consumiendo = false; return; }
    if(atras() && S.pant !== 'inicio') armarAtras();
  });
}

iniciarMusica();
/* Con una escapada en marcha, la app abre directamente en su fase (es lo que se espera al tocar un aviso). */
(function(){
  const pa = cargarPartida();
  if(pa && pa.s.modo === 'escapada' && pa.s.pant === 'escena') accion('seguir-partida');
  else render();
})();
</script>
