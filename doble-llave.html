  "alojamientos": {"hotel": {"n": "Hotel u hostal", "d": "Un pueblo pequeño y con algo especial: piedra, un río, un castillo o un mirador, con monte a un paseo. Una buena cama y, si puede ser, bañera.", "consejos": ["Pedid una habitación tranquila, lejos del ascensor y de la calle.", "Las paredes oyen: la música baja también sirve para eso.", "En el pueblo, el juego es discreto: miradas, susurros, una mano en el bolsillo. Lo demás, en la habitación o en el monte, a solas."], "material": ["La reserva hecha", "Sales o aceite para la bañera", "Un altavoz pequeño"]}, "furgo": {"n": "Furgoneta camperizada", "d": "Una casa pequeña con cama, aparcada donde se acaba el asfalto: un valle, un pantano, un hayedo.", "consejos": ["Dormid dentro y con todo recogido, en un sitio donde se pueda aparcar. En espacios protegidos y en algunos municipios está prohibido pernoctar: miradlo antes.", "Cortinas o parasoles opacos en todas las ventanas: dan intimidad y guardan el calor.", "Ventilad: con dos personas dentro, los cristales se empañan enseguida."], "material": ["Cortinas o parasoles opacos", "Mantas o edredón", "Luz cálida a pilas", "Garrafa de agua"]}, "acampada": {"n": "Acampada", "d": "Tienda de campaña o, con buen tiempo, dormir al raso. Lo más cerca del suelo, del cielo y de los ruidos de la noche.", "consejos": ["Camping tranquilo, área de acampada o terreno con permiso del propietario: la acampada libre está prohibida o muy regulada casi en toda España.", "Montad la tienda con luz y lejos de otras: la tela no aísla los sonidos.", "Al raso, solo con buen tiempo, saco y esterilla de verdad."], "material": ["Tienda, saco y esterilla", "Frontal", "Hornillo, solo para usar fuera y donde se permita"]}},
  "propuestas": [
    {"id":"c-v1","f":"viaje","para":"copi","t":"La banda sonora","x":"Elige una canción que te recuerde a {O} y ponla sin decir por qué. Cuando acabe, cuéntaselo."},
    {"id":"c-v2","f":"viaje","para":"copi","t":"Lo primero","x":"Pregúntale a {O} qué es lo primero que quiere hacer cuando lleguéis. No vale «descansar», y tampoco vale responder rápido."},
    {"id":"c-v3","f":"viaje","para":"copi","t":"La primera noche","x":"Cuéntale a {O}, con detalle y sin prisa, cómo te imaginas la primera noche de esta escapada. Quedan kilómetros."},
    {"id":"c-v4","f":"viaje","para":"copi","t":"La parada","x":"En la próxima parada, antes de volver a arrancar, un beso largo con el motor apagado. Hasta entonces, que {O} lo vaya esperando."},
    {"id":"c-v5","f":"viaje","para":"copi","t":"Tres viajes","x":"Recordad en voz alta tres viajes que hayáis hecho y el mejor beso de cada uno. Empieza tú."},
    {"id":"c-v6","f":"viaje","para":"copi","t":"Lo que llevo puesto","x":"Que {O} adivine qué ropa interior llevas hoy, con tres preguntas de sí o no. Si acierta, se lo enseñarás al llegar."},
    {"id":"c-v7","f":"viaje","para":"copi","t":"La contraseña","x":"Busca en el mapa un pueblo o un paraje con nombre de promesa o de pecado. Será vuestra contraseña: quien la diga durante la escapada pide un beso, donde sea."},
    {"id":"c-v8","f":"viaje","para":"copi","t":"Algo nunca hecho","x":"Confiesa algo que nunca has hecho en un viaje y te gustaría hacer en este. Después, pregúntale a {O} lo mismo.","tags":["confesion"]},
    {"id":"c-v9","f":"viaje","para":"copi","t":"Una canción en silencio","x":"Durante la próxima canción no habla nadie: solo la música y lo que cada cual esté imaginando. Al acabar, una palabra cada cual para resumirlo."},
    {"id":"c-v10","f":"viaje","para":"copi","t":"La frase a medias","x":"Dile a {O}: «Esta noche, cuando…», y deja la frase a medias. No la termines hasta la alcoba, pase lo que pase."},
    {"id":"c-l1","f":"llegada","para":"ambos","t":"Tres sitios","x":"Antes de deshacer nada, dad una vuelta y buscad tres sitios donde os daríais un beso, de menos a más escondidos. Estrenad el primero; el tercero, guardadlo para luego.","nivel":1},
    {"id":"c-l2","f":"llegada","para":"uno","t":"La cama","x":"Prueba la cama antes que nadie y, desde ahí, dile a {O} en voz baja qué falta para que sea perfecta. Si lo que falta es {O}, díselo también.","nivel":1},
    {"id":"c-l3","f":"llegada","para":"uno","t":"Marcar el sitio","x":"Dale a {O} el primer beso de este sitio, de los que marcan territorio: largo, sin avisar y con las manos ocupadas.","nivel":2},
    {"id":"c-l4","f":"llegada","para":"uno","t":"La nota","x":"Mientras deshacéis el equipaje, esconde entre las cosas de {O} una nota con algo que quieres que pase esta noche. Que la encuentre sin buscarla.","nivel":2},
    {"id":"c-l5","f":"llegada","para":"ambos","t":"El inventario","x":"Repasad lo que habéis traído para jugar: la manta, la cinta, el aceite, lo que sea. Decidid dónde se queda a mano y no habléis más del tema.","nivel":1},
    {"id":"c-l6","f":"llegada","para":"uno","t":"La mejor vista","x":"Busca la mejor vista del sitio y lleva a {O} de la mano sin decir adónde. Allí, ponte detrás y que tus manos se cuelen bajo su ropa mientras mira.","nivel":2},
    {"id":"c-e1","f":"explora","para":"uno","nivel":2,"min":35,"t":"El beso robado","x":"Antes de que caduque este reto, roba a {O} un beso largo donde nadie os vea: detrás de un árbol, en un recodo, en un portal. Sin avisar.","suave":"Antes de que caduque este reto, dale a {O} un beso en el cuello cuando menos se lo espere."},
    {"id":"c-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"El susurro","x":"En un momento a solas, dile al oído a {O} qué parte de su cuerpo te gustaría estar besando ahora mismo. Después, seguid como si nada.","suave":"Dile al oído a {O} una cosa que te guste de cómo está hoy.","tags":["voz"]},
    {"id":"c-e3","f":"explora","para":"uno","nivel":3,"min":40,"t":"La mano escondida","x":"En un tramo sin nadie, mete la mano bajo la ropa de {O}, en la espalda o en la cintura, y déjala ahí hasta que vuelva a aparecer alguien.","suave":"Rodea la cintura de {O} por debajo de la chaqueta y no la sueltes en un buen rato."},
    {"id":"c-e4","f":"explora","para":"uno","nivel":3,"min":45,"t":"Algo menos","x":"Consigue que {O} se quite, a solas y sin que nadie lo vea, una prenda que lleve debajo, la que elija, y que te la dé para guardarla hasta la noche.","suave":"Consigue que {O} te preste algo que lleve puesto: un pañuelo, una pulsera, la chaqueta. Te lo quedas hasta la noche.","tags":["prenda"]},
    {"id":"c-e5","f":"explora","para":"uno","nivel":3,"min":45,"t":"El mirador","x":"Encuentra un sitio con vistas donde nadie pueda llegar sin que lo oigáis. Ponte detrás de {O} y que tus manos se paseen bajo su ropa mientras mira el paisaje.","suave":"Encuentra un sitio con vistas y abraza a {O} por detrás, sin prisa, mientras mira el paisaje.","tags":["aire"]},
    {"id":"c-e6","f":"explora","para":"uno","nivel":4,"min":50,"t":"Piel al aire","x":"En un rincón donde estéis a solas de verdad, convence a {O} de quedarse con la piel al aire, del todo o casi, aunque sea un minuto. Tú decides cómo celebrarlo.","suave":"En un rincón a solas, convence a {O} de quitarse la prenda de arriba un minuto y abrázale piel con piel.","tags":["aire","desnudez","prenda"],"noest":["invierno"]},
    {"id":"c-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Hasta donde os lleve","x":"En un sitio a solas y resguardado, empieza a besar a {O} y no pares hasta que te pida otra cosa… o más. Lo que venga después, lo decidís allí.","suave":"En un sitio a solas, un beso largo, de los que se olvidan del reloj. Nada más, y nada menos.","tags":["aire","intimo"]},
    {"id":"c-e8","f":"explora","para":"uno","nivel":1,"min":30,"t":"La foto que no se hace","x":"Sin cámara: elige un sitio precioso, coloca a {O} donde quieras y descríbele en voz baja la foto que le harías y que nadie más vería nunca.","suave":"Elige un sitio precioso y dile a {O} qué foto le harías aquí, sin hacerla.","tags":["voz"]},
    {"id":"c-c1","f":"cena","para":"ambos","t":"El brindis","x":"Brindad por lo mejor que ha pasado hoy, sin decir qué es: que la otra persona lo adivine. Si acierta, se repite antes de dormir."},
    {"id":"c-c2","f":"cena","para":"uno","t":"Por debajo","x":"Durante la cena, tu pie o tu mano buscan a {O} por debajo de la mesa o de la manta. Discreción absoluta: que no lo note nadie más."},
    {"id":"c-c3","f":"cena","para":"uno","t":"El bocado","x":"Dale a probar a {O} algo de tu plato, de tu tenedor o de tus dedos, mirándole a los ojos. Si sus labios se entretienen, no los apartes.","tags":["comida"]},
    {"id":"c-c4","f":"cena","para":"ambos","t":"Tres cosas","x":"Cada cual dice tres cosas que le han gustado hoy de la otra persona: una que se vea, una que se oiga y una que se sienta."},
    {"id":"c-c5","f":"cena","para":"uno","t":"El postre","x":"Antes del postre, susúrrale a {O} lo que vas a querer de postre de verdad. Después, pedid algo dulce como si no hubieras dicho nada.","tags":["voz"]},
    {"id":"c-c6","f":"cena","para":"ambos","t":"El cielo","x":"Después de cenar, diez minutos mirando el cielo, en un abrazo y sin móvil. Quien vea primero una estrella pide un deseo al oído."},
    {"id":"c-p1","f":"perdidos","temp":"seda","t":"La manta","x":"Extiende la manta en el sitio más escondido que encontréis y túmbate con {R}. Quítale la prenda de arriba despacio y besa la piel que el aire acaba de descubrir.","tags":["aire","prenda"],"noest":["invierno"]},
    {"id":"c-p2","f":"perdidos","temp":"seda","t":"El oído atento","x":"Tus manos recorren a {R} por debajo de la ropa mientras escucháis el sitio: cualquier paso, cualquier voz, y paráis. Que la tensión también juegue.","tags":["aire"]},
    {"id":"c-p3","f":"perdidos","temp":"brasa","t":"A cielo abierto","x":"Si {R} quiere, quítale toda la ropa sobre la manta. Recorre su cuerpo con la boca, de la cabeza a los pies, y vuelve a subir más despacio todavía.","tags":["aire","desnudez","intimo"],"noest":["invierno"]},
    {"id":"c-p4","f":"perdidos","temp":"brasa","t":"Lo que pida el sitio","x":"Dejad que el sitio decida: un tronco donde apoyarse, una roca tibia, la hierba sobre la manta. Lo que venga después, sin cartas y al ritmo de {R}.","tags":["aire","desnudez","intimo"],"noest":["invierno"]},
    {"id":"c-a1","f":"alcoba","temp":"seda","t":"El mejor momento","x":"Desnuda a {R} prenda a prenda mientras le cuentas en voz baja el mejor momento del día. Cada prenda, un detalle más.","tags":["prenda","desnudez","voz"]},
    {"id":"c-a2","f":"alcoba","temp":"seda","t":"El mapa del día","x":"Vuelve, uno a uno, a los sitios del cuerpo de {R} que hoy han recibido más besos, y quédate en cada uno el doble de tiempo.","tags":[]},
    {"id":"c-a3","f":"alcoba","temp":"brasa","t":"Lo que quedó a medias","x":"Pregúntale a {R} qué propuesta de hoy le habría gustado terminar. Terminadla ahora, en privado y a su ritmo.","tags":[]},
    {"id":"c-a4","f":"alcoba","temp":"brasa","t":"Sin reloj","x":"Sin ropa y sin reloj: recorre a {R} con la boca y las manos hasta que te pida que pares… o que no pares.","tags":["desnudez","intimo"]},
    {"id":"pr-v1","est":"primavera","f":"viaje","para":"copi","t":"La ventanilla","x":"Baja la ventanilla un momento y describe a {O} a qué huele el campo hoy. Después, dile a qué te gustaría que oliera su piel esta noche."},
    {"id":"pr-v2","est":"primavera","f":"viaje","para":"copi","t":"Árboles en flor","x":"A partir de ahora, cada árbol en flor que veáis vale un beso en la próxima parada. Tú llevas la cuenta, y no perdonas ninguno."},
    {"id":"pr-e1","est":"primavera","f":"explora","para":"uno","nivel":2,"min":35,"t":"La brizna","x":"En un rincón tranquilo, recorre el cuello y la nuca de {O} con una brizna de hierba o una flor caída, cada vez más despacio, hasta que se le escape algo.","suave":"Pon una flor caída en el pelo o en la ropa de {O}, y que la lleve hasta la noche.","tags":["pluma"]},
    {"id":"pr-e2","est":"primavera","f":"explora","para":"uno","nivel":3,"min":40,"t":"El chaparrón","x":"Si os pilla la lluvia, no corráis: bésale a {O} bajo el agua hasta que la ropa se pegue, y después secaos a solas, quitando lo mojado.","suave":"Con el primer chaparrón, un beso largo antes de correr a cubriros."},
    {"id":"pr-e3","est":"primavera","f":"explora","para":"uno","nivel":4,"min":50,"t":"El prado escondido","x":"Busca un prado lejos del camino. Sobre la manta, nunca en la hierba alta, desnuda a {O} hasta donde el sol y la soledad permitan. Después, revisión de garrapatas, centímetro a centímetro.","suave":"Sobre la manta, en un prado escondido, cuela las manos bajo la ropa de {O} y déjalas ahí, al sol.","tags":["aire","desnudez"]},
    {"id":"pr-c1","est":"primavera","f":"cena","para":"ambos","t":"La revisión","x":"Antes de cenar, en privado y con buena luz, revisión de garrapatas: os desvestís frente a frente y os buscáis por todo el cuerpo, sin prisa. Por salud, claro.","tags":["desnudez"]},
    {"id":"pr-c2","est":"primavera","f":"cena","para":"ambos","t":"El día largo","x":"Cenad mirando hacia donde se pone el sol. Cuando desaparezca, cada cual dice una cosa que quiere que pase antes de dormir."},
    {"id":"ve-v1","est":"verano","f":"viaje","para":"copi","t":"La sal","x":"Cuéntale a {O} a qué te sabe su piel en verano, y en qué sitio del cuerpo te gusta más ese sabor."},
    {"id":"ve-v2","est":"verano","f":"viaje","para":"copi","t":"La lista del agua","x":"Escribe en el móvil la lista de lo que haréis en el agua cuando lleguéis. {O} puede dictarte cosas nuevas, pero no puede tachar ninguna."},
    {"id":"ve-e1","est":"verano","f":"explora","para":"uno","nivel":3,"min":45,"t":"La poza","x":"Encuentra una poza o un recodo del río sin nadie. Métete en el agua con {O} con lo mínimo puesto… o sin nada, si estáis a solas de verdad.","suave":"Mojaos los pies en el río y salpica a {O} hasta que te bese para que pares.","tags":["aire","agua","desnudez"]},
    {"id":"ve-e2","est":"verano","f":"explora","para":"uno","nivel":2,"min":40,"t":"La siesta","x":"En la hora de más calor, busca una sombra escondida y echaos la siesta en un abrazo. Tu mano, debajo de su camiseta, no duerme.","suave":"En la hora de más calor, una siesta a la sombra, en un abrazo, sin hacer nada más.","tags":["aire"]},
    {"id":"ve-e3","est":"verano","f":"explora","para":"uno","nivel":4,"min":45,"t":"Las gotas","x":"Después de un baño, en un sitio a solas, recoge con los labios las gotas de la piel de {O}, una a una, sigan el camino que sigan.","suave":"Después de un baño, recoge con los labios las gotas del cuello y los hombros de {O}.","tags":["aire","intimo"]},
    {"id":"ve-c1","est":"verano","f":"cena","para":"ambos","t":"Estrellas fugaces","x":"Cenad fuera con la luz más baja posible. Cuando sea de noche, buscad estrellas fugaces: cada una que veáis, un deseo dicho al oído."},
    {"id":"ve-c2","est":"verano","f":"cena","para":"uno","t":"El hielo de la copa","x":"Coge un hielo de tu copa y pásalo por la nuca de {O} cuando menos se lo espere. Después, devuélvele el calor con la boca.","tags":["hielo"]},
    {"id":"ot-v1","est":"otono","f":"viaje","para":"copi","t":"Los árboles rojos","x":"Cada árbol rojo que veáis, {O} te debe una respuesta sincera. Tú eliges las preguntas, y que suban de tono con los kilómetros.","tags":["confesion"]},
    {"id":"ot-v2","est":"otono","f":"viaje","para":"copi","t":"La berrea","x":"Cuéntale a {O} lo que sabes de la berrea, o invéntalo: los ciervos se pasan días llamando a quien desean. ¿Cómo llamarías tú a {O}? Haz una demostración."},
    {"id":"ot-e1","est":"otono","f":"explora","para":"uno","nivel":2,"min":35,"t":"Hojarasca","x":"En el bosque, junta un montón de hojas secas, tumba a {O} encima sobre la manta y bésale hasta que crujan.","suave":"Echa a {O} un puñado de hojas por encima y quítaselas después, una a una, del pelo y del cuello.","tags":["aire"]},
    {"id":"ot-e2","est":"otono","f":"explora","para":"uno","nivel":3,"min":40,"t":"Manos calientes","x":"Calienta las manos en el termo o en tu propio cuerpo y mételas bajo la ropa de {O}, por donde quieras, hasta que se le olvide el frío.","suave":"Calienta las manos de {O} entre las tuyas y dentro de tu abrigo, sin prisa."},
    {"id":"ot-e3","est":"otono","f":"explora","para":"uno","nivel":4,"min":45,"t":"El tronco","x":"En un bosque a solas, apoya a {O} contra un tronco ancho y desabróchale lo justo para que tus besos lleguen donde quieras. El bosque avisa: si alguien se acerca, lo oiréis.","suave":"Apoya a {O} contra un tronco y bésale despacio, de los labios al cuello.","tags":["aire","intimo"]},
    {"id":"ot-c1","est":"otono","f":"cena","para":"uno","t":"La cuchara","x":"Que la cena sea caliente y de cuchara. Las tres primeras cucharadas de {O}, se las das tú, soplando antes.","tags":["comida"]},
    {"id":"ot-c2","est":"otono","f":"cena","para":"ambos","t":"La lumbre","x":"Junto a una chimenea, una estufa o una vela, contaos lo mejor del día con las manos dentro de la ropa de quien tenéis al lado."},
    {"id":"in-v1","est":"invierno","f":"viaje","para":"copi","t":"La calefacción","x":"Sube la calefacción un grado por cada cosa que {O} te cuente que quiere hacer esta noche. A ver a cuántos grados llegáis."},
    {"id":"in-v2","est":"invierno","f":"viaje","para":"copi","t":"El vaho","x":"Escribe en el vaho de tu ventanilla una palabra que resuma la noche que viene. {O} solo podrá leerla en la próxima parada."},
    {"id":"in-e1","est":"invierno","f":"explora","para":"uno","nivel":2,"min":35,"t":"Las manos frías","x":"Con el frío de verdad, mete tus manos heladas bajo la ropa de {O}, avisando o no, y deja que te las caliente donde elija.","suave":"Coge las manos de {O} y caliéntaselas con tu aliento y dentro de tu abrigo.","tags":["hielo"]},
    {"id":"in-e2","est":"invierno","f":"explora","para":"uno","nivel":3,"min":40,"t":"La nieve","x":"Si hay nieve, guerra de bolas hasta caer al suelo. Quien pierda se deja besar donde la otra persona quiera, por debajo del abrigo.","suave":"Guerra de bolas de nieve: quien pierda, paga con un beso largo.","tags":["hielo"]},
    {"id":"in-e3","est":"invierno","f":"explora","para":"uno","nivel":4,"min":45,"t":"Bajo el abrigo","x":"En un sitio a solas, abre tu abrigo, mete a {O} dentro contigo y que tus manos hagan el resto sin dejar entrar el frío. Aquí no se quita nada: el calor va por dentro.","suave":"Mete a {O} dentro de tu abrigo y besaos hasta entrar en calor.","tags":["aire","intimo"]},
    {"id":"in-c1","est":"invierno","f":"cena","para":"ambos","t":"Un solo plato","x":"Algo caliente de cuchara en un solo plato, para compartir. Una cuchara cada cual… o una sola, por turnos.","tags":["comida"]},
    {"id":"in-c2","est":"invierno","f":"cena","para":"ambos","t":"La noche larga","x":"Anochece pronto: tenéis horas. Haced en voz baja la lista de lo que cabe en una noche de invierno, de menos a más, y no os saltéis nada.","tags":["voz"]},
    {"id":"ho-l1","alo":"hotel","f":"llegada","para":"uno","nivel":1,"t":"En recepción","x":"Mientras os dan la llave, escribe con el dedo en la espalda de {O} una palabra. Tiene que adivinarla antes de llegar a la habitación."},
    {"id":"ho-l2","alo":"hotel","f":"llegada","para":"uno","nivel":2,"t":"La puerta","x":"Nada más cerrar la puerta de la habitación, apoya a {O} contra ella y dale un beso de los que no dejan deshacer la maleta."},
    {"id":"ho-l3","alo":"hotel","f":"llegada","para":"ambos","nivel":1,"t":"No molestar","x":"Colgad el cartel de «No molestar», aunque solo sea para dejar las maletas. Así se va acostumbrando."},
    {"id":"ho-e1","alo":"hotel","f":"explora","para":"uno","nivel":2,"min":35,"t":"El callejón","x":"En el pueblo, encuentra el callejón más estrecho y vacío, y bésale allí a {O} como si os estuvieran buscando.","suave":"Coge de la mano a {O} y no la sueltes hasta el siguiente callejón."},
    {"id":"ho-e2","alo":"hotel","f":"explora","para":"uno","nivel":2,"min":40,"t":"La compra secreta","x":"En una tienda del pueblo compra, sin que {O} vea qué, algo que usarás esta noche en la habitación: un dulce, una vela, una cinta.","suave":"Compra algo pequeño para regalárselo a {O} esta noche, sin que vea qué es."},
    {"id":"ho-c1","alo":"hotel","f":"cena","para":"uno","t":"A ciegas","x":"Elige tú el vino o el postre de {O} sin preguntarle nada. Si acierta su sonrisa, te debe un capricho."},
    {"id":"ho-c2","alo":"hotel","f":"cena","para":"ambos","t":"La vuelta larga","x":"Volved a la habitación por el camino más largo del pueblo, parando en cada esquina oscura."},
    {"id":"ho-a1","alo":"hotel","f":"alcoba","temp":"seda","t":"La bañera","x":"Prepara un baño caliente, o una ducha larga, y desnuda a {R} para meterle dentro. Lávale despacio, como si fuera lo más valioso del viaje.","tags":["agua","desnudez"]},
    {"id":"ho-a2","alo":"hotel","f":"alcoba","temp":"seda","t":"La ventana","x":"Apaga las luces y, solo si nadie puede veros desde fuera, abre las cortinas. Tú, detrás de {R}, recorriendo su cuerpo mientras mira el pueblo dormido.","tags":[]},
    {"id":"ho-a3","alo":"hotel","f":"alcoba","temp":"brasa","t":"Sábanas de hotel","x":"Quítale a {R} toda la ropa sobre la cama recién hecha. La única regla: la cama no se deshace… hasta que se deshace sola.","tags":["desnudez"]},
    {"id":"ho-a4","alo":"hotel","f":"alcoba","temp":"brasa","t":"Las paredes oyen","x":"Durante una canción, haz que a {R} le cueste no hacer ruido. Tus manos y tu boca, por donde se deje.","tags":["silencio","intimo"]},
    {"id":"fu-l1","alo":"furgo","f":"llegada","para":"ambos","nivel":1,"t":"La orientación","x":"Aparcad con la puerta grande mirando al paisaje y lejos de donde pasa la gente. Esa puerta va a abrirse más tarde."},
    {"id":"fu-l2","alo":"furgo","f":"llegada","para":"uno","nivel":2,"t":"Las cortinas","x":"Pon tú las cortinas, una a una, mientras {O} mira desde la cama. Con cada ventana tapada, te quitas algo.","tags":["prenda"]},
    {"id":"fu-l3","alo":"furgo","f":"llegada","para":"uno","nivel":1,"t":"La casa pequeña","x":"Haz la cama de la furgo como la de un hotel de lujo, con la luz cálida encendida, y llama a {O} cuando esté lista."},
    {"id":"fu-e1","alo":"furgo","f":"explora","para":"uno","nivel":3,"min":40,"t":"El borde de la puerta","x":"Con la furgo en un sitio a solas, abre la puerta grande y sentaos en el borde, mirando fuera. Tus manos, por dentro de la ropa de {O}; vuestros pies, en el paisaje.","suave":"Sentaos en el borde de la puerta abierta con una manta por los hombros, en un abrazo.","tags":["aire"]},
    {"id":"fu-e2","alo":"furgo","f":"explora","para":"uno","nivel":2,"min":35,"t":"El cielo por el cristal","x":"Tumbaos a mirar el cielo por la claraboya o por el parabrisas. Cuéntale a {O} lo que harías si el techo se abriera ahora mismo.","suave":"Tumbaos a mirar el cielo por el cristal y busca la mano de {O} sin decir nada.","tags":["voz"]},
    {"id":"fu-c1","alo":"furgo","f":"cena","para":"uno","t":"La cocina pequeña","x":"Cocina tú algo sencillo, con la ventana abierta si usas gas, y sírvele a {O} en la cama, con la puerta abierta al paisaje."},
    {"id":"fu-c2","alo":"furgo","f":"cena","para":"ambos","t":"Luces fuera","x":"Cuando anochezca, apagad todas las luces y esperad a que aparezcan las estrellas. Si pasa algún coche, que os pille en un beso."},
    {"id":"fu-a1","alo":"furgo","f":"alcoba","temp":"seda","t":"Lluvia en el techo","x":"Si llueve, apagad todo y escuchad la lluvia en el techo; si no, que sea el viento. Desnuda a {R} al ritmo de lo que suene fuera.","tags":["prenda","desnudez"]},
    {"id":"fu-a2","alo":"furgo","f":"alcoba","temp":"seda","t":"El vaho","x":"Cuando se empañen los cristales, escribe con el dedo lo que vas a hacerle a {R}, y hazlo antes de que se borre.","tags":[]},
    {"id":"fu-a3","alo":"furgo","f":"alcoba","temp":"brasa","t":"El espacio justo","x":"En una cama de furgo no cabe la prisa. Que {R} se tumbe, y tú encuentra la forma de recorrer su cuerpo entero sin salirte de ella.","tags":["desnudez","intimo"]},
    {"id":"fu-a4","alo":"furgo","f":"alcoba","temp":"brasa","t":"La puerta, otra vez","x":"Si estáis a solas de verdad, abre la puerta grande un momento: que entre el aire de fuera mientras tu boca baja por el cuerpo de {R}. Luego, ciérrala y que se quede el calor.","tags":["aire","intimo"]},
    {"id":"ac-l1","alo":"acampada","f":"llegada","para":"ambos","nivel":1,"t":"El sitio de la tienda","x":"Elegid el sitio de la tienda como si fuera la cama de esta noche, porque lo es: plano, sin piedras, lejos de otras tiendas y con algo de vista."},
    {"id":"ac-l2","alo":"acampada","f":"llegada","para":"uno","nivel":1,"t":"Pieza a pieza","x":"Mientras montáis la tienda, cada vez que {O} te pase una pieza, le das un beso. Si la tienda tarda, mejor."},
    {"id":"ac-l3","alo":"acampada","f":"llegada","para":"uno","nivel":2,"t":"El nido","x":"Prepara tú el interior: esterillas, sacos abiertos para unirlos, frontal en luz roja. Cuando esté, invita a {O} a probarlo un momento… solo un momento."},
    {"id":"ac-e1","alo":"acampada","f":"explora","para":"uno","nivel":3,"min":40,"t":"Donde ya no se ve la tienda","x":"Aléjate con {O} hasta que no se vea ninguna tienda. Allí, ponte detrás, desabróchale lo justo y deja que el aire de fuera haga el resto.","suave":"Aléjate con {O} hasta que no se vea ninguna tienda y abrázale por detrás, sin prisa.","tags":["aire","prenda"]},
    {"id":"ac-e2","alo":"acampada","f":"explora","para":"uno","nivel":2,"min":35,"t":"A por agua","x":"Cuando vayáis a por agua o a buscar una vista, deja que {O} vaya delante: cada vez que se pare, le robas un beso en la nuca.","suave":"De camino a por agua, coge a {O} de la mano y no la sueltes hasta volver."},
    {"id":"ac-c1","alo":"acampada","f":"cena","para":"uno","t":"El hornillo","x":"Cocina en el hornillo, fuera de la tienda y donde esté permitido, y da a probar a {O} de tu cuchara, soplando antes.","tags":["comida"]},
    {"id":"ac-c2","alo":"acampada","f":"cena","para":"ambos","t":"Frontales apagados","x":"Apagad los frontales y tumbaos a mirar el cielo hasta que los ojos se acostumbren. Cada estrella fugaz, una prenda menos… o un beso, si hace frío.","tags":["aire"]},
    {"id":"ac-a1","alo":"acampada","f":"alcoba","temp":"seda","t":"La cremallera","x":"Abre la cremallera del saco de {R} muy despacio, que se oiga cada diente. Lo que haya dentro, desnúdalo igual de despacio.","tags":["prenda","desnudez"]},
    {"id":"ac-a2","alo":"acampada","f":"alcoba","temp":"seda","t":"Los ruidos de la noche","x":"Tumbaos a escuchar la noche. Cada ruido que llegue de fuera, una caricia nueva por dentro del saco de {R}.","tags":[]},
    {"id":"ac-a3","alo":"acampada","f":"alcoba","temp":"brasa","t":"Dos sacos, uno","x":"Unid los sacos y desnuda a {R} dentro, despacio y a oscuras. Que el calor lo pongan los cuerpos, y tus manos, el resto.","tags":["desnudez","intimo"]},
    {"id":"ac-a4","alo":"acampada","f":"alcoba","temp":"brasa","t":"Al raso","x":"Si la noche lo permite y estáis a solas de verdad, sacad los sacos fuera de la tienda. Recorre a {R} bajo las estrellas, con la boca, hasta donde la noche os deje.","tags":["aire","desnudez","intimo"],"noest":["invierno"]},
    {"id":"c-e9","f":"explora","para":"uno","nivel":4,"min":40,"t":"Tres minutos","x":"En un sitio a solas y resguardado, tres minutos y ni uno más: tu mano por dentro de la ropa de {O}, donde más lo note, hasta que suene la alarma del móvil. Después, como si nada.","suave":"En un sitio a solas, tres minutos de besos sin parar, con la alarma del móvil puesta.","tags":["aire","intimo"]},
    {"id":"c-e10","f":"explora","para":"uno","nivel":4,"min":60,"t":"Veinte minutos","x":"Con cualquier excusa, volved a dormir un rato: a la habitación, a la furgo o a la tienda. Veinte minutos, ni uno más, para lo que quepa en veinte minutos. Después, de vuelta a la calle como si nada.","suave":"Con cualquier excusa, volved veinte minutos a descansar, en un abrazo y sin hacer nada más.","tags":["intimo"]},
    {"id":"c-p5","f":"perdidos","temp":"brasa","t":"Con la boca","tags":["aire","intimo"],"x":"Sobre la manta, a solas de verdad: ponte entre las piernas de {R} y quédate ahí con la boca, sin prisa, hasta que {R} te pida que pares o que no pares."},
    {"id":"c-p6","f":"perdidos","temp":"seda","t":"El oído en el pecho","tags":["aire"],"x":"Tumba a {R} sobre la manta y apoya la cabeza en su pecho, por dentro de la ropa abierta. Escucha cómo cambia su corazón mientras tu mano baja despacio por su vientre."},
    {"id":"c-a5","f":"alcoba","temp":"brasa","t":"Al borde, tres veces","tags":["borde","intimo"],"x":"Acaricia a {R} donde más lo note y para justo cuando más lo esté disfrutando. Cuenta tres respiraciones y vuelve a empezar. Tres veces. A la cuarta, no pares."},
    {"id":"c-a6","f":"alcoba","temp":"brasa","t":"La mano que guía","tags":["guia","intimo"],"x":"Deja que {R} coja tu mano y la lleve donde quiera, como quiera y al ritmo que quiera, durante una canción entera. Tú solo te dejas llevar, y miras su cara."}
  ],
  "combos": {
    "primavera/hotel": {"titulo": "Primavera en el pueblo", "gancho": "Un pueblo de piedra que se despereza: golondrinas, huertas en flor y un río crecido. Una habitación con balcón y un sendero que sale hacia el monte.", "lugar": "Un pueblo pequeño con río o huertas, mejor entre semana y fuera de fiestas. Una habitación con balcón o ventana al campo, y un sendero que salga del pueblo hacia un bosque o una ermita.", "consejos": ["Fuera de temporada los pueblos están casi vacíos: perfecto para los callejones, no tanto para los horarios de cocina. Mirad antes dónde se puede cenar.", "El sendero, de día y sin alejaros demasiado. La hierba de primavera esconde garrapatas: manta siempre y revisión al volver."], "material": ["Ropa fácil de quitar", "Una luz cálida a pilas para la habitación"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido, y no por casualidad. Desde aquí el pueblo es un dibujo pequeño: tejados, un campanario, algún perro que ladra lejos.", "Antes de nada, mirad alrededor: nadie a la vista, nadie que pueda llegar sin que lo oigáis, y el camino de vuelta claro. Si no es así, buscad otro sitio. Hay más.", "Extended la manta. Desde aquí las cartas suben hasta el final. Si aparece alguien, se acabó: ropa y a pasear, sin dramas."]}, "alcoba": {"parrafos": ["Es de noche en el pueblo. La plaza está vacía y las golondrinas duermen bajo los aleros.", "Cerrad la puerta y sacad las cartas que escribisteis antes de salir de casa. Leedlas en voz alta, la vuestra o la de la otra persona, como queráis.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, que valen hasta el amanecer."]}}, "propuestas": [
      {"id":"prho-v1","f":"viaje","para":"copi","t":"El nombre del pueblo","x":"Busca el pueblo en el mapa y léele a {O} su nombre como si fuera una promesa. Después, inventad qué secreto guarda."},
      {"id":"prho-v2","f":"viaje","para":"copi","t":"La primera vez en un hotel","x":"Recuérdale a {O} la primera noche que pasasteis en un hotel, o invéntala si no la hubo: qué pasó nada más cerrar la puerta."},
      {"id":"prho-v3","f":"viaje","para":"copi","t":"Lo que va en la maleta","x":"Confiesa qué has metido en la maleta pensando en esta noche, sin decir qué es: solo para qué sirve. {O} tiene hasta la llegada para adivinarlo."},
      {"id":"prho-l1","f":"llegada","para":"uno","nivel":2,"t":"El balcón","x":"Abre el balcón o la ventana y saca a {O} a respirar el pueblo. Abrázale por detrás y dile en voz baja qué vas a hacerle esta noche en esta habitación.","tags":["voz"]},
      {"id":"prho-l2","f":"llegada","para":"ambos","nivel":1,"t":"La casa para siempre","x":"Primera vuelta al pueblo, sin mapa. Cuando encontréis la plaza, elegid la casa donde viviríais si os quedarais para siempre, y decid qué habitación estrenaríais primero."},
      {"id":"prho-l3","f":"llegada","para":"uno","nivel":2,"t":"Quitarse el viaje","x":"Métete en la ducha para quitarte el viaje y deja la puerta del baño abierta. Si {O} entra, no digas nada; si no entra, sal con la toalla mal puesta.","tags":["agua"]},
      {"id":"prho-l4","f":"llegada","para":"uno","nivel":1,"t":"En la almohada","x":"Coge una flor caída del camino y déjala en la almohada de {O} con una nota de dos palabras. Las dos, para esta noche."},
      {"id":"prho-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Las golondrinas","x":"Cuenta las golondrinas que veáis durante el paseo. Por cada una, un beso a {O} donde elijas, siempre sin que nadie lo note.","suave":"Cuenta las golondrinas del paseo: por cada una, un beso en la mano de {O}."},
      {"id":"prho-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"La ermita","x":"Buscad la ermita, la fuente o el lavadero más apartado del pueblo. Allí, a solas, bésale a {O} como no se besa en la plaza.","suave":"En la fuente o la ermita más apartada, dile al oído a {O} algo que nunca dirías en la plaza.","tags":[]},
      {"id":"prho-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"Detrás del árbol en flor","x":"Por el camino de las huertas, cuando nadie mire, llévate a {O} detrás de un muro o de un árbol en flor y bésale con las manos dentro de su chaqueta.","suave":"Por el camino de las huertas, un beso detrás de un árbol en flor, sin más."},
      {"id":"prho-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"La cintura","x":"En el camino más vacío del pueblo, cuela tu mano por la cintura de la ropa de {O}, solo un poco, y déjala ahí hasta que se cruce alguien.","suave":"Pasea por el camino más vacío con tu mano en el bolsillo de atrás de {O}."},
      {"id":"prho-e5","f":"explora","para":"uno","nivel":3,"min":45,"t":"Donde el pueblo ya no se oye","x":"Seguid el sendero hasta dejar de oír el pueblo. En el primer rincón con sombra y sin nadie, desabrocha a {O} lo justo para besar la piel que el sol no ha visto este año.","suave":"Seguid el sendero hasta dejar de oír el pueblo y, en el primer rincón con sombra, un beso largo con tus manos en su cintura.","tags":["aire","prenda"]},
      {"id":"prho-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Cinco minutos","x":"Con cualquier excusa, vuelve con {O} a la habitación: tenéis cinco minutos y la puerta cerrada. Después, de vuelta al pueblo como si nada.","suave":"Vuelve con {O} a la habitación un momento: un beso contra la puerta y salís otra vez."},
      {"id":"prho-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"La siesta del pueblo","x":"A la hora de la siesta el pueblo duerme. Llévate a {O} a la habitación, baja las persianas a medias y desnúdale despacio, con la luz de la tarde entrando a rayas.","suave":"A la hora de la siesta, túmbate con {O} con las persianas a medias y que tus manos recorran su espalda bajo la ropa.","tags":["desnudez"]},
      {"id":"prho-e8","f":"explora","para":"uno","nivel":4,"min":45,"t":"El muro de piedra","x":"Detrás de un muro de piedra, lejos del camino, apoya a {O} contra las piedras templadas por el sol y desabrocha lo que haga falta. Los perros del pueblo avisan si alguien viene.","suave":"Apoya a {O} contra un muro templado por el sol y bésale despacio, de los labios al cuello.","tags":["aire","intimo"]},
      {"id":"prho-p1","f":"perdidos","temp":"seda","t":"La sombra del nogal","x":"Bajo un árbol grande, lejos del sendero, siéntate con la espalda en el tronco y {R} entre tus piernas. Tus manos, por debajo de su ropa, al ritmo del viento.","tags":["aire"]},
      {"id":"prho-p2","f":"perdidos","temp":"seda","t":"El tomillo","x":"Frota un poco de tomillo o de hierba olorosa entre los dedos y pásalos por el cuello y el pecho de {R}. Después, besa por donde huela.","tags":["aire"]},
      {"id":"prho-p3","f":"perdidos","temp":"seda","t":"Las campanadas","x":"Cuando suenen las campanas del pueblo, quítale a {R} una prenda por cada campanada. Si es una hora larga, mejor.","tags":["aire","prenda","desnudez"]},
      {"id":"prho-p4","f":"perdidos","temp":"brasa","t":"El sol de abril","x":"Desnuda a {R} sobre la manta y deja que el sol de primavera le caliente la piel. Tú la sigues con la boca, por delante y por detrás, sin prisa.","tags":["aire","desnudez","intimo"]},
      {"id":"prho-p5","f":"perdidos","temp":"brasa","t":"Ver sin ser visto","x":"Buscad un sitio desde donde se vea el pueblo pero el pueblo no os vea. Allí, sin ropa, que {R} decida hasta dónde: tú solo sigues su mano.","tags":["aire","desnudez","intimo","guia"]},
      {"id":"prho-p6","f":"perdidos","temp":"brasa","t":"Antes de volver","x":"Antes de vestiros, un último recorrido: tu boca por todo el cuerpo de {R}, de los tobillos a los labios, como despedida del sitio.","tags":["aire","desnudez","intimo"]},
      {"id":"prho-c1","f":"cena","para":"uno","t":"En el mantel","x":"Durante la cena, escribe con el dedo en el mantel, junto a la mano de {O}, una palabra para luego. Tiene que adivinarla antes del postre."},
      {"id":"prho-c2","f":"cena","para":"ambos","t":"Farolas","x":"Después de cenar, una vuelta por el pueblo dormido. En cada farola apagada, un beso; en cada farola encendida, una promesa al oído.","tags":["voz"]},
      {"id":"prho-c3","f":"cena","para":"uno","t":"El licor de la casa","x":"Pide el licor o el dulce típico del pueblo y dale a probar a {O} el primer sorbo, de tus labios, si no mira nadie.","tags":["comida"]},
      {"id":"prho-a1","f":"alcoba","temp":"seda","t":"El balcón entornado","x":"Deja el balcón entornado para que entre el aire de la noche y el olor a campo. Desnuda a {R} despacio con esa luz y abrázale piel con piel.","tags":["prenda","desnudez"]},
      {"id":"prho-a2","f":"alcoba","temp":"seda","t":"La flor del camino","x":"Recorre el cuerpo de {R} con la flor que trajiste del camino, o con la yema de los dedos si se ha marchitado. Donde se le escape un suspiro, deja un beso.","tags":["pluma"]},
      {"id":"prho-a3","f":"alcoba","temp":"seda","t":"Hasta la próxima hora","x":"Si el pueblo tiene campanas, espera a la próxima hora. Hasta que suenen, solo tu boca en el cuello y los hombros de {R}.","tags":[]},
      {"id":"prho-a4","f":"alcoba","temp":"brasa","t":"Persianas abajo","x":"Baja las persianas del todo. A oscuras, recorre a {R} solo con la boca y deja que su respiración te marque el camino.","tags":["intimo"]},
      {"id":"prho-a5","f":"alcoba","temp":"brasa","t":"El edredón","x":"Meteos bajo el edredón sin nada encima. Ahí dentro, a oscuras, tu boca baja por el cuerpo de {R} hasta donde te pida.","tags":["desnudez","intimo"]},
      {"id":"prho-a6","f":"alcoba","temp":"brasa","t":"Antes que las golondrinas","x":"Las golondrinas empiezan pronto. Que os pillen sin haber dormido: lo que queráis, como queráis, hasta que {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"prho-p7","f":"perdidos","temp":"brasa","t":"Bajo el árbol en flor","tags":["aire","prenda","intimo"],"x":"Sobre la manta, bajo un árbol en flor, desabrocha a {R} lo justo y recorre con la boca el camino de los pétalos que caen: el cuello, el pecho, el vientre, y más abajo si {R} te lo pide."},
      {"id":"prho-a7","f":"alcoba","temp":"brasa","t":"La siesta con la ventana abierta","tags":["borde","intimo"],"x":"Con la ventana abierta y el pueblo de fondo, acaricia a {R} donde más lo note y para cada vez que esté a punto. Tres veces, despacio. A la cuarta, que se entere el pueblo."}
    ]},
    "primavera/furgo": {"titulo": "Primavera en furgo", "gancho": "Un valle verde con el río crecido por el deshielo, cencerros a lo lejos y un hayedo estrenando hojas. La furgo, aparcada donde se acaba el asfalto.", "lugar": "Un valle de montaña o un hayedo con aparcamiento permitido cerca de un prado o de un río, lejos de pueblos y de áreas llenas. Mejor entre semana.", "consejos": ["Los prados tienen dueño y ganado: nada de entrar con la furgo, y si hay vacas con ternero, a buena distancia.", "Por la mañana, niebla y frío; a mediodía, sol. Edredón de entretiempo y ropa por capas."], "material": ["Una lona o manta impermeable para el suelo", "Algo dulce para desayunar en la cama"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en el valle. La furgo queda abajo, pequeña, como una casa de juguete junto al río.", "Mirad bien: ni senderistas, ni pastores, ni coches por la pista. Si alguien puede aparecer, buscad otro rincón; si no, este es vuestro.", "Extended la manta. Las cartas suben desde aquí hasta el final, y si llega alguien, se acabó: ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["La noche en el valle suena a río. La furgo es ahora la casa más pequeña del mundo, y la única.", "Cerrad las cortinas, encended la luz cálida y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, sin prisa.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que amanezca."]}}, "propuestas": [
      {"id":"prfu-v1","f":"viaje","para":"copi","t":"Inventario a bordo","x":"Haz en voz alta la lista de todo lo que hay en la furgo que podría servir para jugar esta noche. Sin pudor: la cuerda de tender también cuenta."},
      {"id":"prfu-v2","f":"viaje","para":"copi","t":"El último pueblo","x":"Al pasar el último pueblo antes del valle, dile a {O} una cosa que harás en cuanto apague el motor. Solo una, y que sea concreta."},
      {"id":"prfu-v3","f":"viaje","para":"copi","t":"La puerta de atrás","x":"Cuéntale a {O} qué te gustaría encontrarte mañana al abrir la puerta de atrás: el paisaje, la luz, y lo que haya pasado antes dentro."},
      {"id":"prfu-l1","f":"llegada","para":"ambos","nivel":1,"t":"El sitio bueno","x":"Buscad el aparcamiento bueno: legal, plano, con la puerta hacia el valle y sin nadie cerca. Al encontrarlo, apagad el motor y un minuto de silencio, solo mirando."},
      {"id":"prfu-l2","f":"llegada","para":"uno","nivel":1,"t":"Descalzarse","x":"Lo primero al llegar: descalza a {O}, sin prisa, y que pise contigo la hierba un momento. Después, a la furgo."},
      {"id":"prfu-l3","f":"llegada","para":"uno","nivel":2,"t":"El primer café","x":"Prepara un café o un té, con la ventana abierta si usas gas, y tomadlo en la cama. Mientras dure la taza, tu mano libre va por debajo del jersey de {O}."},
      {"id":"prfu-l4","f":"llegada","para":"uno","nivel":2,"t":"Solo un beso","x":"Con las cortinas a medio poner, empuja a {O} con suavidad sobre la cama y dale un beso largo. Solo un beso: la cama se estrena de verdad esta noche."},
      {"id":"prfu-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Cencerros","x":"Cada vez que oigáis un cencerro, {O} te debe un beso. Tú decides dónde y cuándo lo cobras.","suave":"Cada cencerro que oigáis, un beso en la mejilla de {O}."},
      {"id":"prfu-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"Agua de deshielo","x":"Llevad a {O} hasta el río. Moja tus manos en el agua helada y ponlas en su nuca y bajo su camiseta. Después, caliéntale tú, como quieras.","suave":"Moja tus manos en el río y caliéntalas después entre las manos de {O}.","tags":["hielo"]},
      {"id":"prfu-e3","f":"explora","para":"uno","nivel":2,"min":40,"t":"Hojas nuevas","x":"En el hayedo, bajo las hojas recién estrenadas, apoya a {O} contra un tronco liso y bésale sin prisa, con las manos donde quieras por encima de la ropa.","suave":"En el hayedo, un beso largo contra un tronco liso, sin más."},
      {"id":"prfu-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"El borde de la furgo","x":"Volved un momento a la furgo. Sentaos en el borde de la puerta de atrás y desabrocha a {O} lo justo para que el aire del valle le toque la piel. Después, tu boca hace lo mismo.","suave":"Sentaos en el borde de la puerta de atrás y que tus manos busquen la piel de {O} por debajo del jersey.","tags":["aire","prenda"]},
      {"id":"prfu-e5","f":"explora","para":"uno","nivel":3,"min":45,"t":"Las vacas no cuentan","x":"Junto a un prado con ganado, a buena distancia, quítale a {O} una prenda. Las vacas no cuentan como público, pero los pastores sí: mirad bien antes.","suave":"Junto a un prado, a buena distancia de las vacas, un beso largo con las manos dentro de su ropa.","tags":["aire","prenda"]},
      {"id":"prfu-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Un solo chubasquero","x":"Si llueve, compartid un solo chubasquero o un solo paraguas, con los cuerpos pegados. Lo que hagan las manos ahí debajo solo lo sabe quien está dentro.","suave":"Si llueve, compartid chubasquero y caminad un rato en un abrazo."},
      {"id":"prfu-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Para entrar en calor","x":"Volved a la furgo, cerrad las cortinas y meteos en la cama sin nada encima, solo para entrar en calor. Ya veréis cuánto dura lo de solo.","suave":"Volved a la furgo, cerrad las cortinas y meteos un rato en la cama, en un abrazo, con la ropa que queráis.","tags":["desnudez"]},
      {"id":"prfu-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"El claro sin camino","x":"Buscad en el hayedo un claro al que no llegue ningún camino. Tumba a {O} en la manta sobre las hojas y desnúdale hasta donde el fresco deje: el calor lo pones tú.","suave":"En un claro del hayedo, tumbaos en la manta en un abrazo y que tus manos se cuelen bajo la ropa de {O}.","tags":["aire","desnudez"]},
      {"id":"prfu-p1","f":"perdidos","temp":"seda","t":"A la sombra de las hayas","x":"Tumba a {R} sobre la manta, a la sombra de las hayas. Desabrocha despacio lo que lleve, sin quitarlo del todo: de momento, el valle mira por las rendijas.","tags":["aire","prenda"]},
      {"id":"prfu-p2","f":"perdidos","temp":"seda","t":"El pañuelo mojado","x":"Moja un pañuelo en el arroyo y pásalo por el cuello y el pecho de {R}. Cada escalofrío, tu boca lo calienta en el mismo sitio.","tags":["aire","hielo"]},
      {"id":"prfu-p3","f":"perdidos","temp":"seda","t":"El viento primero","x":"Quítale a {R} la prenda de arriba y deja que el viento del valle haga el primer recorrido. El segundo, el de tus manos, más despacio.","tags":["aire","prenda"]},
      {"id":"prfu-p4","f":"perdidos","temp":"brasa","t":"Más que el río","x":"Desnuda a {R} sobre la manta y recorre su cuerpo con la boca mientras suenan el río y los pájaros. Que lo único que se oiga más que el río sea {R}.","tags":["aire","desnudez","intimo"]},
      {"id":"prfu-p5","f":"perdidos","temp":"brasa","t":"Con los pies fuera","x":"Si la pista está vacía y la furgo cerca, abrid la puerta grande y tumbaos dentro con los pies fuera, sin ropa. El resto lo decide {R}.","tags":["aire","desnudez","intimo"]},
      {"id":"prfu-p6","f":"perdidos","temp":"brasa","t":"Hasta que el sol se esconda","x":"Sin ropa y sin cartas: tu cuerpo y el de {R} sobre la manta hasta que el sol se esconda detrás del monte. Lo que pase, a su ritmo.","tags":["aire","desnudez","intimo"]},
      {"id":"prfu-c1","f":"cena","para":"ambos","t":"Mesa en la cama","x":"Cenad en la cama de la furgo, con la puerta abierta al valle mientras quede luz. Regla: nadie come con sus manos, se da de comer a la otra persona.","tags":["comida"]},
      {"id":"prfu-c2","f":"cena","para":"uno","t":"Vivir en el valle","x":"Cuéntale a {O} cómo sería vuestra vida si os quedarais a vivir en este valle: con detalle, y con muchas mañanas en la cama.","tags":["voz"]},
      {"id":"prfu-c3","f":"cena","para":"uno","t":"Constelaciones","x":"Sin luces de pueblo cerca, el cielo se llena. Busca la constelación más fácil y dibújasela a {O} con el dedo en la espalda, por debajo de la ropa."},
      {"id":"prfu-a1","f":"alcoba","temp":"seda","t":"Prenda a prenda","x":"Con solo la luz cálida encendida, desnuda a {R} despacio, en el poco espacio que hay. Cada prenda que quites, un beso donde estaba.","tags":["prenda","desnudez"]},
      {"id":"prfu-a2","f":"alcoba","temp":"seda","t":"Al ritmo del río","x":"Abrid un poco una ventana para oír el río. A su ritmo, recorre la espalda de {R} con las yemas de los dedos, de la nuca a la cintura, una y otra vez.","tags":[]},
      {"id":"prfu-a3","f":"alcoba","temp":"seda","t":"Piernas entrelazadas","x":"Meteos bajo el edredón con las piernas entrelazadas. Durante una canción solo se mueven tus manos, y siempre por debajo.","tags":[]},
      {"id":"prfu-a4","f":"alcoba","temp":"brasa","t":"El techo bajo","x":"En la furgo no cabe ponerse de pie: que {R} se tumbe y tú recorre su cuerpo con la boca, sin saltarte ningún rincón de los que te deje.","tags":["desnudez","intimo"]},
      {"id":"prfu-a5","f":"alcoba","temp":"brasa","t":"Antes que el valle","x":"Si despertáis antes que el valle, abrid la puerta un palmo para que entre la primera luz. Lo que empiece ahí, sin prisa y sin salir de la cama.","tags":["desnudez","intimo"]},
      {"id":"prfu-a6","f":"alcoba","temp":"brasa","t":"Todos los cristales","x":"Que se empañen todos los cristales de la furgo. Lo que hace falta para eso ya lo sabéis; el ritmo lo pone {R}.","tags":["desnudez","intimo"]},
      {"id":"prfu-p7","f":"perdidos","temp":"brasa","t":"La puerta corredera","tags":["aire","desnudez","intimo"],"x":"Con la puerta corredera abierta a un prado sin nadie, {R} se tumba en el borde de la cama, sin ropa. Arrodíllate fuera, sobre la hierba, con tu boca entre sus piernas, hasta que te pida que pares."},
      {"id":"prfu-a7","f":"alcoba","temp":"brasa","t":"Cada cual en un extremo","tags":["solo","desnudez"],"x":"En la cama de la furgo, cada cual en un extremo y sin ropa: tocaos mirándoos, sin tocar a la otra persona, hasta que {R} no aguante más y cruce la cama."}
    ]},
    "primavera/acampada": {"titulo": "Primavera en tienda", "gancho": "Una pradera junto a un arroyo, flores por todas partes, noches todavía frescas y un coro de pájaros al amanecer. La tienda, lo más lejos posible de las demás.", "lugar": "Un camping pequeño y tranquilo o un área de acampada junto a un río o un bosque, mejor fuera de puentes y festivos.", "consejos": ["Las noches de primavera son frías aunque el día haya sido de manga corta: saco de tres estaciones y algo de lana para dormir.", "Montad la tienda lejos del cauce: con el deshielo o una tormenta, los arroyos crecen deprisa."], "material": ["Saco de tres estaciones", "Un pareo o una manta fina para dentro de la tienda"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido más allá del arroyo. Desde aquí no se ve ninguna tienda, ni siquiera la vuestra.", "Antes de nada: nadie a la vista, nadie que pueda llegar sin que lo oigáis, y el camino de vuelta claro. Si dudáis, otro sitio.", "Extended la manta lejos de la hierba alta. Desde aquí las cartas suben hasta el final. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["La noche de primavera refresca deprisa. Dentro de la tienda, en cambio, el aire ya huele a vosotros.", "Cerrad la cremallera, poned el frontal en luz roja y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta, muy baja.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que canten los pájaros."]}}, "propuestas": [
      {"id":"prac-v1","f":"viaje","para":"copi","t":"Lo último en la mochila","x":"Pregúntale a {O} qué es lo último que metió en la mochila y por qué. Si la respuesta no tiene nada de picante, que se invente otra."},
      {"id":"prac-v2","f":"viaje","para":"copi","t":"La primera noche fuera","x":"Cuéntale a {O} cómo imaginas la primera noche en la tienda: los ruidos de fuera, el frío de fuera y el calor de dentro."},
      {"id":"prac-v3","f":"viaje","para":"copi","t":"El despertador","x":"Ponle a {O} el canto de un pájaro, o imítalo tú, y prométele que mañana os despertará uno de verdad… o algo mejor."},
      {"id":"prac-l1","f":"llegada","para":"ambos","nivel":1,"t":"Mirar antes de montar","x":"Antes de montar nada, tumbaos un minuto en la manta a mirar el cielo del sitio. Desde ahí, decidid hacia dónde mirará la puerta de la tienda."},
      {"id":"prac-l2","f":"llegada","para":"uno","nivel":1,"t":"Piquetas","x":"Por cada piqueta que claves, un beso a {O} en un sitio distinto. El último, en el sitio más escondido que el campamento permita."},
      {"id":"prac-l3","f":"llegada","para":"uno","nivel":2,"t":"Buscando la linterna","x":"Con la tienda montada, mete a {O} dentro con cualquier excusa y cierra la cremallera. Un minuto de besos, y salís como si hubierais estado buscando la linterna."},
      {"id":"prac-l4","f":"llegada","para":"uno","nivel":2,"t":"La ropa de dormir","x":"Prepara la ropa de dormir de {O} con mimo, doblada sobre su saco… y decide tú qué prenda sobra. Déjala fuera sin decir nada."},
      {"id":"prac-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Tres flores","x":"Recoge tres flores silvestres de las que abundan, nunca en un espacio protegido, y dáselas a {O} una a una, cada una con un piropo distinto.","suave":"Dale a {O} una flor silvestre de las que abundan, con un piropo.","tags":["voz"]},
      {"id":"prac-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"Los pies en el arroyo","x":"Sentaos en una piedra del arroyo con los pies en el agua fría. Tus manos, calientes, suben por las piernas de {O} hasta donde llegue el pantalón.","suave":"Sentaos con los pies en el arroyo y calienta los pies de {O} entre tus manos al sacarlos.","tags":["hielo"]},
      {"id":"prac-e3","f":"explora","para":"uno","nivel":2,"min":35,"t":"Lo que dura un canto","x":"Cuando un pájaro cante cerca, dale a {O} un beso que dure lo mismo que el canto. Si se calla pronto, espera al siguiente.","suave":"Cada vez que cante un pájaro cerca, un beso corto a {O}."},
      {"id":"prac-e4","f":"explora","para":"uno","nivel":3,"min":40,"t":"La loma","x":"Subid a una loma desde la que el campamento se vea pequeño y lejano. Allí, a solas, quítale a {O} la prenda de arriba y abrázale por detrás mirando el paisaje.","suave":"Subid a una loma y abraza a {O} por detrás mirando el campamento a lo lejos.","tags":["aire","prenda"]},
      {"id":"prac-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"La tienda a deshora","x":"En mitad de la tarde, meteos en la tienda con la excusa de buscar algo. Cremallera cerrada y diez minutos para lo que sea, en silencio: las tiendas de al lado oyen.","suave":"Meteos diez minutos en la tienda, en un abrazo, sin hacer nada más que escuchar lo de fuera.","tags":["silencio"]},
      {"id":"prac-e6","f":"explora","para":"uno","nivel":3,"min":45,"t":"Margaritas","x":"En un prado escondido, sobre la manta, ve poniendo margaritas en la piel de {O} que vayas descubriendo. Cada flor, con su beso.","suave":"Pon margaritas en el pelo y en el cuello de {O}, con un beso por cada una.","tags":["aire","prenda"]},
      {"id":"prac-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"El baño más corto","x":"Si encontráis una poza a solas, un baño rapidísimo sin ropa en el agua de primavera, y después a entrar en calor dentro de la misma toalla, piel con piel.","suave":"Mojaos las piernas en la poza y secaos con la misma toalla, en un abrazo.","tags":["aire","agua","desnudez","hielo"]},
      {"id":"prac-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"Bajo el árbol en flor","x":"Bajo un árbol en flor y lejos de cualquier camino, desnuda a {O} hasta donde el sol deje, y que caigan pétalos sobre lo que vayas descubriendo.","suave":"Bajo un árbol en flor, tumbaos en la manta con tu mano por debajo de la ropa de {O}.","tags":["aire","desnudez"]},
      {"id":"prac-p1","f":"perdidos","temp":"seda","t":"Pétalos","x":"Desabrocha la ropa de {R} y cubre de pétalos o de hierba fresca la piel que asome. Después, quítalos uno a uno con la boca.","tags":["aire","prenda"]},
      {"id":"prac-p2","f":"perdidos","temp":"seda","t":"El sol en la espalda","x":"Que {R} se tumbe boca abajo en la manta. Súbele la ropa hasta los hombros y deja que el sol y tus manos le recorran la espalda.","tags":["aire","prenda"]},
      {"id":"prac-p3","f":"perdidos","temp":"seda","t":"Cada canto, una prenda","x":"Cada vez que cante un pájaro, quítale a {R} una prenda. Si se hace el silencio, espera: en primavera nunca tardan.","tags":["aire","prenda","desnudez"]},
      {"id":"prac-p4","f":"perdidos","temp":"brasa","t":"De la nuca a los tobillos","x":"Desnuda a {R} sobre la manta y recorre su cuerpo entero con la boca, despacio, de la nuca a los tobillos, y vuelta.","tags":["aire","desnudez","intimo"]},
      {"id":"prac-p5","f":"perdidos","temp":"brasa","t":"Sin testigos","x":"Comprobad otra vez que estáis a solas. Después, sin ropa y sin prisa, lo que pida {R}, cuando lo pida y como lo pida.","tags":["aire","desnudez","intimo","guia"]},
      {"id":"prac-p6","f":"perdidos","temp":"brasa","t":"La revisión final","x":"Antes de vestiros, revisión de garrapatas por todo el cuerpo de {R}, con los ojos y con la boca. Que no sea solo por salud.","tags":["aire","desnudez","intimo"]},
      {"id":"prac-c1","f":"cena","para":"ambos","t":"Cocinar al atardecer","x":"Cocinad algo sencillo en el hornillo, fuera de la tienda y donde se permita, mientras se va la luz. Quien no cocina, abraza por detrás a quien cocina."},
      {"id":"prac-c2","f":"cena","para":"uno","t":"Algo caliente","x":"Prepárale a {O} algo caliente y dáselo dentro del saco, con tus manos frías por debajo de su jersey para que te las caliente."},
      {"id":"prac-c3","f":"cena","para":"ambos","t":"Diez sonidos","x":"Con la cena hecha, apagad los frontales y decid en voz baja cada sonido que oigáis. Al llegar a diez, a la tienda."},
      {"id":"prac-a1","f":"alcoba","temp":"seda","t":"Luz roja","x":"Con el frontal en luz roja, desnuda a {R} dentro del saco, a tientas. Que la luz solo enseñe lo que tus manos ya saben.","tags":["prenda","desnudez"]},
      {"id":"prac-a2","f":"alcoba","temp":"seda","t":"El fresco de fuera","x":"Abre un poco la cremallera para que entre el fresco, y calienta con tu cuerpo cada sitio de {R} donde se le erice la piel.","tags":[]},
      {"id":"prac-a3","f":"alcoba","temp":"seda","t":"El arroyo de noche","x":"Escuchad el arroyo en silencio. A su ritmo, tus manos recorren a {R} dentro del saco, sin prisa, por donde te deje.","tags":[]},
      {"id":"prac-a4","f":"alcoba","temp":"brasa","t":"La tela no guarda secretos","x":"Durante una canción, haz que a {R} le cueste no hacer ruido: las tiendas de al lado oyen. Tu boca, por donde te deje.","tags":["silencio","intimo"]},
      {"id":"prac-a5","f":"alcoba","temp":"brasa","t":"Un solo saco","x":"Meteos en un solo saco, sin nada entre los cuerpos. Lo que se pueda hacer sin espacio, que es mucho, a vuestro ritmo.","tags":["desnudez","intimo"]},
      {"id":"prac-a6","f":"alcoba","temp":"brasa","t":"El coro del amanecer","x":"Cuando empiecen los pájaros, no os levantéis: que {R} se despierte con tu boca, despacio, y decida cuándo se acaba la noche.","tags":["desnudez","intimo"]},
      {"id":"prac-p7","f":"perdidos","temp":"brasa","t":"El arroyo","tags":["aire","intimo"],"x":"Junto al arroyo, sin nadie a la vista, moja tus manos en el agua fría y recorre a {R} por dentro de la ropa. Después devuélvele el calor con la boca, cada vez más abajo, hasta donde te deje."},
      {"id":"prac-a7","f":"alcoba","temp":"brasa","t":"La cremallera a medias","tags":["borde","intimo"],"x":"Dentro del saco y a oscuras, acaricia a {R} donde más lo note y para justo antes del final. Tres veces, despacio. A la cuarta, la cremallera se abre del todo."}
    ]},
    "verano/hotel": {"titulo": "Verano en el pueblo", "gancho": "Un pueblo de montaña que huele a hierba seca, siestas con las contraventanas cerradas y una poza a un paseo. De noche, terrazas, grillos y la verbena a lo lejos.", "lugar": "Un pueblo pequeño de interior o de montaña, con río o pozas cerca. Una habitación fresca, mejor con ventilador o contraventanas de madera.", "consejos": ["Las pozas cercanas a los pueblos se llenan en agosto: id a primera hora o al atardecer, y caminad un poco más que el resto.", "Si hay fiestas, el pueblo no duerme: buscad fechas tranquilas o una habitación lejos de la plaza."], "material": ["Bañador, o no", "Un abanico", "Agua fría en un termo"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido monte arriba, donde el pueblo ya no llega. Huele a tomillo caliente y solo se oyen las chicharras.", "Antes de nada: nadie a la vista, nadie que pueda llegar sin que lo oigáis, sombra cerca y agua de sobra. Si falta algo, buscad otro sitio.", "Extended la manta. Desde aquí las cartas suben hasta el final. Si aparece alguien, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["La noche de verano entra por la ventana: grillos, alguna risa lejana, olor a tierra regada.", "Cerrad la puerta, dejad la ventana abierta solo si nadie puede veros y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que amanezca."]}}, "propuestas": [
      {"id":"veho-v1","f":"viaje","para":"copi","t":"Quitar el calor","x":"Cuando el aire del coche se ponga fresco, cuéntale a {O} cómo vas a quitarle el calor esta tarde, empezando por la nuca."},
      {"id":"veho-v2","f":"viaje","para":"copi","t":"Un solo helado","x":"Anuncia a {O} que en la próxima parada habrá un solo helado para compartir, cada cual mordiendo por su lado hasta encontrarse en el medio."},
      {"id":"veho-v3","f":"viaje","para":"copi","t":"El baile de esta noche","x":"Pon una canción de verbena y prométele a {O} el baile de esta noche: dónde, cómo de cerca y qué pasará cuando acabe la canción."},
      {"id":"veho-l1","f":"llegada","para":"uno","nivel":2,"t":"Ducha fría","x":"Nada más llegar, ducha fría para quitarse el viaje. Métete con {O}, o espérale fuera con la toalla abierta.","tags":["agua"]},
      {"id":"veho-l2","f":"llegada","para":"ambos","nivel":1,"t":"Contraventanas","x":"Cerrad las contraventanas para guardar el fresco. En la penumbra, decid en voz baja cuál va a ser vuestra hora del día, y para qué."},
      {"id":"veho-l3","f":"llegada","para":"uno","nivel":2,"t":"El ventilador","x":"Pon el ventilador a tope y túmbate con {O} en la cama, con lo imprescindible puesto, a dejar que el aire os seque el viaje.","tags":["prenda"]},
      {"id":"veho-l4","f":"llegada","para":"uno","nivel":1,"t":"La fuente del pueblo","x":"Lleva a {O} a beber a la fuente del pueblo y mójale la nuca con la mano. El beso, con los labios todavía fríos."},
      {"id":"veho-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"El abanico","x":"A la sombra de la plaza, abanica a {O} y susúrrale, entre abanicada y abanicada, lo que harás con su piel cuando baje el sol.","suave":"Abanica a {O} a la sombra de la plaza un buen rato, sin decir nada.","tags":["voz"]},
      {"id":"veho-e2","f":"explora","para":"uno","nivel":2,"min":35,"t":"Callejones a la siesta","x":"A la hora de la siesta el pueblo está vacío: recorred los callejones y, en cada esquina con sombra, un beso más largo que el anterior.","suave":"Recorred los callejones a la siesta, con un beso corto en cada esquina con sombra."},
      {"id":"veho-e3","f":"explora","para":"uno","nivel":2,"min":35,"t":"Agua de fuente","x":"Moja la mano en una fuente y pásala por la nuca de {O}, por el cuello y, si nadie mira, por dentro del cuello de su camiseta, hacia abajo.","suave":"Moja la mano en una fuente y refresca la nuca y el cuello de {O}."},
      {"id":"veho-e4","f":"explora","para":"uno","nivel":3,"min":45,"t":"El tramo vacío","x":"Bajad al río por el camino más largo y menos transitado. Si encontráis un tramo a solas, os bañáis en ropa interior… o en lo que quede.","suave":"Bajad al río y mojaos los pies en un tramo tranquilo, en un abrazo.","tags":["aire","agua","desnudez"]},
      {"id":"veho-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"La siesta de verdad","x":"Volved a la habitación a la hora de la siesta, cerrad las contraventanas y echaos sin nada encima. Dormir es opcional.","suave":"Volved a la habitación a la siesta y dormidla en un abrazo, con el ventilador encendido.","tags":["desnudez"]},
      {"id":"veho-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Un vaso con hielo","x":"Pide un vaso con hielo en el bar del pueblo y llévatelo a la habitación. Lo que hagas con él en la piel de {O}, lo decides tú.","suave":"En la terraza del bar, pasa un hielo por la nuca de {O} cuando menos se lo espere.","tags":["hielo"]},
      {"id":"veho-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"La era al atardecer","x":"Al atardecer, buscad un claro o una era abandonada lejos del pueblo y de los caminos. Sobre la manta, con el calor que sube de la tierra, desnuda a {O} hasta donde la soledad deje.","suave":"Al atardecer, tumbaos en la manta a ver caer el sol, con tu mano por debajo de la ropa de {O}.","tags":["aire","desnudez"]},
      {"id":"veho-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"La poza cuando se va la gente","x":"Cuando se vaya la gente, volved a la poza: baño sin ropa con la última luz, y lo que venga después en la orilla, a solas de verdad.","suave":"Al anochecer, un baño en la poza con lo puesto y un beso largo en la orilla.","tags":["aire","agua","desnudez","intimo"]},
      {"id":"veho-p1","f":"perdidos","temp":"seda","t":"Las chicharras","x":"Mientras canten las chicharras, tus manos recorren a {R} por debajo de la ropa, despacio. Cada vez que callen, una prenda menos.","tags":["aire","prenda"]},
      {"id":"veho-p2","f":"perdidos","temp":"seda","t":"Agua del termo","x":"Echa un chorrito de agua fría en el cuello de {R} y síguelo con la boca por donde baje, desabrochando lo que estorbe.","tags":["aire","prenda","hielo"]},
      {"id":"veho-p3","f":"perdidos","temp":"seda","t":"A la sombra","x":"Tumba a {R} a la sombra sobre la manta, quítale la ropa de arriba y abanícale despacio con lo que tengas a mano. Entre abanicada y abanicada, un beso.","tags":["aire","prenda"]},
      {"id":"veho-p4","f":"perdidos","temp":"brasa","t":"Piel caliente, boca fría","x":"Desnuda a {R} a la sombra y recorre su cuerpo, caliente de sol, con la boca fría de beber agua. Despacio, por delante y por detrás.","tags":["aire","desnudez","intimo"]},
      {"id":"veho-p5","f":"perdidos","temp":"brasa","t":"La siesta del monte","x":"A la hora en que el monte duerme, sin ropa y sobre la manta, que {R} se deje hacer. Tú, sin prisa: el calor pide que todo vaya lento.","tags":["aire","desnudez","intimo"]},
      {"id":"veho-p6","f":"perdidos","temp":"brasa","t":"Nadie en kilómetros","x":"Si de verdad no hay nadie en kilómetros, olvidaos de la ropa y de las cartas. Lo que pida el cuerpo de {R}, a la sombra y a su ritmo.","tags":["aire","desnudez","intimo"]},
      {"id":"veho-c1","f":"cena","para":"ambos","t":"El primer murciélago","x":"Cenad en una terraza, tarde, cuando refresque. Quien vea el primer murciélago elige qué hacéis después de cenar."},
      {"id":"veho-c2","f":"cena","para":"uno","t":"La mano fría","x":"Con la excusa del calor, deja tu mano fría de la copa en la rodilla de {O}, bajo la mesa, y súbela un poco con cada plato."},
      {"id":"veho-c3","f":"cena","para":"ambos","t":"Un solo auricular","x":"Si hay verbena, un baile lento en la plaza, más cerca de lo que es costumbre. Si no la hay, bailadlo en una calle vacía, con la música en un solo auricular."},
      {"id":"veho-a1","f":"alcoba","temp":"seda","t":"Sin sábana","x":"Hace demasiado calor para sábanas. Desnuda a {R} sobre la cama y recórrele la piel con un cubito de hielo, despacio, y detrás, tu boca.","tags":["desnudez","hielo"]},
      {"id":"veho-a2","f":"alcoba","temp":"seda","t":"Lo que borra el aire","x":"Con el ventilador girando, dibuja en la espalda de {R}, con un dedo mojado, lo que vas a hacerle. Que el aire lo vaya borrando.","tags":[]},
      {"id":"veho-a3","f":"alcoba","temp":"seda","t":"Ducha tibia","x":"Una ducha tibia para quitaros el día, a la vez y sin prisa. Lava todo el cuerpo de {R}, de la nuca a los pies, y sécale con besos.","tags":["agua","desnudez"]},
      {"id":"veho-a4","f":"alcoba","temp":"brasa","t":"Grillos","x":"Ventana abierta solo si nadie puede veros, luz apagada y grillos fuera. Durante una canción, que lo único que se oiga dentro sea {R}. Tu boca, por donde te deje.","tags":["intimo"]},
      {"id":"veho-a5","f":"alcoba","temp":"brasa","t":"La sal del día","x":"Recorre a {R} con la boca buscando el sabor a sal del día, sin saltarte ningún rincón de los que te deje.","tags":["desnudez","intimo"]},
      {"id":"veho-a6","f":"alcoba","temp":"brasa","t":"La noche corta","x":"En verano la noche dura poco: aprovechadla entera. Lo que queráis, como queráis, hasta que entre la luz o {R} diga basta.","tags":["desnudez","intimo"]},
      {"id":"veho-p7","f":"perdidos","temp":"brasa","t":"La poza a solas","tags":["aire","agua","desnudez","intimo"],"x":"Si encontráis una poza a solas de verdad, métete en el agua con {R} sin nada encima y que tus manos hagan bajo el agua lo que fuera no se atreverían. Si aparece alguien, al agua hasta el cuello."},
      {"id":"veho-a7","f":"alcoba","temp":"brasa","t":"El hielo del minibar","tags":["hielo","intimo"],"x":"Saca un hielo del minibar y recorre a {R} con él, de la boca al vientre y más abajo, hasta que se derrita. Después, todo el camino otra vez con la boca, para devolverle el calor."}
    ]},
    "verano/furgo": {"titulo": "Verano en furgo", "gancho": "Un embalse de agua verde con calas escondidas, pinos que huelen a resina y una noche llena de estrellas con la puerta de la furgo abierta.", "lugar": "Un pantano, un lago o un río ancho con orillas tranquilas y aparcamiento permitido a la sombra, lejos de las zonas de baño con chiringuito.", "consejos": ["Dentro de una furgo al sol se pasa mucho calor: aparcad a la sombra de tarde y dormid con mosquiteras en las ventanas.", "En los pantanos el agua cubre de golpe y el fondo engaña: entrad despacio y nunca de cabeza."], "material": ["Mosquiteras para las ventanas", "Una toalla grande para compartir", "Una garrafa o ducha solar"], "cartas": {"perdidos": {"parrafos": ["Os habéis perdido en la otra orilla, la que no tiene camino. Desde aquí la furgo es un punto blanco entre los pinos.", "Antes de nada: nadie en el agua, nadie en la orilla, nadie que pueda llegar sin que lo oigáis. Agua para beber y sombra cerca.", "Extended la toalla grande. Desde aquí las cartas suben hasta el final. Si aparece una barca o alguien bañándose, ropa y a otra cosa, sin dramas."]}, "alcoba": {"parrafos": ["La noche en la orilla es tibia y llena de ruidos pequeños: el agua, algún pez que salta, los grillos.", "Cerrad las cortinas que miran a donde pueda pasar alguien, mosquiteras en el resto, y sacad las cartas que escribisteis antes de salir. Leedlas en voz alta.", "Desde aquí no hay propuestas ni retos. Si queréis, quedan cartas para la noche; si no, solo vuestros NO, hasta que amanezca sobre el agua."]}}, "propuestas": [
      {"id":"vefu-v1","f":"viaje","para":"copi","t":"Una cita con el cielo","x":"Busca qué planetas se verán esta noche o cuándo es la próxima lluvia de estrellas, y cuéntaselo a {O} como si fuera una cita. Porque lo es."},
      {"id":"vefu-v2","f":"viaje","para":"copi","t":"La primera orilla","x":"Dile a {O} qué será lo primero que haréis al ver el agua: con ropa o sin ella, y en qué orden."},
      {"id":"vefu-v3","f":"viaje","para":"copi","t":"Dónde empieza el agua","x":"Pregúntale a {O} qué parte de su cuerpo tiene más calor ahora mismo. Apúntalo: esta tarde, el agua fría empieza por ahí."},
      {"id":"vefu-l1","f":"llegada","para":"ambos","nivel":1,"t":"La sombra que dura","x":"Buscad para la furgo una sombra de las que duran toda la tarde. Al encontrarla, abrid todas las puertas y dejad que corra el aire."},
      {"id":"vefu-l2","f":"llegada","para":"uno","nivel":2,"t":"El primer baño","x":"Antes de deshacer nada, el primer baño: lleva a {O} de la mano hasta el agua y no le sueltes hasta que estéis dentro.","tags":["agua"]},
      {"id":"vefu-l3","f":"llegada","para":"uno","nivel":2,"t":"La crema","x":"Ponle a {O} la crema solar despacio, como si fuera un masaje: la espalda, los hombros y el borde del bañador, sin prisa."},
      {"id":"vefu-l4","f":"llegada","para":"uno","nivel":1,"t":"Mosquiteras","x":"Mientras pones las mosquiteras, cuéntale a {O} qué vas a hacer esta noche con todas las ventanas abiertas.","tags":["voz"]},
      {"id":"vefu-e1","f":"explora","para":"uno","nivel":1,"min":30,"t":"Quién aguanta más","x":"Desafía a {O} a ver quién aguanta más rato dentro del agua fría. Quien pierda paga con un beso largo bajo el agua.","suave":"Un chapuzón a la vez, y un beso al salir.","tags":["agua"]},
      {"id":"vefu-e2","f":"explora","para":"uno","nivel":2,"min":40,"t":"La pinocha","x":"A la sombra de los pinos, sobre la manta, túmbate con {O} y que tus manos le quiten el calor por debajo de la camiseta.","suave":"A la sombra de los pinos, una siesta en un abrazo.","tags":["aire"]},
      {"id":"vefu-e3","f":"explora","para":"uno","nivel":2,"min":35,"t":"Crema a media tarde","x":"Vuelve a ponerle crema a {O}, más despacio que la primera vez y por todo lo que el bañador deje, como si en la orilla no hubiera nadie más.","suave":"Vuelve a ponerle crema a {O} en la espalda y los hombros, despacio."},
      {"id":"vefu-e4","f":"explora","para":"uno","nivel":3,"min":45,"t":"La cala","x":"Buscad una cala del pantano sin nadie a la vista. Dentro del agua, quítale a {O} la parte de arriba y devuélvesela solo si la pide.","suave":"En una cala tranquila, abraza a {O} dentro del agua hasta que deje de tener frío.","tags":["aire","agua","prenda"]},
      {"id":"vefu-e5","f":"explora","para":"uno","nivel":3,"min":40,"t":"La ducha detrás de la furgo","x":"Con la garrafa o la ducha solar, dúchale a {O} detrás de la furgo, por el lado que no ve nadie, en bañador… o sin él.","suave":"Échale a {O} agua fresca por la espalda con la garrafa y sécale con tu toalla.","tags":["aire","agua","desnudez"]},
      {"id":"vefu-e6","f":"explora","para":"uno","nivel":3,"min":40,"t":"Dentro hace calor","x":"Volved a la furgo y echad las cortinas: dentro hace calor, así que fuera ropa y a tumbarse sobre la sábana fresca.","suave":"Volved a la furgo y tumbaos con ropa ligera y el ventilador a pilas, en un abrazo.","tags":["desnudez"]},
      {"id":"vefu-e7","f":"explora","para":"uno","nivel":4,"min":50,"t":"Cuando la orilla se vacía","x":"Cuando el sol baje y la orilla se vacíe, entrad en el agua sin ropa. Lo que pase después, en el agua o en la toalla, solo si estáis a solas de verdad.","suave":"Al atardecer, entrad en el agua en bañador y quedaos en un abrazo hasta que se ponga el sol.","tags":["aire","agua","desnudez","intimo"]},
      {"id":"vefu-e8","f":"explora","para":"uno","nivel":4,"min":50,"t":"La puerta hacia el agua","x":"Con la puerta grande abierta hacia el pantano y nadie en la orilla, desnuda a {O} en la cama mientras mira el agua. Tú, mirando a {O}.","suave":"Tumbaos en la cama mirando el agua por la puerta abierta, con tu mano por debajo de la ropa de {O}.","tags":["aire","desnudez","intimo"]},
      {"id":"vefu-p1","f":"perdidos","temp":"seda","t":"Gotas","x":"Moja tus manos en el pantano y deja que el agua baje por la espalda de {R}. Tus labios recogen cada gota antes de que llegue a la toalla.","tags":["aire"]},
      {"id":"vefu-p2","f":"perdidos","temp":"seda","t":"Bajo un pino solo","x":"Bajo un pino solitario, quítale a {R} lo que lleve de cintura para arriba y recórrele con las yemas de los dedos al ritmo de las chicharras.","tags":["aire","prenda"]},
      {"id":"vefu-p3","f":"perdidos","temp":"seda","t":"El bañador en la mano","x":"Quítale a {R} el bañador dentro del agua, despacio, y guárdalo en tu mano. Lo devuelves cuando lo pida… si lo pide.","tags":["aire","agua","desnudez"]},
      {"id":"vefu-p4","f":"perdidos","temp":"brasa","t":"Lo que el agua esconde","x":"Dentro del agua, donde hagáis pie y estéis a solas, que tu cuerpo se pegue al de {R} y tus manos recorran lo que el agua esconde.","tags":["aire","agua","desnudez","intimo"]},
      {"id":"vefu-p5","f":"perdidos","temp":"brasa","t":"Luz entre los pinos","x":"Sobre la toalla y sin ropa, recorre a {R} con la boca de la cabeza a los pies, despacio, con el sol colándose entre los pinos.","tags":["aire","desnudez","intimo"]},
      {"id":"vefu-p6","f":"perdidos","temp":"brasa","t":"Antes de que se ponga el sol","x":"Sin cartas ni ropa, en la orilla o en el agua, lo que pida {R}, como lo pida. Que el sol se ponga antes de que acabéis.","tags":["aire","desnudez","intimo"]},
      {"id":"vefu-c1","f":"cena","para":"ambos","t":"Cena en el borde","x":"Cenad en el borde de la puerta abierta, con los pies fuera y algo fresco: fruta, queso, una botella. Que os pille el anochecer con la boca llena.","tags":["comida"]},
      {"id":"vefu-c2","f":"cena","para":"uno","t":"El zumo","x":"Dale a {O} sandía o melocotón con tus dedos y deja que el zumo caiga donde caiga. Recogerlo es cosa tuya.","tags":["comida"]},
      {"id":"vefu-c3","f":"cena","para":"ambos","t":"Estrellas desde la cama","x":"Apagad todo y tumbaos en la cama con la puerta abierta al cielo. Cada estrella fugaz, un deseo al oído; cada satélite, un beso."},
      {"id":"vefu-a1","f":"alcoba","temp":"seda","t":"La sábana fresca","x":"Sobre una sábana fresca y nada más, desnuda a {R} despacio, con la puerta entornada para que corra el aire.","tags":["prenda","desnudez"]},
      {"id":"vefu-a2","f":"alcoba","temp":"seda","t":"Agua de la garrafa","x":"Moja una toalla pequeña con agua de la garrafa y refresca a {R} de la nuca a los pies. Después, el calor lo pones tú.","tags":["hielo"]},
      {"id":"vefu-a3","f":"alcoba","temp":"seda","t":"Estrellas por la puerta","x":"Contad estrellas por la claraboya o por la puerta. Por cada una, un beso en un sitio nuevo de {R}.","tags":[]},
      {"id":"vefu-a4","f":"alcoba","temp":"brasa","t":"La noche fuera","x":"Con la puerta entornada y la noche fuera, tu boca recorre todo el cuerpo de {R}, sin prisa, sin saltarte nada de lo que te deje.","tags":["desnudez","intimo"]},
      {"id":"vefu-a5","f":"alcoba","temp":"brasa","t":"El calor de dentro","x":"Que el calor de la furgo sea vuestro: sin ropa, sin sábana y sin prisa, lo que pida {R}.","tags":["desnudez","intimo"]},
      {"id":"vefu-a6","f":"alcoba","temp":"brasa","t":"Amanecer en el agua","x":"Si os pilla el amanecer, un baño sin ropa en el agua vacía y de vuelta a la cama con el agua todavía en la piel. Lo que empiece ahí, al ritmo de {R}.","tags":["aire","agua","desnudez","intimo"]},
      {"id":"vefu-p7","f":"perdidos","temp":"brasa","t":"La ducha solar","tags":["aire","desnudez","intimo"],"x":"Con la ducha solar de la furgo o una garrafa calentada al sol, y a solas de verdad, lava a {R} sin ropa, despacio y por todas partes. Después, sécale con la boca."},
      {"id":"vefu-a7","f":"alcoba","temp":"brasa","t":"Las ventanas abiertas","tags":["desnudez","intimo"],"x":"Con las ventanas abiertas a la noche y sin ropa por el calor, haced el amor tan despacio que no haga falta el ventilador, al ritmo que marque {R}."}
    ]},
